recio = self.precio_galon_vigente()\n        rend, fuente = self.rendimiento_usado()\n        gas_km = r(\"Costo gasolina por km\", \"precio_galón / rendimiento_km_galón\",\n                   {\"precio_galon\": precio, \"rendimiento\": round(rend, 2), \"fuente\": fuente}, precio / rend)\n        gasolina = r(\"Gasolina del día\", \"km_totales × costo_gasolina_km\",\n                     {\"km_totales\": km_tot, \"costo_km\": round(gas_km, 2)}, km_tot * gas_km)\n\n        def costo_km(cat):\n            items = [m for m in p.mantenimientos if m.categoria == cat]\n            return r(f\"Costo {cat} por km\", \"Σ (costo / intervalo_km)\",\n                     {i.nombre: f\"{i.costo}/{i.intervalo_km}\" for i in items},\n                     float(sum(i.costo / i.intervalo_km for i in items)))\n\n        aceite_km, llantas_km, mant_km = costo_km(\"aceite\"), costo_km(\"llantas\"), costo_km(\"general\")\n        docs = self._documentos_vigentes()\n        prov_docs = r(\"Provisión documentos por día\", \"(valor SOAT + valor RTM) / 365\",\n                      {d.tipo: d.valor for d in docs}, sum(d.valor for d in docs) / 365)\n        prov_mant = r(\"Provisión mantenimiento del día\",\n                      \"km_totales × (aceite_km + llantas_km + mant_km) + provisión_documentos\",\n                      {\"km_totales\": km_tot, \"aceite_km\": aceite_km, \"llantas_km\": llantas_km,\n                       \"mant_km\": mant_km, \"prov_docs\": round(prov_docs, 2)},\n                      km_tot * (aceite_km + llantas_km + mant_km) + prov_docs)\n        extras = r(\"Gastos extra del día\", \"Σ gastos de la fecha\", {\"fecha\": str(j.fecha)},\n                   float(sum(g.valor for g in p.gastos if g.fecha == j.fecha)))\n\n        utilidad = r(\"Utilidad neta\", \"bruto + propinas − comisión − gasolina − provisión − gastos extra\",\n                     {\"bruto\": bruto, \"propinas\": propinas, \"comision\": comision, \"gasolina\": gasolina,\n                      \"provision\": round(prov_mant, 2), \"extras\": extras},\n                     bruto + propinas - comision - gasolina - prov_mant - extras)\n        ahorro = r(\"Ahorro sugerido\", \"máx(0, utilidad × % ahorro)\",\n                   {\"utilidad\": round(utilidad, 2), \"pct\": cfg.porcentaje_ahorro}, max(0.0, utilidad * cfg.porcentaje_ahorro))\n        util_hora = r(\"Utilidad por hora\", \"utilidad / horas\", {\"utilidad\": round(utilidad, 2), \"horas\": horas},\n                      utilidad / horas if horas else 0.0)\n        ingreso_km = r(\"Ingreso por km (día)\", \"bruto / km_totales\", {\"bruto\": bruto, \"km_totales\": km_tot},\n                       bruto / km_tot if km_tot else 0.0)\n        clase = r(\"Clasificación del día\", \"umbral según $/km\", {\"ingreso_km\": round(ingreso_km, 2)},\n                  clasificar_ingreso_km(ingreso_km, cfg))\n        viajes_hora = r(\"Viajes por hora\", \"número de viajes / horas trabajadas\", {\"viajes\": n, \"horas\": round(horas, 2)},\n                        n / horas if horas else 0.0)\n        ingreso_hora = r(\"Ingreso por hora (día)\", \"ingreso bruto / horas trabajadas\",\n                         {\"bruto\": bruto, \"horas\": round(horas, 2)}, bruto / horas if horas else 0.0)\n        clase_hora = r(\"Clasificación por hora\", \"umbral según $/hora\", {\"ingreso_hora\": round(ingreso_hora, 2)},\n                       clasificar_ingreso_hora(ingreso_hora, cfg))\n\n        return {\n            \"jornada\": j.id, \"fecha\": j.fecha, \"viajes\": n, \"horas\": round(horas, 2),\n            \"km_totales\": km_tot, \"km_pasajero\": km_pas, \"km_vacio\": km_vacio,\n            \"ingreso_bruto\": bruto, \"propinas\": propinas, \"comision\": round(comision, 2),\n            \"costo_gasolina_km\": round(gas_km, 2), \"gasolina\": round(gasolina, 2),\n            \"aceite_km\": round(aceite_km, 2), \"llantas_km\": round(llantas_km, 2), \"mantenimiento_km\": round(mant_km, 2),\n            \"aceite\": round(km_tot * aceite_km, 2), \"llantas\": round(km_tot * llantas_km, 2),\n            \"mantenimiento\": round(km_tot * mant_km, 2),\n            \"provision_documentos\": round(prov_docs, 2), \"provision_total\": round(prov_mant, 2),\n            \"gastos_extra\": extras, \"utilidad_neta\": round(utilidad, 2), \"ahorro\": round(ahorro, 2),\n            \"disponible\": round(utilidad - ahorro, 2), \"utilidad_hora\": round(util_hora, 2),\n            \"ingreso_km\": round(ingreso_km, 2), \"clasificacion\": clase,\n            \"viajes_hora\": round(viajes_hora, 2), \"ingreso_hora\": round(ingreso_hora, 2),\n            \"clasificacion_hora\": clase_hora,\n        }\n\n    # ---------------- Viajes y valor por cada hora ----------------\n    def corte_jornada(self, j: Jornada) -> datetime:\n        \"\"\"Hasta dónde se cuentan las horas: el cierre si la jornada está cerrada; si sigue abierta,\n        la hora actual o el fin del último viaje registrado, lo que sea más tarde.\"\"\"\n        if j.fin:\n            return j.fin\n        ultimo = max((v.fin for v in j.viajes), default=j.inicio)\n        return max(ahora(), ultimo)\n\n    def metricas_hora(self, jornada_id: int, registrar: bool = False) -> dict:\n        \"\"\"Cálculo único de horas trabajadas, viajes por hora e ingreso por hora.\n        Lo usan Jornada de hoy, Viajes por hora, el Tablero y el reporte diario.\"\"\"\n        j = self._jornada(jornada_id)\n        corte = self.corte_jornada(j)\n        pausa_h = self.horas_pausa(j, j.inicio, corte)\n        horas = max(0.0, (corte - j.inicio).total_seconds() / 3600 - pausa_h)\n        n = len(j.viajes)\n        bruto = float(sum(v.valor for v in j.viajes))\n        viajes_hora = n / horas if horas else 0.0\n        ingreso_hora = bruto / horas if horas else 0.0\n        clase = clasificar_ingreso_hora(ingreso_hora, self.cfg)\n        m = {\"jornada\": j.id, \"fecha\": j.fecha, \"en_curso\": not j.cerrada, \"inicio\": j.inicio, \"corte\": corte,\n             \"horas\": round(horas, 2), \"pausas_horas\": round(pausa_h, 2), \"en_pausa\": j.pausa_abierta is not None,\n             \"viajes\": n, \"ingreso\": bruto, \"km_pasajero\": float(sum(v.km_pasajero for v in j.viajes)),\n             \"viajes_hora\": round(viajes_hora, 2), \"ingreso_hora\": round(ingreso_hora, 2), \"clasificacion_hora\": clase}\n        if registrar:\n            estado = \"en curso\" if m[\"en_curso\"] else \"cerrada\"\n            self._r(\"Viajes por hora\", f\"Corte jornada {j.id} ({estado}) a las {corte:%H:%M}\",\n                    \"horas = corte − inicio − pausas; viajes/hora = viajes / horas; ingreso/hora = ingreso bruto / horas\",\n                    {\"inicio\": f\"{j.inicio:%H:%M}\", \"corte\": f\"{corte:%H:%M}\", \"pausas_h\": round(pausa_h, 2),\n                     \"horas\": round(horas, 2),\n                     \"viajes\": n, \"ingreso\": bruto},\n                    f\"{viajes_hora:.2f} viajes/h · {cop(ingreso_hora)}/h · {clase}\")\n        return m\n\n    # ---------------- Día trabajado (00:00 a 24:00) ----------------\n    # ---------------- Numeración de viajes por día ----------------\n    def viajes_del_dia(self, fecha: date) -> list:\n        \"\"\"Todos los viajes que empezaron ese día (de todos los turnos), en orden de hora.\"\"\"\n        return sorted((v for j in self.perfil.jornadas for v in j.viajes if v.inicio.date() == fecha),\n                      key=lambda v: (v.inicio, v.id))\n\n    def numero_viaje(self, viaje) -> int:\n        \"\"\"Número del viaje dentro de su día: el primer servicio del día es el #1.\"\"\"\n        for n, v in enumerate(self.viajes_del_dia(viaje.inicio.date()), start=1):\n            if v.id == viaje.id:\n                return n\n        return 0\n\n    # ---------------- Actor: Billetera ----------------\n    def registrar_movimiento(self, fecha: datetime, tipo: str, cuenta: str, valor: float,\n                             concepto: str = \"\", cuenta_destino: Optional[str] = None) -> MovimientoBilletera:\n        if tipo not in TIPOS_MOVIMIENTO:\n            raise ErrorValidacion(f\"Tipo de movimiento no válido: {tipo}.\")\n        cuenta = normalizar_pago(cuenta)\n        if valor <= 0:\n            raise ErrorValidacion(\"El valor del movimiento debe ser mayor que cero.\")\n        if tipo == \"Traslado\":\n            if not cuenta_destino:\n                raise ErrorValidacion(\"Elige la cuenta a la que pasa el dinero.\")\n            cuenta_destino = normalizar_pago(cuenta_destino)\n            if cuenta_destino == cuenta:\n                raise ErrorValidacion(\"La cuenta de origen y la de destino deben ser distintas.\")\n        else:\n            cuenta_destino = None\n        m = MovimientoBilletera(fecha, tipo, cuenta, valor, concepto.strip(), cuenta_destino)\n        self.perfil.movimientos.append(m)\n        destino = f\" → {cuenta_destino}\" if cuenta_destino else \"\"\n        self.traza.evento(\"Billetera\", f\"{tipo}: {cuenta}{destino} {cop(valor)} {concepto}\".strip(), self.sesion)\n        return m\n\n    def eliminar_movimiento(self, m: MovimientoBilletera):\n        self.perfil.movimientos.remove(m)\n        self.traza.evento(\"Billetera\", f\"Movimiento eliminado: {m.tipo} {m.cuenta} {cop(m.valor)} \"\n                                       f\"del {m.fecha:%d/%m/%Y}\", self.sesion)\n\n    def cobrado_por_medio(self, desde: Optional[date] = None, hasta: Optional[date] = None) -> dict:\n        \"\"\"Lo que pagaron los pasajeros (valor + propina) por cada medio de pago.\"\"\"\n        total = {m: 0.0 for m in METODOS_PAGO}\n        for j in self.perfil.jornadas:\n            for v in j.viajes:\n                d = v.inicio.date()\n                if (desde and d < desde) or (hasta and d > hasta):\n                    continue\n                total[normalizar_pago(v.metodo_pago)] += v.valor + v.propina\n        return total\n\n    def saldos_billetera(self, hasta: Optional[date] = None) -> pd.DataFrame:\n        \"\"\"Saldo de cada cuenta = saldo inicial + cobrado en viajes + entradas − salidas ± traslados.\"\"\"\n        filas = {m: {\"cuenta\": m, \"saldo_inicial\": 0.0, \"viajes\": 0.0, \"entradas\": 0.0, \"salidas\": 0.0,\n                     \"traslados\": 0.0} for m in METODOS_PAGO}\n        for cuenta, valor in self.cobrado_por_medio(hasta=hasta).items():\n            filas[cuenta][\"viajes\"] = valor\n        for m in self.perfil.movimientos:\n            if hasta and m.fecha.date() > hasta:\n                continue\n            if m.tipo == \"Saldo inicial\":\n                filas[m.cuenta][\"saldo_inicial\"] += m.valor\n            elif m.tipo == \"Entrada\":\n                filas[m.cuenta][\"entradas\"] += m.valor\n            elif m.tipo == \"Salida\":\n                filas[m.cuenta][\"salidas\"] += m.valor\n            else:\n                filas[m.cuenta][\"traslados\"] -= m.valor\n                filas[m.cuenta_destino][\"traslados\"] += m.valor\n        df = pd.DataFrame(filas.values())\n        df[\"saldo\"] = df[\"saldo_inicial\"] + df[\"viajes\"] + df[\"entradas\"] - df[\"salidas\"] + df[\"traslados\"]\n        return df\n\n    @staticmethod\n    def limites_dia(fecha: date):\n        inicio = datetime.combine(fecha, datetime.min.time())\n        return inicio, inicio + timedelta(days=1)\n\n    def turnos_del_dia(self, fecha: date, incluir_abierta: bool = True) -> list:\n        \"\"\"Parte de cada turno (jornada) que cae dentro del día. Un turno que pasa la medianoche\n        se divide: sus horas y sus km se reparten en proporción al tiempo de cada día.\"\"\"\n        d0, d1 = self.limites_dia(fecha)\n        partes = []\n        for j in self.perfil.jornadas:\n            if not j.cerrada and not incluir_abierta:\n                continue\n            fin = self.corte_jornada(j)\n            a, b = max(j.inicio, d0), min(fin, d1)\n            if b <= a:\n                continue\n            duracion = (fin - j.inicio).total_seconds()\n            fraccion = (b - a).total_seconds() / duracion if duracion else 1.0\n            km = (j.odometro_final - j.odometro_inicial) * fraccion if j.cerrada else None\n            pausa_h = self.horas_pausa(j, a, b)\n            partes.append({\"jornada\": j.id, \"inicio\": a, \"fin\": b, \"en_curso\": not j.cerrada,\n                           \"horas\": (b - a).total_seconds() / 3600 - pausa_h, \"pausa_h\": pausa_h,\n                           \"pausas\": [(max(x, a), min(y or b, b)) for x, y in j.pausas if x < b and (y or b) > a],\n                           \"en_pausa\": j.pausa_abierta is not None, \"fraccion\": fraccion, \"km\": km,\n                           \"viajes\": [v for v in j.viajes if d0 <= v.inicio < d1],\n                           \"dividido\": fraccion < 0.9999})\n        return sorted(partes, key=lambda t: t[\"inicio\"])\n\n    def dias_trabajados(self, incluir_abierta: bool = True) -> list:\n        dias = set()\n        for j in self.perfil.jornadas:\n            if not j.cerrada and not incluir_abierta:\n                continue\n            fin, d = self.corte_jornada(j), j.inicio.date()\n            while datetime.combine(d, datetime.min.time()) < fin:\n                dias.add(d)\n                d += timedelta(days=1)\n        return sorted(dias)\n\n    def metricas_dia(self, fecha: date, registrar: bool = False) -> dict:\n        \"\"\"Horas, viajes por hora e ingreso por hora de TODO el día (todos los turnos, incluido el abierto).\"\"\"\n        turnos = self.turnos_del_dia(fecha)\n        horas = sum(t[\"horas\"] for t in turnos)\n        viajes = [v for t in turnos for v in t[\"viajes\"]]\n        bruto = float(sum(v.valor for v in viajes))\n        pausas = sum(max(0.0, (b[\"inicio\"] - a[\"fin\"]).total_seconds() / 3600) for a, b in zip(turnos, turnos[1:])) \\\n            + sum(t[\"pausa_h\"] for t in turnos)\n        viajes_hora = len(viajes) / horas if horas else 0.0\n        ingreso_hora = bruto / horas if horas else 0.0\n        clase = clasificar_ingreso_hora(ingreso_hora, self.cfg)\n        m = {\"fecha\": fecha, \"turnos\": len(turnos), \"en_curso\": any(t[\"en_curso\"] for t in turnos),\n             \"inicio\": turnos[0][\"inicio\"] if turnos else None, \"corte\": turnos[-1][\"fin\"] if turnos else None,\n             \"horas\": round(horas, 2), \"pausas_horas\": round(pausas, 2), \"viajes\": len(viajes), \"ingreso\": bruto,\n             \"km_pasajero\": float(sum(v.km_pasajero for v in viajes)),\n             \"viajes_hora\": round(viajes_hora, 2), \"ingreso_hora\": round(ingreso_hora, 2), \"clasificacion_hora\": clase,\n             \"detalle_turnos\": [(t[\"inicio\"], t[\"fin\"], t[\"en_curso\"]) for t in turnos]}\n        if registrar and turnos:\n            self._r(\"Viajes por hora\", f\"Corte del día {fecha} a las {m['corte']:%H:%M} ({len(turnos)} turno(s))\",\n                    \"horas = Σ horas de los turnos del día; viajes/hora = viajes / horas; ingreso/hora = ingreso / horas\",\n                    {\"turnos\": \", \".join(f\"{a:%H:%M}-{b:%H:%M}\" for a, b, _ in m[\"detalle_turnos\"]),\n                     \"horas\": round(horas, 2), \"viajes\": len(viajes), \"ingreso\": bruto},\n                    f\"{viajes_hora:.2f} viajes/h · {cop(ingreso_hora)}/h · {clase}\")\n        return m\n\n    def desglose_por_dia(self, fecha: date, incluir_abierta: bool = True) -> pd.DataFrame:\n        \"\"\"Una fila por cada hora del día con tiempo trabajado o viajes, sumando todos los turnos.\"\"\"\n        d0, _ = self.limites_dia(fecha)\n        turnos = self.turnos_del_dia(fecha, incluir_abierta)\n        filas = []\n        for h in range(24):\n            f0, f1 = d0 + timedelta(hours=h), d0 + timedelta(hours=h + 1)\n            minutos = sum(max(0.0, (min(f1, t[\"fin\"]) - max(f0, t[\"inicio\"])).total_seconds())\n                          - sum(max(0.0, (min(f1, y) - max(f0, x)).total_seconds()) for x, y in t[\"pausas\"])\n                          for t in turnos) / 60\n            viajes = [v for t in turnos for v in t[\"viajes\"] if f0 <= v.inicio < f1]\n            if minutos < 0.5 and not viajes:\n                continue\n            ingreso = float(sum(v.valor for v in viajes))\n            filas.append({\"fecha\": fecha, \"hora\": h, \"franja\": f\"{f0:%H}:00–{f1:%H}:00\", \"viajes\": len(viajes),\n                          \"ingreso\": ingreso, \"km_pasajero\": float(sum(v.km_pasajero for v in viajes)),\n                          \"minutos_trabajados\": round(minutos), \"parcial\": minutos < 59.5,\n                          \"clasificacion\": clasificar_ingreso_hora(ingreso, self.cfg)})\n        return pd.DataFrame(filas)\n\n    def calcular_dia(self, fecha: date) -> dict:\n        \"\"\"Análisis financiero del día trabajado: suma todos los turnos CERRADOS del día (00:00 a 24:00).\"\"\"\n        p, cfg, M = self.perfil, self.cfg, f\"Cálculo día {fecha}\"\n        r = lambda op, formula, ent, res: self._r(M, op, formula, ent, res)\n        turnos = self.turnos_del_dia(fecha, incluir_abierta=False)\n        if not turnos:\n            raise ErrorValidacion(f\"No hay turnos cerrados el {fecha:%d/%m/%Y}.\")\n        resumen_turnos = \", \".join(f\"{t['inicio']:%H:%M}-{t['fin']:%H:%M}\" for t in turnos)\n        n_turnos = r(\"Turnos del día\", \"turnos cerrados dentro del día (00:00 a 24:00)\", {\"turnos\": resumen_turnos}, len(turnos))\n        horas = r(\"Horas trabajadas del día\", \"Σ horas de cada turno dentro del día\", {\"turnos\": resumen_turnos},\n                  sum(t[\"horas\"] for t in turnos))\n        pausas = sum(max(0.0, (b[\"inicio\"] - a[\"fin\"]).total_seconds() / 3600) for a, b in zip(turnos, turnos[1:])) \\\n            + sum(t[\"pausa_h\"] for t in turnos)\n        km_tot = r(\"Km totales del día\", \"Σ (odómetro final − odómetro inicial) × fracción del turno dentro del día\",\n                   {f\"turno {t['jornada']}\": f\"{t['km']:.1f} km ({t['fraccion']:.0%})\" for t in turnos},\n                   float(sum(t[\"km\"] for t in turnos)))\n        viajes = [v for t in turnos for v in t[\"viajes\"]]\n        n = len(viajes)\n        km_pas = float(sum(v.km_pasajero for v in viajes))\n        km_vacio = r(\"Km en vacío\", \"km_totales − km_pasajero\", {\"km_totales\": round(km_tot, 1), \"km_pasajero\": km_pas},\n                     km_tot - km_pas)\n        bruto = r(\"Ingreso bruto\", \"Σ valor de los viajes que empezaron en el día\", {\"viajes\": n},\n                  float(sum(v.valor for v in viajes)))\n        propinas = float(sum(v.propina for v in viajes))\n        comision = r(\"Comisión plataformas\", \"Σ (valor × % comisión plataforma)\", {\"comisiones\": p.conductor.plataformas},\n                     float(sum(v.valor * p.conductor.plataformas.get(v.plataforma, 0) for v in viajes)))\n        precio = self.precio_galon_dia(fecha)\n        rend, fuente = self.rendimiento_usado()\n        gas_km = r(\"Costo gasolina por km\", \"precio_galón / rendimiento_km_galón\",\n                   {\"precio_galon\": precio, \"rendimiento\": round(rend, 2), \"fuente\": fuente}, precio / rend)\n        galones = km_tot / rend\n        gasolina = r(\"Gasolina del día\", \"km_totales × costo_gasolina_km\",\n                     {\"km_totales\": round(km_tot, 1), \"costo_km\": round(gas_km, 2)}, km_tot * gas_km)\n        tanqueado = float(sum(t.total for t in p.tanqueos if t.fecha == fecha))\n\n        def costo_km(cat):\n            items = [m for m in p.mantenimientos if m.categoria == cat]\n            return r(f\"Costo {cat} por km\", \"Σ (costo / intervalo_km)\",\n                     {i.nombre: f\"{i.costo}/{i.intervalo_km}\" for i in items},\n                     float(sum(i.costo / i.intervalo_km for i in items)))\n\n        aceite_km, llantas_km, mant_km = costo_km(\"aceite\"), costo_km(\"llantas\"), costo_km(\"general\")\n        docs = self._documentos_vigentes()\n        prov_docs = r(\"Provisión documentos del día\", \"(valor SOAT + valor RTM) / 365 — una sola vez por día trabajado\",\n                      {d.tipo: d.valor for d in docs}, sum(d.valor for d in docs) / 365)\n        prov_mant = r(\"Provisión mantenimiento del día\",\n                      \"km_totales × (aceite_km + llantas_km + mant_km) + provisión_documentos\",\n                      {\"km_totales\": round(km_tot, 1), \"aceite_km\": aceite_km, \"llantas_km\": llantas_km,\n                       \"mant_km\": mant_km, \"prov_docs\": round(prov_docs, 2)},\n                      km_tot * (aceite_km + llantas_km + mant_km) + prov_docs)\n        extras = r(\"Gastos extra del día\", \"Σ gastos de la fecha\", {\"fecha\": str(fecha)},\n                   float(sum(g.valor for g in p.gastos if g.fecha == fecha)))\n        utilidad = r(\"Utilidad neta del día\", \"bruto + propinas − comisión − gasolina − provisión − gastos extra\",\n                     {\"bruto\": bruto, \"propinas\": propinas, \"comision\": round(comision, 2), \"gasolina\": round(gasolina, 2),\n                      \"provision\": round(prov_mant, 2), \"extras\": extras},\n                     bruto + propinas - comision - gasolina - prov_mant - extras)\n        ahorro = r(\"Ahorro sugerido\", \"máx(0, utilidad × % ahorro)\",\n                   {\"utilidad\": round(utilidad, 2), \"pct\": cfg.porcentaje_ahorro}, max(0.0, utilidad * cfg.porcentaje_ahorro))\n        util_hora = utilidad / horas if horas else 0.0\n        ingreso_km = r(\"Ingreso por km del día\", \"bruto / km_totales\", {\"bruto\": bruto, \"km_totales\": round(km_tot, 1)},\n                       bruto / km_tot if km_tot else 0.0)\n        clase = clasificar_ingreso_km(ingreso_km, cfg)\n        viajes_hora = n / horas if horas else 0.0\n        ingreso_hora = r(\"Ingreso por hora del día\", \"ingreso bruto / horas trabajadas del día\",\n                         {\"bruto\": bruto, \"horas\": round(horas, 2)}, bruto / horas if horas else 0.0)\n        clase_hora = r(\"Clasificación del día\", \"umbral $/km y umbral $/hora\",\n                       {\"ingreso_km\": round(ingreso_km, 2), \"ingreso_hora\": round(ingreso_hora, 2)},\n                       clasificar_ingreso_hora(ingreso_hora, cfg))\n        return {\n            \"fecha\": fecha, \"turnos\": n_turnos, \"horas\": round(horas, 2), \"pausas_horas\": round(pausas, 2),\n            \"viajes\": n, \"km_totales\": round(km_tot, 2), \"km_pasajero\": km_pas, \"km_vacio\": round(km_vacio, 2),\n            \"ingreso_bruto\": bruto, \"propinas\": propinas, \"comision\": round(comision, 2),\n            \"precio_galon\": precio, \"costo_gasolina_km\": round(gas_km, 2), \"galones\": round(galones, 2),\n            \"rendimiento\": round(rend, 2), \"rendimiento_fuente\": fuente,\n            \"gasolina\": round(gasolina, 2), \"tanqueado\": tanqueado,\n            \"aceite_km\": round(aceite_km, 2), \"llantas_km\": round(llantas_km, 2), \"mantenimiento_km\": round(mant_km, 2),\n            \"aceite\": round(km_tot * aceite_km, 2), \"llantas\": round(km_tot * llantas_km, 2),\n            \"mantenimiento\": round(km_tot * mant_km, 2),\n            \"provision_documentos\": round(prov_docs, 2), \"provision_total\": round(prov_mant, 2),\n            \"gastos_extra\": extras, \"utilidad_neta\": round(utilidad, 2), \"ahorro\": round(ahorro, 2),\n            \"disponible\": round(utilidad - ahorro, 2), \"utilidad_hora\": round(util_hora, 2),\n            \"ingreso_km\": round(ingreso_km, 2), \"clasificacion\": clase,\n            \"viajes_hora\": round(viajes_hora, 2), \"ingreso_hora\": round(ingreso_hora, 2), \"clasificacion_hora\": clase_hora,\n        }\n\n    # ---------------- Consolidado semanal y mensual ----------------\n    @staticmethod\n    def limites_periodo(fecha: date, tipo: str):\n        \"\"\"Semana: lunes a domingo (numeración ISO). Mes: del día 1 al último día.\"\"\"\n        if tipo == \"semana\":\n            desde = fecha - timedelta(days=fecha.weekday())\n            hasta = desde + timedelta(days=6)\n            anio, semana, _ = desde.isocalendar()\n            return f\"{anio}-S{semana:02d}\", desde, hasta\n        if tipo == \"mes\":\n            desde = fecha.replace(day=1)\n            siguiente = (desde + timedelta(days=32)).replace(day=1)\n            return f\"{fecha:%Y-%m}\", desde, siguiente - timedelta(days=1)\n        raise ValueError(\"tipo debe ser 'semana' o 'mes'\")\n\n    def periodos_con_actividad(self, tipo: str) -> list:\n        \"\"\"Periodos con días trabajados, gastos o tanqueos, del más antiguo al más reciente.\"\"\"\n        fechas = set(self.dias_trabajados(incluir_abierta=False))\n        fechas |= {g.fecha for g in self.perfil.gastos} | {t.fecha for t in self.perfil.tanqueos}\n        claves = {}\n        for f in fechas:\n            clave, desde, hasta = self.limites_periodo(f, tipo)\n            claves[clave] = (clave, desde, hasta)\n        return [claves[c] for c in sorted(claves)]\n\n    def resumen_periodo(self, tipo: str, fecha_ref: date, registrar: bool = False) -> dict:\n        \"\"\"Consolida todos los módulos en una semana o un mes: suma el análisis de cada día trabajado\n        y agrega los gastos de días no trabajados y el dinero tanqueado en el periodo.\"\"\"\n        clave, desde, hasta = self.limites_periodo(fecha_ref, tipo)\n        dias = [d for d in self.dias_trabajados(incluir_abierta=False) if desde <= d <= hasta]\n        with self.sin_traza():\n            analisis = [self.calcular_dia(d) for d in dias]\n        suma = lambda k: float(sum(a[k] for a in analisis))\n        p = self.perfil\n        gastos_periodo = float(sum(g.valor for g in p.gastos if desde <= g.fecha <= hasta))\n        gastos_dias_trabajados = suma(\"gastos_extra\")\n        gastos_otros_dias = gastos_periodo - gastos_dias_trabajados\n        ingreso, propinas = suma(\"ingreso_bruto\"), suma(\"propinas\")\n        comision, gasolina = suma(\"comision\"), suma(\"gasolina\")\n        aceite, llantas, mant, docs = suma(\"aceite\"), suma(\"llantas\"), suma(\"mantenimiento\"), suma(\"provision_documentos\")\n        provision = suma(\"provision_total\")\n        costos = comision + gasolina + provision + gastos_periodo\n        utilidad = ingreso + propinas - costos\n        horas, km, viajes = suma(\"horas\"), suma(\"km_totales\"), int(suma(\"viajes\"))\n        n_dias = len(dias)\n        r = {\n            \"tipo\": tipo, \"periodo\": clave, \"desde\": desde, \"hasta\": hasta, \"dias_trabajados\": n_dias,\n            \"turnos\": int(suma(\"turnos\")), \"horas\": round(horas, 2), \"viajes\": viajes,\n            \"km_totales\": round(km, 2), \"km_pasajero\": round(suma(\"km_pasajero\"), 2), \"galones\": round(suma(\"galones\"), 2),\n            \"ingreso_bruto\": ingreso, \"propinas\": propinas, \"ingreso_total\": ingreso + propinas,\n            \"comision\": round(comision, 2), \"gasolina\": round(gasolina, 2), \"tanqueado\": float(\n                sum(t.total for t in p.tanqueos if desde <= t.fecha <= hasta)),\n            \"aceite\": round(aceite, 2), \"llantas\": round(llantas, 2), \"mantenimiento\": round(mant, 2),\n            \"provision_documentos\": round(docs, 2), \"provision_total\": round(provision, 2),\n            \"gastos_extra\": round(gastos_periodo, 2), \"gastos_dias_no_trabajados\": round(gastos_otros_dias, 2),\n            \"costos_totales\": round(costos, 2), \"utilidad_neta\": round(utilidad, 2),\n            \"ahorro\": round(suma(\"ahorro\"), 2),\n            \"rentabilidad\": round(utilidad / (ingreso + propinas) * 100, 2) if ingreso + propinas else 0.0,\n            \"utilidad_hora\": round(utilidad / horas, 2) if horas else 0.0,\n            \"utilidad_dia\": round(utilidad / n_dias, 2) if n_dias else 0.0,\n            \"ingreso_hora\": round(ingreso / horas, 2) if horas else 0.0,\n            \"ingreso_km\": round(ingreso / km, 2) if km else 0.0,\n            \"costo_km\": round(costos / km, 2) if km else 0.0,\n            \"viajes_hora\": round(viajes / horas, 2) if horas else 0.0,\n            \"viajes_dia\": round(viajes / n_dias, 2) if n_dias else 0.0,\n        }\n        r[\"clasificacion_km\"] = clasificar_ingreso_km(r[\"ingreso_km\"], self.cfg)\n        r[\"clasificacion_hora\"] = clasificar_ingreso_hora(r[\"ingreso_hora\"], self.cfg)\n        if registrar:\n            nombre = \"semana\" if tipo == \"semana\" else \"mes\"\n            self._r(\"Consolidado\", f\"Consolidado {nombre} {clave} ({desde:%d/%m}–{hasta:%d/%m})\",\n                    \"utilidad = (ingreso + propinas) − (comisión + gasolina + provisión + gastos del periodo); \"\n                    \"rentabilidad = utilidad / (ingreso + propinas)\",\n                    {\"dias\": n_dias, \"ingreso\": ingreso + propinas, \"comision\": round(comision, 2),\n                     \"gasolina\": round(gasolina, 2), \"provision\": round(provision, 2), \"gastos\": round(gastos_periodo, 2)},\n                    f\"utilidad {cop(utilidad)} · rentabilidad {r['rentabilidad']:.1f}%\")\n        return r\n\n    def tabla_periodos(self, tipo: str) -> pd.DataFrame:\n        with self.sin_traza():\n            return pd.DataFrame([self.resumen_periodo(tipo, desde) for _, desde, _ in self.periodos_con_actividad(tipo)])\n\n    def tabla_turnos_dia(self, fecha: date) -> pd.DataFrame:\n        filas = []\n        for t in self.turnos_del_dia(fecha):\n            filas.append({\"turno\": t[\"jornada\"], \"inicio\": f\"{t['inicio']:%H:%M}\",\n                          \"fin\": \"en curso\" if t[\"en_curso\"] else f\"{t['fin']:%H:%M}\",\n                          \"horas\": round(t[\"horas\"], 2), \"km\": None if t[\"km\"] is None else round(t[\"km\"], 1),\n                          \"viajes\": len(t[\"viajes\"]), \"ingreso\": float(sum(v.valor for v in t[\"viajes\"])),\n                          \"nota\": \"parte de un turno que pasa la medianoche\" if t[\"dividido\"] else \"\"})\n        return pd.DataFrame(filas)\n\n    def desglose_por_hora(self, jornada_id: int, hasta: Optional[datetime] = None) -> pd.DataFrame:\n        \"\"\"Una fila por cada hora del reloj trabajada: viajes que iniciaron en esa hora y lo que se cobró.\n        Usa el mismo corte que metricas_hora, así las franjas suman lo mismo que la jornada.\"\"\"\n        j = self._jornada(jornada_id)\n        fin = hasta or self.corte_jornada(j)\n        if fin <= j.inicio:\n            return pd.DataFrame()\n        franja = j.inicio.replace(minute=0, second=0, microsecond=0)\n        filas = []\n        while franja < fin:\n            siguiente = franja + timedelta(hours=1)\n            minutos = (min(siguiente, fin) - max(franja, j.inicio)).total_seconds() / 60 \\\n                - self.horas_pausa(j, max(franja, j.inicio), min(siguiente, fin)) * 60\n            viajes = [v for v in j.viajes if franja <= v.inicio < siguiente]\n            ingreso = float(sum(v.valor for v in viajes))\n            clase = clasificar_ingreso_hora(ingreso, self.cfg)\n            filas.append({\"fecha\": franja.date(), \"hora\": franja.hour,\n                          \"franja\": f\"{franja:%H}:00–{siguiente:%H}:00\", \"viajes\": len(viajes),\n                          \"ingreso\": ingreso, \"km_pasajero\": float(sum(v.km_pasajero for v in viajes)),\n                          \"minutos_trabajados\": round(minutos), \"parcial\": minutos < 59.5,\n                          \"clasificacion\": clase})\n            franja = siguiente\n        return pd.DataFrame(filas)\n\n    def mejores_horas(self, desde: date, hasta: date) -> pd.DataFrame:\n        \"\"\"Promedio por hora del día en un rango: en qué franjas se gana más.\"\"\"\n        tablas = [self.desglose_por_dia(d, incluir_abierta=False)\n                  for d in self.dias_trabajados(incluir_abierta=False) if desde <= d <= hasta]\n        tablas = [t for t in tablas if not t.empty]\n        if not tablas:\n            return pd.DataFrame()\n        df = pd.concat(tablas)\n        res = df.groupby(\"hora\").agg(dias=(\"fecha\", \"count\"), viajes=(\"viajes\", \"sum\"),\n                                     ingreso_total=(\"ingreso\", \"sum\")).reset_index()\n        res[\"franja\"] = res[\"hora\"].map(lambda h: f\"{h:02d}:00–{(h + 1) % 24:02d}:00\")\n        res[\"viajes_promedio\"] = (res[\"viajes\"] / res[\"dias\"]).round(2)\n        res[\"ingreso_promedio\"] = (res[\"ingreso_total\"] / res[\"dias\"]).round(0)\n        res[\"clasificacion\"] = res[\"ingreso_promedio\"].map(lambda x: clasificar_ingreso_hora(x, self.cfg))\n        self._r(\"Reporte\", \"Mejores horas\", \"Σ ingreso de la franja / días trabajados en esa franja\",\n                {\"desde\": str(desde), \"hasta\": str(hasta), \"franjas\": len(res)}, len(res))\n        return res[[\"franja\", \"hora\", \"dias\", \"viajes\", \"viajes_promedio\", \"ingreso_total\",\n                    \"ingreso_promedio\", \"clasificacion\"]]\n\n    # ---------------- Alertas ----------------\n    def alertas(self, hoy: Optional[date] = None) -> pd.DataFrame:\n        hoy = hoy or ahora().date()\n        p, cfg, filas = self.perfil, self.cfg, []\n        odo = p.vehiculo.odometro_km if p.vehiculo else 0\n        for m in p.mantenimientos:\n            km_rest = m.ultimo_km + m.intervalo_km - odo\n            dias_rest = (m.ultima_fecha + timedelta(days=m.intervalo_meses * 30) - hoy).days\n            if km_rest <= 0 or dias_rest <= 0:\n                estado = \"🔴 VENCIDO\"\n            elif km_rest <= m.intervalo_km * cfg.porcentaje_alerta_mantenimiento or dias_rest <= cfg.dias_alerta_mantenimiento:\n                estado = \"🟡 PRÓXIMO\"\n            else:\n                estado = \"🟢 OK\"\n            filas.append({\"tipo\": \"Mantenimiento\", \"item\": m.nombre, \"km_restantes\": km_rest,\n                          \"dias_restantes\": dias_rest, \"estado\": estado})\n        for d in self._documentos_vigentes():\n            dias = (d.vencimiento - hoy).days\n            if dias < 0:\n                estado = \"🔴 VENCIDO\"\n            elif dias <= cfg.dias_alerta_documentos:\n                estado = f\"🟡 ALERTA: vence en {dias} días\"\n            else:\n                estado = \"🟢 OK\"\n            filas.append({\"tipo\": \"Documento\", \"item\": d.tipo, \"km_restantes\": None,\n                          \"dias_restantes\": dias, \"estado\": estado})\n        self.traza.evento(\"Alertas\", f\"Revisión de alertas al {hoy}\", self.sesion)\n        return pd.DataFrame(filas)\n\n    # ---------------- Actor 12: Reportes ----------------\n    def tabla_viajes(self) -> pd.DataFrame:\n        filas = []\n        for j in self.perfil.jornadas:\n            for v in j.viajes:\n                vkm = v.valor / v.km_pasajero if v.km_pasajero else 0\n                filas.append({\"jornada\": j.id, \"fecha\": v.inicio.date(), \"viaje_del_dia\": self.numero_viaje(v),\n                              \"inicio\": v.inicio, \"fin\": v.fin,\n                              \"plataforma\": v.plataforma, \"valor\": v.valor, \"km_pasajero\": v.km_pasajero,\n                              \"valor_km\": round(vkm, 2), \"clasificacion\": clasificar_ingreso_km(vkm, self.cfg),\n                              \"pago\": v.metodo_pago, \"propina\": v.propina})\n        return pd.DataFrame(filas)\n\n    def reporte_rango(self, desde: date, hasta: date):\n        dias = [self.calcular_dia(d) for d in self.dias_trabajados(incluir_abierta=False) if desde <= d <= hasta]\n        df = pd.DataFrame(dias)\n        if df.empty:\n            return df, {}\n        dias_trab = df[\"fecha\"].nunique()\n        bruto, km = df[\"ingreso_bruto\"].sum(), df[\"km_totales\"].sum()\n        resumen = {\n            \"dias_trabajados\": dias_trab,\n            \"total_viajes\": int(df[\"viajes\"].sum()),\n            \"promedio_viajes_dia\": self._r(\"Reporte\", \"Promedio de viajes por día\", \"total_viajes / días_trabajados\",\n                                           {\"viajes\": int(df[\"viajes\"].sum()), \"dias\": dias_trab},\n                                           round(df[\"viajes\"].sum() / dias_trab, 2)),\n            \"km_totales\": km, \"horas\": df[\"horas\"].sum(),\n            \"ingreso_bruto\": bruto, \"gasolina\": df[\"gasolina\"].sum(),\n            \"provision_total\": round(df[\"provision_total\"].sum(), 2),\n            \"utilidad_neta\": round(df[\"utilidad_neta\"].sum(), 2), \"ahorro\": round(df[\"ahorro\"].sum(), 2),\n            \"ingreso_km_periodo\": round(bruto / km, 2) if km else 0,\n        }\n        horas_tot = df[\"horas\"].sum()\n        resumen[\"clasificacion_periodo\"] = clasificar_ingreso_km(resumen[\"ingreso_km_periodo\"], self.cfg)\n        resumen[\"viajes_hora_periodo\"] = round(resumen[\"total_viajes\"] / horas_tot, 2) if horas_tot else 0\n        resumen[\"ingreso_hora_periodo\"] = self._r(\"Reporte\", \"Ingreso por hora del periodo\", \"Σ ingreso bruto / Σ horas\",\n                                                  {\"bruto\": bruto, \"horas\": round(horas_tot, 2)},\n                                                  round(bruto / horas_tot, 2) if horas_tot else 0)\n        resumen[\"clasificacion_hora_periodo\"] = clasificar_ingreso_hora(resumen[\"ingreso_hora_periodo\"], self.cfg)\n        return df, resumen\n\n    def exportar_excel(self, ruta=\"control_conductor.xlsx\", hoy: Optional[date] = None) -> str:\n        resumen = pd.DataFrame([self.calcular_dia(d) for d in self.dias_trabajados(incluir_abierta=False)])\n        with pd.ExcelWriter(ruta, engine=\"openpyxl\") as xl:\n            resumen.to_excel(xl, sheet_name=\"Días\", index=False)\n            self.tabla_viajes().to_excel(xl, sheet_name=\"Viajes\", index=False)\n            self.alertas(hoy).to_excel(xl, sheet_name=\"Alertas\", index=False)\n            self.traza.como_tabla().to_excel(xl, sheet_name=\"Trazabilidad\", index=False)\n        self.traza.evento(\"Reporte\", f\"Exportado a Excel: {ruta}\", self.sesion)\n        return ruta\n\n\ndef mostrar_tablero(res: dict):\n    print(f\"══════ TABLERO JORNADA {res['jornada']} — {res['fecha']} ══════\")\n    print(f\"Viajes: {res['viajes']} | Horas: {res['horas']} | Km totales: {res['km_totales']:.0f} \"\n          f\"(con pasajero {res['km_pasajero']:.0f}, en vacío {res['km_vacio']:.0f})\")\n    print(f\"Ingreso bruto ........ {cop(res['ingreso_bruto'])}\")\n    print(f\"Ingreso por km ....... {cop(res['ingreso_km'])} → {SEMAFORO[res['clasificacion']]} {res['clasificacion']}\")\n    print(f\"Ingreso por hora ..... {cop(res['ingreso_hora'])} → {SEMAFORO[res['clasificacion_hora']]} \"\n          f\"{res['clasificacion_hora']}  ({res['viajes_hora']:.1f} viajes/hora)\")\n    print(f\"(−) Comisión ......... {cop(res['comision'])}\")\n    print(f\"(−) Gasolina ......... {cop(res['gasolina'])}  ({cop(res['costo_gasolina_km'])}/km)\")\n    print(f\"(−) Provisión mant. .. {cop(res['provision_total'], 2)}  \"\n          f\"[aceite {cop(res['aceite'])} | llantas {cop(res['llantas'])} | \"\n          f\"general {cop(res['mantenimiento'])} | documentos {cop(res['provision_documentos'], 2)}]\")\n    print(f\"(−) Gastos extra ..... {cop(res['gastos_extra'])}\")\n    print(f\"= Utilidad neta ...... {cop(res['utilidad_neta'], 2)}  ({cop(res['utilidad_hora'], 2)}/hora)\")\n    print(f\"  Ahorro sugerido .... {cop(res['ahorro'], 2)}\")\n    print(f\"  Disponible ......... {cop(res['disponible'], 2)}\")\n\n\n# %% [markdown]\n# ## 4. Caso de prueba (valida las fórmulas con los valores del prompt)\n\n# %%\ndef _prueba_turnos_partidos():\n    \"\"\"Dos turnos el mismo día (pausa para almorzar) y un turno que pasa la medianoche.\"\"\"\n    s = SistemaConductor()\n    s.crear_cuenta(\"partido@correo.com\", \"Clave2026*\")\n    s.iniciar_sesion(\"partido@correo.com\", \"Clave2026*\")\n    s.registrar_conductor(nombres=\"A\", apellidos=\"B\", tipo_documento=\"CC\", numero_documento=\"1\",\n                          celular=\"3\", ciudad=\"Bogotá\", plataformas={\"Uber\": 0.20})\n    s.registrar_vehiculo(placa=\"XYZ123\", tipo=\"carro\", marca=\"M\", referencia=\"R\", modelo=2022, cilindrada_cc=1400,\n                         combustible=\"gasolina\", rendimiento_km_galon=40, odometro_km=0)\n    s.registrar_tanqueo(date(2026, 11, 1), galones=10, precio_galon=16000, odometro_km=0)\n    s.registrar_documento(\"SOAT\", \"X\", 1000000, date(2025, 12, 2), date(2026, 12, 1))\n    s.registrar_documento(\"Técnico-mecánica\", \"Y\", 250000, date(2026, 3, 1), date(2027, 3, 1))\n    # Mañana 06:00-11:00 (100 km) y tarde 14:00-22:00 (150 km)\n    j1 = s.abrir_jornada(datetime(2026, 11, 12, 6, 0), 0)\n    s.registrar_viaje(j1.id, datetime(2026, 11, 12, 7, 0), datetime(2026, 11, 12, 7, 30), \"Uber\", 50000, 20)\n    s.cerrar_jornada(j1.id, datetime(2026, 11, 12, 11, 0), 100)\n    try:\n        s.abrir_jornada(datetime(2026, 11, 12, 10, 0), 100)\n        raise AssertionError(\"Debe rechazar un turno que se cruza con otro\")\n    except ErrorValidacion:\n        pass\n    j2 = s.abrir_jornada(datetime(2026, 11, 12, 14, 0), 100)\n    s.registrar_viaje(j2.id, datetime(2026, 11, 12, 15, 0), datetime(2026, 11, 12, 15, 40), \"Uber\", 70000, 25)\n    s.cerrar_jornada(j2.id, datetime(2026, 11, 12, 22, 0), 250)\n    d = s.calcular_dia(date(2026, 11, 12))\n    assert d[\"turnos\"] == 2 and d[\"horas\"] == 13 and d[\"pausas_horas\"] == 3, \"El día debe sumar 2 turnos: 5 h + 8 h\"\n    assert d[\"km_totales\"] == 250 and d[\"viajes\"] == 2 and d[\"ingreso_bruto\"] == 120000\n    assert abs(d[\"provision_documentos\"] - 1250000 / 365) < 0.01, \"SOAT y RTM se provisionan una sola vez por día\"\n    assert d[\"gasolina\"] == 250 * 400\n    # Turno nocturno 20:00 del 13 a 02:00 del 14 (60 km): 4 h y 40 km el 13; 2 h y 20 km el 14\n    j3 = s.abrir_jornada(datetime(2026, 11, 13, 20, 0), 250)\n    s.registrar_viaje(j3.id, datetime(2026, 11, 13, 23, 30), datetime(2026, 11, 14, 0, 10), \"Uber\", 40000, 15)\n    s.registrar_viaje(j3.id, datetime(2026, 11, 14, 0, 30), datetime(2026, 11, 14, 1, 0), \"Uber\", 30000, 10)\n    s.cerrar_jornada(j3.id, datetime(2026, 11, 14, 2, 0), 310)\n    d13, d14 = s.calcular_dia(date(2026, 11, 13)), s.calcular_dia(date(2026, 11, 14))\n    assert (d13[\"horas\"], d13[\"km_totales\"], d13[\"ingreso_bruto\"]) == (4, 40, 40000), \"La parte antes de medianoche va al día 13\"\n    assert (d14[\"horas\"], d14[\"km_totales\"], d14[\"ingreso_bruto\"]) == (2, 20, 30000), \"La parte después de medianoche va al día 14\"\n    m = s.metricas_dia(date(2026, 11, 12))\n    assert (m[\"horas\"], m[\"viajes\"], m[\"ingreso\"]) == (d[\"horas\"], d[\"viajes\"], d[\"ingreso_bruto\"])\n    franjas = s.desglose_por_dia(date(2026, 11, 12))\n    assert franjas[\"minutos_trabajados\"].sum() == 13 * 60 and franjas[\"viajes\"].sum() == 2\n    # Consolidado: semana 46 (lunes 9 a domingo 15 de noviembre) y mes de noviembre\n    s.registrar_gasto(date(2026, 11, 15), \"Multa\", 50000)          # domingo, sin turnos\n    s.registrar_gasto(date(2026, 11, 12), \"Peaje\", 10000)           # día trabajado\n    sem = s.resumen_periodo(\"semana\", date(2026, 11, 12))\n    dias = [s.calcular_dia(x) for x in (date(2026, 11, 12), date(2026, 11, 13), date(2026, 11, 14))]\n    assert sem[\"periodo\"] == \"2026-S46\" and sem[\"desde\"] == date(2026, 11, 9) and sem[\"hasta\"] == date(2026, 11, 15)\n    assert sem[\"dias_trabajados\"] == 3 and sem[\"horas\"] == 13 + 4 + 2 and sem[\"km_totales\"] == 250 + 60\n    assert sem[\"gastos_extra\"] == 60000 and sem[\"gastos_dias_no_trabajados\"] == 50000\n    assert abs(sem[\"utilidad_neta\"] - (sum(d[\"utilidad_neta\"] for d in dias) - 50000)) < 0.05, \\\n        \"La utilidad semanal = Σ utilidad de los días − gastos de días no trabajados\"\n    assert abs(sem[\"costos_totales\"] - (sem[\"comision\"] + sem[\"gasolina\"] + sem[\"provision_total\"] + 60000)) < 0.05\n    mes = s.resumen_periodo(\"mes\", date(2026, 11, 30))\n    assert mes[\"periodo\"] == \"2026-11\" and mes[\"hasta\"] == date(2026, 11, 30) and mes[\"utilidad_neta\"] == sem[\"utilidad_neta\"]\n    assert s.limites_periodo(date(2026, 12, 31), \"semana\")[0] == \"2026-S53\"\n    assert s.limites_periodo(date(2027, 2, 10), \"mes\")[2] == date(2027, 2, 28)\n\n\ndef ejecutar_caso_prueba(mostrar=True) -> SistemaConductor:\n    s = SistemaConductor()\n    s.crear_cuenta(\"conductor@correo.com\", \"Clave2026*\")\n    s.iniciar_sesion(\"conductor@correo.com\", \"Clave2026*\")\n    s.registrar_conductor(nombres=\"Carlos\", apellidos=\"Pérez\", tipo_documento=\"CC\",\n                          numero_documento=\"1000000000\", celular=\"3000000000\", ciudad=\"Bogotá\",\n                          plataformas={\"Uber\": 0.20, \"DiDi\": 0.20})\n    s.registrar_vehiculo(placa=\"ABC123\", tipo=\"carro\", marca=\"Chevrolet\", referencia=\"Onix\", modelo=2022,\n                         cilindrada_cc=1400, combustible=\"gasolina\", rendimiento_km_galon=40, odometro_km=50000)\n    s.registrar_tanqueo(date(2026, 11, 11), galones=10, precio_galon=16000, odometro_km=50000)\n    s.registrar_mantenimiento(\"Cambio de aceite\", \"aceite\", 180000, 5000, 6, 48000, date(2026, 10, 1))\n    s.registrar_mantenimiento(\"Juego de llantas\", \"llantas\", 1200000, 40000, 48, 30000, date(2025, 6, 1))\n    s.registrar_mantenimiento(\"Mantenimiento general\", \"general\", 1500000, 50000, 12, 40000, date(2026, 1, 15))\n    s.registrar_documento(\"SOAT\", \"Aseguradora ejemplo\", 1000000, date(2025, 12, 2), date(2026, 12, 1))\n    s.registrar_documento(\"Técnico-mecánica\", \"CDA ejemplo\", 250000, date(2026, 3, 1), date(2027, 3, 1))\n\n    j = s.abrir_jornada(datetime(2026, 11, 11, 6, 0), 50000)\n    for i in range(12):  # 12 viajes × $35.000 = $420.000\n        inicio = datetime(2026, 11, 11, 6, 15) + timedelta(minutes=48 * i)\n        s.registrar_viaje(j.id, inicio, inicio + timedelta(minutes=35),\n                          \"Uber\" if i % 2 == 0 else \"DiDi\", 35000, 14)\n    s.cerrar_jornada(j.id, datetime(2026, 11, 11, 16, 0), 50200)\n\n    res = s.calcular_jornada(j.id)\n    esperados = {\"ingreso_km\": 2100, \"comision\": 84000, \"costo_gasolina_km\": 400, \"gasolina\": 80000,\n                 \"aceite\": 7200, \"llantas\": 6000, \"mantenimiento\": 6000,\n                 \"provision_documentos\": 3424.66, \"provision_total\": 22624.66,\n                 \"utilidad_neta\": 233375.34, \"ahorro\": 46675.07, \"utilidad_hora\": 23337.53,\n                 \"ingreso_hora\": 42000, \"viajes_hora\": 1.2}\n    errores = [f\"{k}: esperado {v}, obtenido {res[k]}\" for k, v in esperados.items() if abs(res[k] - v) > 0.01]\n    assert res[\"clasificacion\"] == \"MEDIO\", \"La clasificación del día debería ser MEDIO\"\n    assert res[\"clasificacion_hora\"] == \"MUY BUENO\", \"La clasificación por hora debería ser MUY BUENO\"\n    franjas = s.desglose_por_hora(j.id)\n    assert len(franjas) == 10 and franjas[\"viajes\"].sum() == 12, \"El desglose por hora debe tener 10 franjas y 12 viajes\"\n    assert franjas[\"ingreso\"].sum() == 420000, \"El desglose por hora debe sumar el ingreso bruto\"\n    m = s.metricas_hora(j.id)\n    assert (m[\"horas\"], m[\"viajes\"], m[\"viajes_hora\"], m[\"ingreso_hora\"]) == \\\n        (res[\"horas\"], res[\"viajes\"], res[\"viajes_hora\"], res[\"ingreso_hora\"]), \"Viajes por hora y Tablero deben coincidir\"\n    assert abs(franjas[\"minutos_trabajados\"].sum() / 60 - m[\"horas\"]) < 0.02, \"Las franjas deben sumar las horas trabajadas\"\n    dia = s.calcular_dia(date(2026, 11, 11))\n    for clave in (\"utilidad_neta\", \"provision_total\", \"gasolina\", \"ingreso_hora\", \"ingreso_km\", \"horas\", \"viajes\"):\n        assert abs(dia[clave] - res[clave]) < 0.01, f\"Con un solo turno, el día debe dar lo mismo que la jornada ({clave})\"\n    _prueba_turnos_partidos()\n    cortes = {27999: \"BAJO\", 28000: \"MEDIO\", 32999: \"MEDIO\", 33000: \"MUY BUENO\"}\n    assert all(clasificar_ingreso_hora(v, s.cfg) == c for v, c in cortes.items()), \"Umbrales por hora incorrectos\"\n    assert not errores, \"Fallas en el caso de prueba:\\n\" + \"\\n\".join(errores)\n    if mostrar:\n        mostrar_tablero(res)\n        print(\"\\n✅ Caso de prueba superado: todas las verificaciones coinciden \"\n              \"(viajes por hora, día con varios turnos y turno que pasa la medianoche).\")\n    return s\n\n\nif __name__ == \"__main__\":\n    ejecutar_caso_prueba()\n", "diseno.py": "\"\"\"\nDiseño visual de la app, con modo noche (\"cabina nocturna\") y modo día.\nNoche: asfalto azul pizarra y amarillo de línea de vía. Día: fondo claro y frío con un amarillo más\noscuro para que se lea al sol. En los dos modos el taxímetro conserva su display oscuro.\nTodos los dibujos son SVG originales hechos para esta app.\n\"\"\"\nfrom datetime import datetime\n\nimport streamlit as st\n\n# ---------------- Colores fijos (no cambian con el modo) ----------------\nVIA = \"#F5C242\"          # amarillo del carro y de los dígitos del taxímetro\nBORDE = \"#2E394A\"        # borde del semáforo dibujado\nSEMAFORO_COLOR = {\"BAJO\": \"#F25F5C\", \"MEDIO\": \"#FF9F43\", \"MUY BUENO\": \"#36D399\"}\n\n# ---------------- Paletas por modo ----------------\nPALETAS = {\n    \"noche\": {\n        \"tema\": {\"base\": \"dark\", \"primaryColor\": \"#F5C242\", \"backgroundColor\": \"#141A23\",\n                 \"secondaryBackgroundColor\": \"#1D2532\", \"textColor\": \"#E8ECF2\", \"borderColor\": \"#2E394A\",\n                 \"linkColor\": \"#F5C242\", \"redColor\": \"#F25F5C\", \"orangeColor\": \"#FF9F43\", \"yellowColor\": \"#F5C242\",\n                 \"greenColor\": \"#36D399\", \"blueColor\": \"#5AA9E6\", \"dataframeHeaderBackgroundColor\": \"#232D3C\",\n                 \"sidebar.backgroundColor\": \"#0F141C\", \"sidebar.secondaryBackgroundColor\": \"#1D2532\"},\n        \"css\": {\"fondo\": \"#141A23\", \"fondo_alto\": \"#1E2A3C\", \"panel\": \"#1D2532\", \"borde\": \"#2E394A\",\n                \"texto\": \"#E8ECF2\", \"tenue\": \"#93A0B4\", \"acento\": \"#F5C242\", \"marco_display\": \"#121A26\"},\n    },\n    \"dia\": {\n        \"tema\": {\"base\": \"light\", \"primaryColor\": \"#E3A008\", \"backgroundColor\": \"#F3F5F8\",\n                 \"secondaryBackgroundColor\": \"#FFFFFF\", \"textColor\": \"#18202B\", \"borderColor\": \"#D3DAE4\",\n                 \"linkColor\": \"#8A5A00\", \"redColor\": \"#D63B36\", \"orangeColor\": \"#D9730D\", \"yellowColor\": \"#B7870B\",\n                 \"greenColor\": \"#17915A\", \"blueColor\": \"#2F7BBF\", \"dataframeHeaderBackgroundColor\": \"#E8EDF3\",\n                 \"sidebar.backgroundColor\": \"#E6EBF2\", \"sidebar.secondaryBackgroundColor\": \"#FFFFFF\"},\n        \"css\": {\"fondo\": \"#F3F5F8\", \"fondo_alto\": \"#DDE8F5\", \"panel\": \"#FFFFFF\", \"borde\": \"#D3DAE4\",\n                \"texto\": \"#18202B\", \"tenue\": \"#5B6676\", \"acento\": \"#C98A00\", \"marco_display\": \"#C9D3DF\"},\n    },\n}\nMODOS = {\"auto\": \"🌗 Auto\", \"dia\": \"☀️ Día\", \"noche\": \"🌙 Noche\"}\n\n\ndef modo_efectivo(preferencia: str, ahora: datetime) -> str:\n    \"\"\"'auto' sigue el reloj de Colombia: día de 6:00 a 17:59, noche el resto.\"\"\"\n    if preferencia in (\"dia\", \"noche\"):\n        return preferencia\n    return \"dia\" if 6 <= ahora.hour < 18 else \"noche\"\n\n\ndef aplicar_tema(modo: str) -> bool:\n    \"\"\"Cambia el tema de Streamlit (widgets, tablas, gráficos). Devuelve True si hubo cambio,\n    para que la app se vuelva a dibujar una vez con los colores nuevos.\"\"\"\n    from streamlit import config\n    cambio = False\n    for clave, valor in PALETAS[modo][\"tema\"].items():\n        if config.get_option(f\"theme.{clave}\") != valor:\n            config.set_option(f\"theme.{clave}\", valor)\n            cambio = True\n    return cambio\n\n\n_CSS_PLANTILLA = \"\"\"\n<style>\n@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Saira+Condensed:wght@500;600;700&display=swap');\n:root {{\n  --asfalto: {fondo}; --fondo-alto: {fondo_alto}; --tablero: {panel}; --borde: {borde}; --texto: {texto};\n  --tenue: {tenue}; --via: {acento}; --marco-display: {marco_display};\n  --display: #0F1620; --display-texto: #E8ECF2; --display-tenue: #93A0B4; --texto-boton: #141A23;\n  --rojo: #F25F5C; --ambar: #FF9F43; --verde: #36D399;\n  --titulos: \"Saira Condensed\", \"Arial Narrow\", sans-serif;\n}}\n.stApp {{ background: radial-gradient(900px 320px at 50% -120px, var(--fondo-alto) 0%, var(--asfalto) 70%); }}\n.block-container {{ padding-top: 4.2rem; max-width: 980px; }}\n\n/* Métricas: lectura rápida, dígitos alineados */\n[data-testid=\"stMetric\"] {{\n  background: var(--tablero); border: 1px solid var(--borde); border-radius: .6rem; padding: .55rem .8rem;\n}}\n[data-testid=\"stMetricValue\"], [data-testid=\"stMetricValue\"] > div {{\n  font-family: var(--titulos); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em;\n  font-size: clamp(1.45rem, 2.3vw, 2rem);\n}}\n[data-testid=\"stMetricLabel\"] p {{ color: var(--tenue); }}\n\n/* Botón principal amarillo con texto oscuro (contraste alto) */\n[data-testid=\"stBaseButton-primary\"], [data-testid=\"stBaseButton-primaryFormSubmit\"] {{\n  color: var(--texto-boton) !important; font-weight: 700; min-height: 3rem;\n}}\n[data-testid=\"stBaseButton-primary\"] p, [data-testid=\"stBaseButton-primaryFormSubmit\"] p {{\n  color: var(--texto-boton) !important; font-weight: 700; font-size: 1.02rem;\n}}\n[data-testid=\"stBaseButton-secondary\"], [data-testid=\"stBaseButton-secondaryFormSubmit\"] {{ min-height: 2.75rem; }}\n[data-testid=\"stForm\"] {{ background: var(--tablero); border-color: var(--borde); }}\n\n/* Menú lateral con zonas de toque amplias */\n[data-testid=\"stSidebar\"] [role=\"radiogroup\"] label {{ padding: .38rem .2rem; border-radius: .5rem; }}\n[data-testid=\"stSidebar\"] [role=\"radiogroup\"] label:has(input:checked) {{ background: var(--tablero); }}\n\n/* Encabezado de cada pantalla */\n.encabezado {{ display: flex; gap: .9rem; align-items: flex-start; margin: 0 0 1rem; }}\n.enc-icono {{\n  flex: none; width: 3.1rem; height: 3.1rem; border-radius: .8rem; display: grid; place-items: center;\n  background: var(--tablero); border: 1px solid var(--borde); color: var(--via);\n}}\n.enc-icono svg {{ width: 1.9rem; height: 1.9rem; }}\n.enc-titulo {{ font-family: var(--titulos); font-weight: 700; font-size: 2rem; line-height: 1.05; color: var(--texto); }}\n.enc-sub {{ color: var(--tenue); font-size: .95rem; margin-top: .2rem; max-width: 62ch; }}\n\n/* Taxímetro: el resultado principal, como el display del carro */\n.taximetro {{\n  display: flex; flex-wrap: wrap; gap: 1rem 1.6rem; align-items: center; justify-content: space-between;\n  background: var(--display); border: 1px solid var(--borde); border-radius: .9rem;\n  padding: 1rem 1.2rem; margin: .2rem 0 1rem; box-shadow: inset 0 0 0 4px var(--marco-display);\n}}\n.tx-principal {{ min-width: 0; }}\n.tx-etiqueta {{ display: block; color: var(--display-tenue); font-size: .92rem; }}\n.tx-valor {{\n  display: block; font-family: var(--titulos); font-weight: 700; color: #F5C242;\n  font-size: clamp(2.5rem, 9vw, 3.8rem); line-height: 1; letter-spacing: .02em;\n  font-variant-numeric: tabular-nums; text-shadow: 0 0 22px rgba(245, 194, 66, .32); margin: .25rem 0;\n}}\n.tx-valor.negativo {{ color: var(--rojo); text-shadow: 0 0 22px rgba(242, 95, 92, .3); }}\n.tx-sub {{ display: block; color: var(--display-tenue); font-size: .85rem; }}\n.tx-semaforos {{ display: flex; gap: 1.2rem; flex-wrap: wrap; }}\n.tx-sem {{ display: flex; gap: .6rem; align-items: center; }}\n.tx-sem svg {{ width: 30px; height: 74px; flex: none; }}\n.tx-sem b {{ display: block; font-family: var(--titulos); font-size: 1.5rem; font-weight: 600;\n  font-variant-numeric: tabular-nums; color: var(--display-texto); line-height: 1.1; }}\n.tx-sem span {{ display: block; color: var(--display-tenue); font-size: .82rem; }}\n.tx-sem em {{ display: inline-block; font-style: normal; font-weight: 700; font-size: .78rem; margin-top: .2rem;\n  padding: .08rem .45rem; border-radius: 1rem; color: var(--texto-boton); }}\n\n/* Escena de bienvenida */\n.escena svg {{ width: 100%; height: auto; display: block; border-radius: .9rem; border: 1px solid var(--borde); }}\n.marca {{ display: flex; align-items: center; gap: .6rem; margin: .2rem 0 .4rem; }}\n.marca svg {{ width: 3rem; height: auto; }}\n.marca div {{ font-family: var(--titulos); font-weight: 700; font-size: 1.25rem; line-height: 1.05; color: var(--texto); }}\n.marca small {{ display: block; font-family: inherit; font-weight: 500; color: var(--tenue); font-size: .85rem; }}\n.vacio {{ display: flex; gap: 1rem; align-items: center; padding: 1rem 1.1rem; border: 1px dashed var(--borde);\n  border-radius: .8rem; color: var(--tenue); margin: .5rem 0 1rem; }}\n.vacio svg {{ width: 6rem; flex: none; height: auto; }}\n\n/* Menú de inicio: botones grandes, uno por autor */\n.st-key-menu_inicio button {{ min-height: 4.6rem; justify-content: flex-start; text-align: left;\n  background: var(--tablero); border: 1px solid var(--borde); border-left: 4px solid var(--via);\n  border-radius: .8rem; padding: .7rem 1rem; }}\n.st-key-menu_inicio button div, .st-key-menu_inicio button span {{ width: 100%; justify-content: flex-start; }}\n.st-key-menu_inicio button [data-testid=\"stMarkdownContainer\"] {{ display: flex; flex-direction: column;\n  align-items: flex-start; text-align: left; gap: .15rem; width: 100%; }}\n.st-key-menu_inicio button p {{ margin: 0; line-height: 1.25; white-space: normal; }}\n.st-key-menu_inicio button p:first-child {{ font-weight: 700; font-size: 1.05rem; color: var(--texto); }}\n.st-key-menu_inicio button p + p {{ font-size: .85rem; color: var(--tenue); }}\n.st-key-volver_menu button {{ border-radius: 2rem; padding: .25rem .9rem; min-height: 0; }}\n\n@keyframes vias {{ from {{ transform: translateX(0); }} to {{ transform: translateX(-90px); }} }}\n@keyframes girar {{ to {{ transform: rotate(360deg); }} }}\n.vias {{ animation: vias .8s linear infinite; }}\n.rueda {{ animation: girar .55s linear infinite; transform-box: fill-box; transform-origin: center; }}\n@media (prefers-reduced-motion: reduce) {{ .vias, .rueda {{ animation: none; }} }}\n\n/* El script que lanza los sonidos no ocupa espacio */\n[data-testid=\"stElementContainer\"]:has([data-testid=\"stHtml\"] script) {{\n  position: absolute !important; left: -9999px; width: 1px; height: 1px; overflow: hidden;\n}}\n@media (max-width: 640px) {{\n  .enc-titulo {{ font-size: 1.65rem; }}\n  .block-container {{ padding-left: 1rem; padding-right: 1rem; }}\n}}\n<\/style>\n\"\"\"\n\n\ndef css(modo: str) -> str:\n    return _CSS_PLANTILLA.format(**PALETAS[modo][\"css\"])\n\n# ---------------- Íconos de cada pantalla (línea, 24×24) ----------------\n_ICONOS = {\n    \"tablero\": '<path d=\"M3.5 16.5a8.5 8.5 0 1 1 17 0\"/><path d=\"M12 16.5l4.2-5.2\"/><circle cx=\"12\" cy=\"16.5\" r=\"1.4\" fill=\"currentColor\"/>'\n               '<path d=\"M6 13.4l1.2.7M12 8v1.4M18 13.4l-1.2.7\"/>',\n    \"jornada\": '<circle cx=\"12\" cy=\"12\" r=\"8.5\"/><circle cx=\"12\" cy=\"12\" r=\"2.4\"/><path d=\"M3.6 10.5h6.1M14.3 10.5h6.1M12 14.4v6\"/>',\n    \"hora\": '<circle cx=\"12\" cy=\"13\" r=\"7.5\"/><path d=\"M12 9v4.2l2.8 1.8M9.5 2.8h5M12 2.8v2.7\"/>',\n    \"mantenimiento\": '<path d=\"M14.6 6.3a4 4 0 0 0 5.1 5.1l-8.4 8.4a2.1 2.1 0 0 1-3-3l8.4-8.4a4 4 0 0 0-5.1-5.1l2.6 2.6.4 2 2 .4z\"/>',\n    \"combustible\": '<rect x=\"4\" y=\"3.5\" width=\"10\" height=\"17\" rx=\"1.6\"/><path d=\"M6.5 7h5v3.6h-5zM14 9h2.3a1.7 1.7 0 0 1 1.7 1.7v5.6a1.3 1.3 0 0 0 2.6 0V8.5L18 5.8M3 20.5h12\"/>',\n    \"gastos\": '<path d=\"M4 7.5h14.5a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 18.5V6a2 2 0 0 1 2-2h10\"/><path d=\"M15.5 12.2h4.5v3.4h-4.5a1.7 1.7 0 0 1 0-3.4z\"/>',\n    \"reportes\": '<path d=\"M4 20h16M6.5 16.5v-4M11 16.5V9M15.5 16.5v-6M20 16.5V6\"/><path d=\"M5 9.5l5-4.5 4 3 5.5-5\" stroke-dasharray=\"2 1.6\"/>',\n    \"semanal\": '<rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"1.8\"/><path d=\"M3.5 9.5h17M8 3v4M16 3v4\"/>'\n               '<path d=\"M7 13h2M11 13h2M15 13h2M7 16.5h2M11 16.5h2\" stroke-width=\"2.2\"/>',\n    \"trazabilidad\": '<path d=\"M6 3.5h9l3.5 3.5v6M6 3.5v17h6.5M9 8h6M9 11.5h4\"/><circle cx=\"16.5\" cy=\"17\" r=\"3\"/><path d=\"M18.7 19.2l2 2\"/>',\n    \"billetera\": '<rect x=\"3\" y=\"6.5\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M3 10.5h18M6.5 15.5h4\"/><path d=\"M6 6.5l9-3 1.4 3\"/>',\n    \"perfil\": '<circle cx=\"12\" cy=\"9.2\" r=\"3.4\"/><path d=\"M5 20.5a7 7 0 0 1 14 0M7.2 6.6c1.2-2.4 8.4-2.4 9.6 0\"/><path d=\"M6.6 6.6h10.8\" stroke-width=\"2.2\"/>',\n}\n\n\ndef icono(nombre: str) -> str:\n    return (f'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" '\n            f'stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">{_ICONOS[nombre]}<\/svg>')\n\n\ndef carro_svg(ancho=260, con_luz=False) -> str:\n    \"\"\"Carro genérico de perfil (hatchback), dibujado para esta app.\"\"\"\n    luz = ('<path d=\"M246 74 L330 52 L330 112 L246 86 Z\" fill=\"url(#haz)\" />' if con_luz else \"\")\n    return f'''\n<svg viewBox=\"0 0 {ancho + (80 if con_luz else 0)} 130\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n  <defs><linearGradient id=\"haz\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"{VIA}\" stop-opacity=\".55\"/>\n  <stop offset=\"1\" stop-color=\"{VIA}\" stop-opacity=\"0\"/><\/linearGradient><\/defs>\n  {luz}\n  <path d=\"M14 92 Q12 70 34 66 L74 60 Q96 30 128 26 L176 26 Q200 28 218 54 L238 62 Q252 66 252 84 L252 94\n           Q252 100 246 100 L20 100 Q14 100 14 92 Z\" fill=\"{VIA}\"/>\n  <path d=\"M84 60 Q102 36 128 34 L148 34 L148 60 Z\" fill=\"#1B2533\"/>\n  <path d=\"M156 34 L174 34 Q194 36 208 58 L156 60 Z\" fill=\"#1B2533\"/>\n  <rect x=\"150\" y=\"34\" width=\"4\" height=\"27\" fill=\"{VIA}\"/>\n  <path d=\"M30 74 L60 72\" stroke=\"#B88A1F\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n  <rect x=\"238\" y=\"70\" width=\"12\" height=\"8\" rx=\"3\" fill=\"#FFF3C9\"/>\n  <rect x=\"14\" y=\"72\" width=\"8\" height=\"9\" rx=\"2\" fill=\"#F25F5C\"/>\n  <path d=\"M148 64 L148 96\" stroke=\"#B88A1F\" stroke-width=\"2\"/>\n  <g transform=\"translate(66 100)\"><circle r=\"19\" fill=\"#0E131A\"/><circle r=\"9\" fill=\"#5B6678\"/>\n    <g class=\"rueda\"><path d=\"M0 -8 L0 8 M-8 0 L8 0\" stroke=\"#2A3240\" stroke-width=\"2.4\"/><\/g><\/g>\n  <g transform=\"translate(200 100)\"><circle r=\"19\" fill=\"#0E131A\"/><circle r=\"9\" fill=\"#5B6678\"/>\n    <g class=\"rueda\"><path d=\"M0 -8 L0 8 M-8 0 L8 0\" stroke=\"#2A3240\" stroke-width=\"2.4\"/><\/g><\/g>\n<\/svg>'''\n\n\ndef escena(modo: str = \"noche\") -> str:\n    return escena_nocturna() if modo == \"noche\" else escena_diurna()\n\n\ndef escena_diurna() -> str:\n    \"\"\"Ilustración de bienvenida de día: cielo despejado, sol y la ciudad con las luces apagadas.\"\"\"\n    noche = escena_nocturna()\n    return (noche.replace('stop-color=\"#0E1520\"', 'stop-color=\"#7DB8E8\"').replace('stop-color=\"#22324A\"', 'stop-color=\"#D9ECFA\"')\n            .replace('<circle cx=\"690\" cy=\"58\" r=\"24\" fill=\"#F2E6C2\"/><circle cx=\"701\" cy=\"51\" r=\"21\" fill=\"#132033\"/>',\n                     '<circle cx=\"690\" cy=\"60\" r=\"34\" fill=\"#FFE08A\" opacity=\".45\"/><circle cx=\"690\" cy=\"60\" r=\"24\" fill=\"#FFD24D\"/>')\n            .replace('fill=\"#C9D3E3\" opacity=\".7\"', 'fill=\"#FFFFFF\" opacity=\"0\"')\n            .replace('fill=\"#1A2433\"', 'fill=\"#8FA4BC\"').replace('aria-label=\"Carro en una vía de noche\"', 'aria-label=\"Carro en una vía de día\"')\n            .replace('<path d=\"M246 74 L330 52 L330 112 L246 86 Z\" fill=\"url(#haz)\" />', '')\n            .replace(f'width=\"6\" height=\"7\" fill=\"{VIA}\"', 'width=\"6\" height=\"7\" fill=\"#DCE7F3\"'))\n\n\ndef escena_nocturna() -> str:\n    \"\"\"Ilustración de bienvenida: el carro en una vía de noche, con la ciudad al fondo.\"\"\"\n    edificios = [(20, 70, 46), (70, 40, 60), (134, 88, 40), (178, 56, 54), (236, 100, 36), (476, 64, 50),\n                 (530, 34, 64), (598, 82, 44), (646, 52, 58), (708, 92, 40), (752, 60, 48)]\n    ciudad = \"\".join(f'<rect x=\"{x}\" y=\"{200 - h}\" width=\"{w}\" height=\"{h}\" fill=\"#1A2433\"/>' for x, h, w in edificios)\n    ventanas = \"\".join(\n        f'<rect x=\"{x + 8 + (i % 3) * 13}\" y=\"{200 - h + 10 + (i // 3) * 14}\" width=\"6\" height=\"7\" fill=\"{VIA}\" '\n        f'opacity=\"{.18 + .5 * ((x + i * 7) % 5 == 0)}\"/>'\n        for x, h, w in edificios for i in range(min(9, int(h / 14) * 3)) if 8 + (i % 3) * 13 < w - 6)\n    estrellas = \"\".join(f'<circle cx=\"{x}\" cy=\"{y}\" r=\"{r}\" fill=\"#C9D3E3\" opacity=\".7\"/>'\n                        for x, y, r in ((60, 30, 1.2), (150, 18, 1), (300, 40, 1.3), (420, 22, 1), (560, 48, 1.1),\n                                        (610, 16, 1.4), (760, 34, 1), (360, 70, .9), (250, 90, .8)))\n    rayas = \"\".join(f'<rect x=\"{x}\" y=\"226\" width=\"44\" height=\"6\" rx=\"2\" fill=\"{VIA}\"/>' for x in range(-90, 900, 90))\n    return f'''\n<div class=\"escena\">\n<svg viewBox=\"0 0 800 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Carro en una vía de noche\">\n  <defs><linearGradient id=\"cielo\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n    <stop offset=\"0\" stop-color=\"#0E1520\"/><stop offset=\"1\" stop-color=\"#22324A\"/><\/linearGradient><\/defs>\n  <rect width=\"800\" height=\"270\" fill=\"url(#cielo)\"/>\n  {estrellas}\n  <circle cx=\"690\" cy=\"58\" r=\"24\" fill=\"#F2E6C2\"/><circle cx=\"701\" cy=\"51\" r=\"21\" fill=\"#132033\"/>\n  {ciudad}{ventanas}\n  <rect y=\"200\" width=\"800\" height=\"70\" fill=\"#232B36\"/>\n  <rect y=\"200\" width=\"800\" height=\"3\" fill=\"#3A4556\"/>\n  <rect y=\"264\" width=\"800\" height=\"3\" fill=\"#3A4556\"/>\n  <g class=\"vias\">{rayas}<\/g>\n  <g transform=\"translate(250 112)\">{carro_svg(260, con_luz=True).replace('<svg viewBox=\"0 0 340 130\"', '<svg width=\"340\" height=\"130\" viewBox=\"0 0 340 130\"')}<\/g>\n<\/svg>\n<\/div>'''\n\n\ndef semaforo_svg(clase: str) -> str:\n    \"\"\"Semáforo dibujado con la luz de la calificación encendida.\"\"\"\n    luces = [(\"BAJO\", 14), (\"MEDIO\", 37), (\"MUY BUENO\", 60)]\n    circulos = \"\"\n    for nombre, cy in luces:\n        if nombre == clase:\n            c = SEMAFORO_COLOR[nombre]\n            circulos += (f'<circle cx=\"15\" cy=\"{cy}\" r=\"10\" fill=\"{c}\" opacity=\".35\"/>'\n                         f'<circle cx=\"15\" cy=\"{cy}\" r=\"8\" fill=\"{c}\"/>')\n        else:\n            circulos += f'<circle cx=\"15\" cy=\"{cy}\" r=\"8\" fill=\"#273041\"/>'\n    return (f'<svg viewBox=\"0 0 30 74\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Semáforo: {clase}\">'\n            f'<rect x=\"1\" y=\"1\" width=\"28\" height=\"72\" rx=\"8\" fill=\"#0B1118\" stroke=\"{BORDE}\"/>{circulos}<\/svg>')\n\n\n# ---------------- Componentes ----------------\ndef html(contenido: str):\n    \"\"\"Muestra HTML compacto (sin sangrías ni líneas en blanco, que Markdown leería como código).\"\"\"\n    st.markdown(\" \".join(linea.strip() for linea in contenido.splitlines() if linea.strip()), unsafe_allow_html=True)\n\n\ndef aplicar(modo: str = \"noche\"):\n    html(css(modo))\n\n\ndef encabezado(nombre_icono: str, titulo: str, subtitulo: str = \"\"):\n    sub = f'<div class=\"enc-sub\">{subtitulo}<\/div>' if subtitulo else \"\"\n    html(f'<div class=\"encabezado\"><span class=\"enc-icono\">{icono(nombre_icono)}<\/span>'\n                f'<div><div class=\"enc-titulo\">{titulo}<\/div>{sub}<\/div><\/div>')\n\n\ndef taximetro(etiqueta: str, valor: str, negativo: bool, detalle: str, indicadores: list):\n    \"\"\"Panel tipo taxímetro. indicadores = [(valor, unidad, clase), ...]\"\"\"\n    sems = \"\".join(\n        f'<div class=\"tx-sem\">{semaforo_svg(clase)}<div><b>{v}<\/b><span>{unidad}<\/span>'\n        f'<em style=\"background:{SEMAFORO_COLOR[clase]}\">{clase.capitalize()}<\/em><\/div><\/div>'\n        for v, unidad, clase in indicadores)\n    html(f'<div class=\"taximetro\"><div class=\"tx-principal\"><span class=\"tx-etiqueta\">{etiqueta}<\/span>'\n                f'<span class=\"tx-valor{\" negativo\" if negativo else \"\"}\">{valor}<\/span>'\n                f'<span class=\"tx-sub\">{detalle}<\/span><\/div><div class=\"tx-semaforos\">{sems}<\/div><\/div>')\n\n\ndef marca_lateral():\n    html(f'<div class=\"marca\">{carro_svg(260)}<div>Control del Conductor'\n         f'<small>Costos, gastos y utilidad<\/small><\/div><\/div>')\n\n\ndef vacio(texto: str):\n    html(f'<div class=\"vacio\">{carro_svg(260)}<div>{texto}<\/div><\/div>')\n", "sonidos.py": "\"\"\"\nSonidos de la app, sintetizados en Python puro (sin archivos de audio).\nCada sonido dura menos de un segundo y se genera una sola vez (caché).\n\"\"\"\nimport io\nimport math\nimport struct\nimport wave\nfrom functools import lru_cache\n\nFRECUENCIA_MUESTREO = 22050\n\n# Notas en Hz\nDO5, MI5, SOL5, LA5 = 523.25, 659.25, 783.99, 880.00\nDO6, MI6, SOL6, LA6 = 1046.50, 1318.51, 1567.98, 1760.00\nLA3, RE4 = 220.00, 293.66\n\n\ndef _nota(freq, duracion, volumen=0.45, brillo=0.25, ataque=0.008, caida=None):\n    \"\"\"Una nota con envolvente suave: seno + un poco de armónico para que suene como campanita.\"\"\"\n    n = int(FRECUENCIA_MUESTREO * duracion)\n    caida = caida if caida is not None else duracion * 0.85\n    muestras = []\n    for i in range(n):\n        t = i / FRECUENCIA_MUESTREO\n        env = min(1.0, t / ataque) if ataque else 1.0\n        env *= math.exp(-3.2 * max(0.0, t - ataque) / caida)\n        onda = math.sin(2 * math.pi * freq * t) + brillo * math.sin(2 * math.pi * 2 * freq * t)\n        muestras.append(volumen * env * onda / (1 + brillo))\n    return muestras\n\n\ndef _silencio(duracion):\n    return [0.0] * int(FRECUENCIA_MUESTREO * duracion)\n\n\ndef _barrido(f0, f1, duracion, volumen=0.35):\n    \"\"\"Barrido de frecuencia: un 'arranque' corto.\"\"\"\n    n = int(FRECUENCIA_MUESTREO * duracion)\n    muestras, fase = [], 0.0\n    for i in range(n):\n        t = i / n\n        f = f0 + (f1 - f0) * t * t\n        fase += 2 * math.pi * f / FRECUENCIA_MUESTREO\n        env = min(1.0, t * 12) * (1 - t) ** 0.6\n        muestras.append(volumen * env * (math.sin(fase) + 0.3 * math.sin(2 * fase)) / 1.3)\n    return muestras\n\n\ndef _zumbido(freq, duracion, volumen=0.3):\n    \"\"\"Tono grave y áspero para avisos de error.\"\"\"\n    n = int(FRECUENCIA_MUESTREO * duracion)\n    muestras = []\n    for i in range(n):\n        t = i / FRECUENCIA_MUESTREO\n        env = min(1.0, t / 0.01) * min(1.0, (duracion - t) / 0.03)\n        onda = sum(math.sin(2 * math.pi * freq * k * t) / k for k in (1, 3, 5))\n        muestras.append(volumen * env * onda / 1.5)\n    return muestras\n\n\ndef _mezclar_secuencia(partes):\n    salida = []\n    for p in partes:\n        salida.extend(p)\n    return salida\n\n\ndef _a_wav(muestras) -> bytes:\n    buffer = io.BytesIO()\n    with wave.open(buffer, \"wb\") as w:\n        w.setnchannels(1)\n        w.setsampwidth(2)\n        w.setframerate(FRECUENCIA_MUESTREO)\n        w.writeframes(b\"\".join(struct.pack(\"<h\", int(max(-1.0, min(1.0, m)) * 32767)) for m in muestras))\n    return buffer.getvalue()\n\n\nRECETAS = {\n    # Viaje guardado: el tono depende del semáforo de $/km\n    \"muy_bueno\": lambda: _mezclar_secuencia([_nota(DO6, .09), _nota(MI6, .09), _nota(SOL6, .09), _nota(DO6 * 2, .32)]),\n    \"medio\": lambda: _mezclar_secuencia([_nota(SOL5, .1), _silencio(.03), _nota(SOL5, .22)]),\n    \"bajo\": lambda: _mezclar_secuencia([_nota(MI5, .14, brillo=.1), _nota(DO5, .3, brillo=.1)]),\n    # Moneda: gasto o tanqueo guardado\n    \"caja\": lambda: _mezclar_secuencia([_nota(MI6, .06, volumen=.35), _nota(LA6, .28, volumen=.35)]),\n    # Abrir jornada: arranque\n    \"arranque\": lambda: _mezclar_secuencia([_barrido(180, 620, .32), _nota(LA5, .18, volumen=.3)]),\n    # Cerrar jornada: fanfarria corta\n    \"cierre\": lambda: _mezclar_secuencia([_nota(DO5, .12), _nota(MI5, .12), _nota(SOL5, .12), _nota(DO6, .55)]),\n    # Datos guardados (perfil, mantenimiento, documentos, configuración)\n    \"guardado\": lambda: _nota(LA5, .22, volumen=.3, brillo=.4),\n    # Error o validación\n    \"alerta\": lambda: _mezclar_secuencia([_zumbido(LA3, .12), _silencio(.06), _zumbido(RE4 * .75, .16)]),\n}\n\n\n@lru_cache(maxsize=None)\ndef sonido(nombre: str) -> bytes:\n    \"\"\"Devuelve el WAV del sonido pedido (o el sonido 'guardado' si el nombre no existe).\"\"\"\n    return _a_wav(RECETAS.get(nombre, RECETAS[\"guardado\"])())\n", ".streamlit/config.toml": "# Tema \"cabina nocturna\" (el modo día y noche se cambia desde la app).\n# Las fuentes se cargan desde diseno.py; aquí van solo los nombres (con URL, la versión de navegador queda en blanco).\n[theme]\nbase = \"dark\"\nprimaryColor = \"#F5C242\"\nbackgroundColor = \"#141A23\"\nsecondaryBackgroundColor = \"#1D2532\"\ntextColor = \"#E8ECF2\"\nborderColor = \"#2E394A\"\nshowWidgetBorder = true\nbaseRadius = \"0.6rem\"\nbuttonRadius = \"0.6rem\"\nlinkColor = \"#F5C242\"\nfont = \"Atkinson Hyperlegible, sans-serif\"\nheadingFont = \"Saira Condensed, sans-serif\"\nredColor = \"#F25F5C\"\norangeColor = \"#FF9F43\"\nyellowColor = \"#F5C242\"\ngreenColor = \"#36D399\"\nblueColor = \"#5AA9E6\"\ndataframeHeaderBackgroundColor = \"#232D3C\"\nchartCategoricalColors = [\"#F5C242\", \"#5AA9E6\", \"#36D399\", \"#FF9F43\", \"#F25F5C\", \"#B58CFF\"]\n\n[theme.sidebar]\nbackgroundColor = \"#0F141C\"\nsecondaryBackgroundColor = \"#1D2532\"\n"}</script>
<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
const files = JSON.parse(document.getElementById("archivos").textContent);
mount({
  entrypoint: "app.py",
  files,
  requirements: ["pandas"],
  env: { CONDUCTOR_DB: "/datos/conductor.db" },
  idbfsMountpoints: ["/datos"],            // los datos quedan guardados en el celular
}, document.getElementById("root"));
// Pide al navegador que no borre los datos de la app para liberar espacio
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
// Instala el service worker: abre más rápido y funciona sin señal después de la primera carga
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
