<script id="archivos" type="application/json">{"app.py": "\"\"\"\nApp del conductor de plataformas — Streamlit + SQLite.\nEjecutar con:  streamlit run app.py\n\"\"\"\nimport base64\nimport io\nfrom datetime import date, datetime, timedelta\n\nimport pandas as pd\nimport streamlit as st\n\nimport db\nimport diseno\nimport sonidos\nfrom control_conductor import (\n    Conductor, Configuracion, ErrorValidacion, ICONO_PAGO, METODOS_PAGO, SEMAFORO, SistemaConductor,\n    TIPOS_MOVIMIENTO, Vehiculo, ahora, clasificar_ingreso_hora, clasificar_ingreso_km, cop,\n    normalizar_identificador, normalizar_pago,\n)\n\nst.set_page_config(page_title=\"Control del Conductor\", page_icon=\"🚗\", layout=\"centered\")\ndb.inicializar()\n\nPLATAFORMAS = [\"Uber\", \"DiDi\", \"InDrive\", \"Cabify\", \"Picap\", \"Otra\"]\nMENU = \"🏠 Menú\"\nPAGINAS = [MENU, \"📊 Tablero\", \"🚕 Jornada de hoy\", \"👛 Billetera\", \"⏱️ Viajes por hora\", \"🔧 Mantenimiento y documentos\",\n           \"⛽ Combustible\", \"💸 Gastos\", \"📈 Reportes\", \"📆 Semanal y mensual\", \"🔎 Trazabilidad\", \"👤 Mi perfil\"]\nDIAS_SEMANA = [\"Lun\", \"Mar\", \"Mié\", \"Jue\", \"Vie\", \"Sáb\", \"Dom\"]\nMESES = [\"Enero\", \"Febrero\", \"Marzo\", \"Abril\", \"Mayo\", \"Junio\", \"Julio\", \"Agosto\", \"Septiembre\",\n         \"Octubre\", \"Noviembre\", \"Diciembre\"]\nCOLOR_CLASE = {\"BAJO\": \"red\", \"MEDIO\": \"orange\", \"MUY BUENO\": \"green\"}\nHEX_CLASE = {\"BAJO\": \"#d64545\", \"MEDIO\": \"#e0a800\", \"MUY BUENO\": \"#2e9e5b\"}\n\n\ndef texto_horas(horas: float) -> str:\n    total = round(horas * 60)\n    return f\"{total // 60} h {total % 60:02d} min\"\n\n\ndef texto_turnos(m) -> str:\n    partes = [f\"{a:%H:%M}–\" + (\"en curso\" if abierto else f\"{b:%H:%M}\") for a, b, abierto in m[\"detalle_turnos\"]]\n    texto = f\"{m['turnos']} turno(s): \" + \" · \".join(partes)\n    if m[\"pausas_horas\"]:\n        texto += f\" · pausas {texto_horas(m['pausas_horas'])}\"\n    return texto\n\n\ndef actualizar_consolidados(s, correo, fechas):\n    \"\"\"Recalcula y guarda en la base de datos la semana y el mes de cada fecha, con trazabilidad.\"\"\"\n    for fecha in sorted(set(fechas)):\n        for tipo in (\"semana\", \"mes\"):\n            try:\n                db.guardar_consolidado(correo, s.resumen_periodo(tipo, fecha, registrar=True), ahora())\n            except ErrorValidacion:\n                pass\n\n\ndef recalcular_dias(s, jornada):\n    \"\"\"Recalcula, dejando trazabilidad, los días (00:00 a 24:00) que toca una jornada cerrada.\"\"\"\n    resultados = []\n    if not jornada.cerrada:\n        return resultados\n    d = jornada.inicio.date()\n    while datetime.combine(d, datetime.min.time()) < jornada.fin:\n        try:\n            resultados.append(s.calcular_dia(d))\n        except ErrorValidacion:\n            pass\n        d += timedelta(days=1)\n    return resultados\n\n\ndef bloque_horas(s, fecha):\n    \"\"\"Bloque único del día trabajado: suma todos los turnos del día (00:00 a 24:00).\n    Lo usan Jornada de hoy y Viajes por hora, así las cifras siempre coinciden.\"\"\"\n    m = s.metricas_dia(fecha)\n    if not m[\"turnos\"]:\n        st.info(\"Todavía no hay turnos en este día.\")\n        return m\n    nota = (\" El turno en curso cuenta hasta la hora actual o hasta el fin del último viaje.\"\n            if m[\"en_curso\"] else \"\")\n    descanso = f\" Descansos: {texto_horas(m['pausas_horas'])} (no cuentan como trabajo).\" if m[\"pausas_horas\"] >= 0.01 else \"\"\n    st.caption(f\"Día {fecha:%d/%m/%Y} · {texto_turnos(m)}.{nota}{descanso}\")\n    diseno.taximetro(\"Ingreso del día\" + (\" (en curso)\" if m[\"en_curso\"] else \"\"), cop(m[\"ingreso\"]), False,\n                     f\"{m['viajes']} viajes · {texto_horas(m['horas'])} trabajadas\",\n                     [(cop(m[\"ingreso_hora\"]), \"Ingreso por hora\", m[\"clasificacion_hora\"])])\n    c1, c2, c3, c4 = st.columns(4)\n    c1.metric(\"Horas trabajadas\", texto_horas(m[\"horas\"]))\n    c2.metric(\"Viajes\", m[\"viajes\"])\n    c3.metric(\"Viajes por hora\", f\"{m['viajes_hora']:.2f}\")\n    c4.metric(\"Km con pasajero\", f\"{m['km_pasajero']:,.1f}\")\n    if m[\"horas\"] < 0.25:\n        st.caption(\"Llevas menos de 15 minutos de turno; el valor por hora todavía no es representativo.\")\n    return m\n\n\ndef reporte_dia_csv(s, fecha, m, franjas) -> bytes:\n    \"\"\"Reporte del día trabajado en CSV: resumen, turnos, análisis financiero, cada hora y viajes.\"\"\"\n    filas = [(\"Fecha\", f\"{fecha:%d/%m/%Y}\"), (\"Estado\", \"Con turno en curso\" if m[\"en_curso\"] else \"Día cerrado\"),\n             (\"Turnos\", texto_turnos(m)), (\"Horas trabajadas\", texto_horas(m[\"horas\"])),\n             (\"Horas (decimal)\", m[\"horas\"]), (\"Pausas\", texto_horas(m[\"pausas_horas\"])),\n             (\"Viajes\", m[\"viajes\"]), (\"Viajes por hora\", m[\"viajes_hora\"]),\n             (\"Ingreso bruto\", m[\"ingreso\"]), (\"Ingreso por hora\", m[\"ingreso_hora\"]),\n             (\"Nivel por hora\", m[\"clasificacion_hora\"]), (\"Km con pasajero\", m[\"km_pasajero\"])]\n    try:\n        with s.sin_traza():\n            r = s.calcular_dia(fecha)\n        filas += [(\"Km totales\", r[\"km_totales\"]), (\"Galones consumidos\", r[\"galones\"]),\n                  (\"Comisión plataformas\", r[\"comision\"]), (\"Gasolina\", r[\"gasolina\"]),\n                  (\"Provisión mantenimiento y documentos\", r[\"provision_total\"]), (\"Gastos extra\", r[\"gastos_extra\"]),\n                  (\"Utilidad neta\", r[\"utilidad_neta\"]), (\"Ahorro sugerido\", r[\"ahorro\"]),\n                  (\"Ingreso por km\", r[\"ingreso_km\"]), (\"Nivel por km\", r[\"clasificacion\"])]\n        if m[\"en_curso\"]:\n            filas.append((\"Nota\", \"El análisis financiero incluye solo los turnos cerrados\"))\n    except ErrorValidacion:\n        filas.append((\"Nota\", \"El análisis financiero aparece cuando cierres el primer turno del día\"))\n    resumen = pd.DataFrame(filas, columns=[\"Concepto\", \"Valor\"])\n    d0, d1 = s.limites_dia(fecha)\n    viajes = pd.DataFrame([{\"Turno\": j.id, \"Viaje\": s.numero_viaje(v), \"Inicio\": f\"{v.inicio:%H:%M}\", \"Fin\": f\"{v.fin:%H:%M}\",\n                            \"Plataforma\": v.plataforma, \"Valor\": v.valor, \"Km\": v.km_pasajero,\n                            \"Pago\": v.metodo_pago, \"Propina\": v.propina}\n                           for j in s.perfil.jornadas for v in j.viajes if d0 <= v.inicio < d1])\n    partes = [\"RESUMEN DEL DÍA\", resumen.to_csv(index=False),\n              \"TURNOS DEL DÍA\", s.tabla_turnos_dia(fecha).to_csv(index=False),\n              \"VIAJES POR CADA HORA\", franjas.drop(columns=[\"fecha\", \"hora\"], errors=\"ignore\").to_csv(index=False),\n              \"VIAJES\", viajes.to_csv(index=False)]\n    return \"\\n\".join(partes).encode(\"utf-8-sig\")\n\n\ndef mostrar_franjas(df, cfg):\n    \"\"\"Tabla y gráfico de viajes e ingreso por cada hora del reloj.\"\"\"\n    if df.empty:\n        st.info(\"Todavía no hay horas trabajadas para mostrar.\")\n        return\n    tabla = pd.DataFrame({\n        \"Hora\": df[\"franja\"] + df[\"parcial\"].map(lambda x: \" (parcial)\" if x else \"\"),\n        \"Minutos\": df[\"minutos_trabajados\"],\n        \"Viajes\": df[\"viajes\"],\n        \"Ingreso\": df[\"ingreso\"].map(cop),\n        \"Km con pasajero\": df[\"km_pasajero\"],\n        \"Nivel\": df[\"clasificacion\"].map(lambda c: f\"{SEMAFORO[c]} {c}\"),\n    })\n    total = pd.DataFrame([{\"Hora\": \"TOTAL\", \"Minutos\": int(df[\"minutos_trabajados\"].sum()),\n                           \"Viajes\": int(df[\"viajes\"].sum()), \"Ingreso\": cop(df[\"ingreso\"].sum()),\n                           \"Km con pasajero\": round(float(df[\"km_pasajero\"].sum()), 1), \"Nivel\": \"\"}])\n    st.dataframe(pd.concat([tabla, total], ignore_index=True), hide_index=True, width=\"stretch\")\n    grafico = pd.DataFrame({\"Hora\": df[\"franja\"], \"Ingreso\": df[\"ingreso\"],\n                            \"color\": df[\"clasificacion\"].map(HEX_CLASE)})\n    st.bar_chart(grafico, x=\"Hora\", y=\"Ingreso\", color=\"color\")\n    st.caption(f\"Semáforo por hora: 🔴 menos de {cop(cfg.umbral_hora_medio)} · \"\n               f\"🟡 de {cop(cfg.umbral_hora_medio)} a {cop(cfg.umbral_hora_muy_bueno - 1)} · \"\n               f\"🟢 {cop(cfg.umbral_hora_muy_bueno)} o más. \"\n               \"Cada viaje cuenta en la hora en que empezó.\")\n\n\ndef aviso(texto, sonido=\"guardado\"):\n    st.session_state[\"aviso\"] = texto\n    st.session_state[\"sonido\"] = sonido\n\n\ndef reproducir(nombre):\n    \"\"\"Reproduce un sonido corto si el conductor tiene los sonidos activados.\n    Se lanza con play() desde la página: el navegador lo permite porque el conductor acaba de tocar un botón.\"\"\"\n    if nombre and st.session_state.get(\"sonidos_activos\", True):\n        datos = base64.b64encode(sonidos.sonido(nombre)).decode()\n        st.html(f'<script>(function(){{try{{var a=new Audio(\"data:audio/wav;base64,{datos}\");a.volume=0.9;'\n                f'window.__sonidoConductor=a;a.play().catch(function(){{}});}}catch(e){{}}}})();<\/script>',\n                unsafe_allow_javascript=True)\n\n\ndef error(texto):\n    st.error(texto)\n    reproducir(\"alerta\")\n\n\ndef accion(sistema, correo, fn, guardar=None, exito=None, sonido=\"guardado\"):\n    \"\"\"Ejecuta una operación del sistema, la guarda en la base con su traza y recarga.\"\"\"\n    try:\n        resultado = fn()\n        if guardar:\n            guardar(resultado)\n        db.guardar_traza(correo, sistema)\n        if exito:\n            aviso(exito, sonido)\n        st.rerun()\n    except ErrorValidacion as e:\n        error(f\"⚠️ {e}\")\n\n\ndef combinar(base: datetime, hora, minimo: datetime) -> datetime:\n    \"\"\"Une la fecha de la jornada con una hora; si queda antes del mínimo, pasa al día siguiente.\"\"\"\n    resultado = datetime.combine(base.date(), hora)\n    return resultado + timedelta(days=1) if resultado < minimo else resultado\n\n\ndef hora_actual():\n    return ahora().time().replace(second=0, microsecond=0)\n\n\ndef revisar_horas_viaje(inicio: datetime, fin: datetime, inicio_turno: datetime, fin_turno: datetime = None):\n    \"\"\"Devuelve un mensaje de error si las horas no tienen sentido; None si están bien.\n    Un turno puede durar 24 horas o más: la hora del viaje se ubica después del inicio del turno y\n    solo se rechaza si queda después del cierre del turno o en el futuro.\"\"\"\n    if fin_turno and inicio > fin_turno:\n        return (f\"El viaje ({inicio:%d/%m %H:%M}) queda después del cierre del turno \"\n                f\"({fin_turno:%d/%m %H:%M}). Revisa la hora.\")\n    if not fin_turno and inicio > ahora() + timedelta(minutes=15):\n        return (f\"La hora de inicio del viaje ({inicio:%H:%M}) quedaría el {inicio:%d/%m}, en el futuro. \"\n                f\"El turno empezó el {inicio_turno:%d/%m a las %H:%M}; revisa la hora.\")\n    if fin - inicio > timedelta(hours=8):\n        return (f\"Revisa las horas: la hora de fin ({fin:%H:%M}) quedó antes de la de inicio \"\n                f\"({inicio:%H:%M}). Si el viaje pasó la medianoche, puede durar máximo 8 horas.\")\n    return None\n\n\n# =====================================================================\n# INICIO DE SESIÓN / CREAR CUENTA\n# =====================================================================\ndef pantalla_acceso():\n    diseno.html(diseno.escena(st.session_state.get(\"_modo_efectivo\", \"noche\")))\n    diseno.html('<div class=\"enc-titulo\" style=\"font-size:2.4rem;margin-top:1rem\">Control del Conductor<\/div>'\n                '<div class=\"enc-sub\" style=\"margin-bottom:1rem\">Registra cada viaje y cada gasto, y mira cuánto '\n                'te queda de verdad por kilómetro, por hora y por día.<\/div>')\n    entrar, crear, restaurar = st.tabs([\"Iniciar sesión\", \"Crear cuenta\", \"Restaurar copia\"])\n\n    with restaurar:\n        st.caption(\"¿Cambiaste de celular? Sube la copia de seguridad que descargaste y luego inicia sesión \"\n                   \"con tu correo y contraseña de siempre.\")\n        archivo = st.file_uploader(\"Copia de seguridad (.db)\", type=[\"db\"], key=\"subir_copia_inicio\")\n        if st.button(\"Restaurar copia\", disabled=not archivo, width=\"stretch\", key=\"restaurar_inicio\"):\n            try:\n                correos = db.restaurar_copia(archivo.getvalue())\n                aviso(f\"Copia restaurada ({len(correos)} cuenta(s)). Ahora inicia sesión.\", \"cierre\")\n                st.rerun()\n            except ValueError as e:\n                error(f\"⚠️ {e}\")\n\n    with entrar:\n        with st.form(\"login\"):\n            usuario_txt = st.text_input(\"Correo o celular (WhatsApp)\", autocomplete=\"username\",\n                                        placeholder=\"tucorreo@gmail.com o 3001234567\")\n            clave = st.text_input(\"Contraseña\", type=\"password\", autocomplete=\"current-password\")\n            recordar = st.checkbox(\"Mantener la sesión iniciada en este celular\", value=True,\n                                   help=\"La próxima vez la app entra sola, sin pedir usuario ni contraseña.\")\n            if st.form_submit_button(\"Entrar\", type=\"primary\", width=\"stretch\"):\n                try:\n                    correo = normalizar_identificador(usuario_txt)\n                except ErrorValidacion:\n                    correo = usuario_txt.strip().lower()\n                s = SistemaConductor()\n                usuario = db.obtener_usuario(correo)\n                if usuario:\n                    s._usuarios[correo] = usuario\n                    s._perfiles[correo] = None\n                try:\n                    s.iniciar_sesion(correo, clave)\n                    if recordar:\n                        db.recordar_sesion(correo)\n                        s.traza.evento(\"Cuenta\", \"Sesión recordada en este celular\", correo)\n                    db.guardar_traza(correo, s)\n                    st.session_state[\"correo\"] = correo\n                    aviso(\"Bienvenido de nuevo.\", \"arranque\")\n                    st.rerun()\n                except ErrorValidacion as e:\n                    db.guardar_traza(correo, s)\n                    error(str(e))\n\n    with crear:\n        st.caption(\"Usa tu correo o tu número de WhatsApp como usuario.\")\n        with st.form(\"registro\"):\n            usuario_txt = st.text_input(\"Correo o celular (WhatsApp)\", key=\"reg_correo\", autocomplete=\"username\",\n                                        placeholder=\"tucorreo@gmail.com o 3001234567\")\n            clave = st.text_input(\"Contraseña (mínimo 8 caracteres)\", type=\"password\", key=\"reg_clave\",\n                                  autocomplete=\"new-password\")\n            clave2 = st.text_input(\"Repite la contraseña\", type=\"password\", autocomplete=\"new-password\")\n            recordar = st.checkbox(\"Mantener la sesión iniciada en este celular\", value=True, key=\"reg_recordar\")\n            if st.form_submit_button(\"Crear cuenta\", type=\"primary\", width=\"stretch\"):\n                try:\n                    correo = normalizar_identificador(usuario_txt)\n                except ErrorValidacion as e:\n                    correo = None\n                    error(str(e))\n                if correo is None:\n                    pass\n                elif clave != clave2:\n                    error(\"Las contraseñas no coinciden.\")\n                elif db.obtener_usuario(correo):\n                    error(\"Ya existe una cuenta con ese correo o celular.\")\n                else:\n                    s = SistemaConductor()\n                    try:\n                        s.crear_cuenta(correo, clave)\n                        db.guardar_usuario(s._usuarios[correo])\n                        if recordar:\n                            db.recordar_sesion(correo)\n                        db.guardar_traza(correo, s)\n                        st.session_state[\"correo\"] = correo\n                        aviso(\"Cuenta creada. Completa tus datos y los de tu vehículo para empezar.\", \"arranque\")\n                        st.rerun()\n                    except ErrorValidacion as e:\n                        error(str(e))\n\n\n# =====================================================================\n# FOTOS DEL CONDUCTOR Y DEL VEHÍCULO\n# =====================================================================\ndef reducir_foto(datos: bytes, lado=640) -> bytes:\n    \"\"\"Reduce la foto (las del celular pesan varios MB) y la guarda como JPEG liviano.\"\"\"\n    from PIL import Image, ImageOps\n    img = Image.open(io.BytesIO(datos))\n    img = ImageOps.exif_transpose(img).convert(\"RGB\")\n    img.thumbnail((lado, lado))\n    salida = io.BytesIO()\n    img.save(salida, \"JPEG\", quality=80, optimize=True)\n    return salida.getvalue()\n\n\ndef bloque_foto(s, correo, tipo, titulo):\n    actual = db.leer_foto(correo, tipo)\n    col1, col2 = st.columns([1, 2])\n    with col1:\n        if actual:\n            st.image(actual, width=160)\n        else:\n            diseno.vacio(f\"Sin {titulo.lower()}\")\n    with col2:\n        archivo = st.file_uploader(f\"{titulo} (toma una o elige de la galería)\", type=[\"jpg\", \"jpeg\", \"png\", \"webp\"],\n                                   key=f\"foto_{tipo}\")\n        if st.button(f\"📷 Guardar {titulo.lower()}\", key=f\"guardar_foto_{tipo}\", disabled=not archivo, width=\"stretch\"):\n            try:\n                datos = reducir_foto(archivo.getvalue())\n            except Exception:\n                error(\"No se pudo leer esa imagen. Prueba con una foto en JPG o PNG.\")\n            else:\n                db.guardar_foto(correo, tipo, datos)\n                s.traza.evento(\"Perfil\", f\"{titulo} actualizada ({len(datos) // 1024} KB)\", correo)\n                db.guardar_traza(correo, s)\n                aviso(f\"{titulo} guardada.\")\n                st.rerun()\n        if actual and st.button(f\"Quitar {titulo.lower()}\", key=f\"quitar_foto_{tipo}\", width=\"stretch\"):\n            db.eliminar_foto(correo, tipo)\n            s.traza.evento(\"Perfil\", f\"{titulo} eliminada\", correo)\n            db.guardar_traza(correo, s)\n            aviso(f\"{titulo} eliminada.\")\n            st.rerun()\n\n\n# =====================================================================\n# MI PERFIL: conductor, vehículo y configuración\n# =====================================================================\ndef pantalla_perfil(s, correo):\n    p = s.perfil\n    diseno.encabezado(\"perfil\", \"Mi perfil\", \"Tus datos, los del vehículo y cómo se califica tu ingreso.\")\n    t1, t2, t3, t4 = st.tabs([\"Conductor\", \"Vehículo\", \"Configuración\", \"Copia de seguridad\"])\n\n    with t1:\n        c = p.conductor\n        bloque_foto(s, correo, \"conductor\", \"Foto del conductor\")\n        st.caption(f\"Usuario de la cuenta: {correo}\")\n        col1, col2 = st.columns(2)\n        nombres = col1.text_input(\"Nombres\", c.nombres if c else \"\")\n        apellidos = col2.text_input(\"Apellidos\", c.apellidos if c else \"\")\n        tipos = [\"CC\", \"CE\", \"PPT\", \"Pasaporte\"]\n        tipo_doc = col1.selectbox(\"Tipo de documento\", tipos, index=tipos.index(c.tipo_documento) if c and c.tipo_documento in tipos else 0)\n        num_doc = col2.text_input(\"Número de documento\", c.numero_documento if c else \"\")\n        celular = col1.text_input(\"Celular\", c.celular if c else \"\")\n        ciudad = col2.text_input(\"Ciudad\", c.ciudad if c else \"Bogotá\")\n        actuales = c.plataformas if c else {}\n        elegidas = st.multiselect(\"Plataformas en las que trabajas\", PLATAFORMAS,\n                                  default=[x for x in actuales if x in PLATAFORMAS] or [\"Uber\"])\n        comisiones = {}\n        if elegidas:\n            st.caption(\"Porcentaje que te cobra cada plataforma\")\n            cols = st.columns(min(len(elegidas), 3))\n            for i, nombre in enumerate(elegidas):\n                comisiones[nombre] = cols[i % 3].number_input(\n                    f\"% {nombre}\", 0.0, 99.0, float(actuales.get(nombre, 0.25) * 100), 1.0, key=f\"com_{nombre}\") / 100\n        if st.button(\"Guardar datos del conductor\", type=\"primary\", width=\"stretch\"):\n            if not (nombres and apellidos and num_doc and elegidas):\n                error(\"Nombres, apellidos, documento y al menos una plataforma son obligatorios.\")\n            else:\n                accion(s, correo, lambda: s.registrar_conductor(\n                    nombres=nombres, apellidos=apellidos, tipo_documento=tipo_doc, numero_documento=num_doc,\n                    celular=celular, ciudad=ciudad, plataformas=comisiones),\n                    lambda cond: db.guardar_conductor(correo, cond), \"Datos del conductor guardados.\")\n\n    with t2:\n        v = p.vehiculo\n        bloque_foto(s, correo, \"vehiculo\", \"Foto del vehículo\")\n        with st.form(\"vehiculo\"):\n            col1, col2 = st.columns(2)\n            tipo = col1.selectbox(\"Tipo\", [\"carro\", \"moto\"], index=1 if v and v.tipo == \"moto\" else 0)\n            placa = col2.text_input(\"Placa\", v.placa if v else \"\").upper()\n            marca = col1.text_input(\"Marca\", v.marca if v else \"\")\n            referencia = col2.text_input(\"Referencia / línea\", v.referencia if v else \"\")\n            modelo = col1.number_input(\"Modelo (año)\", 1980, ahora().year + 1, v.modelo if v else 2020)\n            cilindrada = col2.number_input(\"Cilindrada (cc)\", 50, 8000, v.cilindrada_cc if v else 1400, 50)\n            combustibles = [\"gasolina\", \"diésel\", \"GNV\", \"eléctrico\", \"híbrido\"]\n            combustible = col1.selectbox(\"Combustible\", combustibles,\n                                         index=combustibles.index(v.combustible) if v and v.combustible in combustibles else 0)\n            rendimiento = col2.number_input(\"Rendimiento (km por galón)\", 1.0, 300.0,\n                                            float(v.rendimiento_km_galon) if v else 40.0, 1.0)\n            odometro = st.number_input(\"Kilometraje actual del odómetro\", 0.0, 2_000_000.0,\n                                       float(v.odometro_km) if v else 0.0, 1.0,\n                                       help=\"Se actualiza solo al abrir y cerrar cada jornada y con cada tanqueo.\")\n            if st.form_submit_button(\"Guardar vehículo\", type=\"primary\", width=\"stretch\"):\n                if not (placa and marca and referencia):\n                    error(\"Placa, marca y referencia son obligatorias.\")\n                else:\n                    accion(s, correo, lambda: s.registrar_vehiculo(\n                        placa=placa, tipo=tipo, marca=marca, referencia=referencia, modelo=int(modelo),\n                        cilindrada_cc=int(cilindrada), combustible=combustible,\n                        rendimiento_km_galon=rendimiento, odometro_km=odometro),\n                        lambda veh: db.guardar_vehiculo(correo, veh), \"Vehículo guardado.\")\n\n    with t3:\n        cfg = s.cfg\n        with st.form(\"config\"):\n            st.write(\"**Semáforo de ingreso por kilómetro**\")\n            col1, col2 = st.columns(2)\n            medio = col1.number_input(\"Desde este valor es MEDIO ($/km)\", 0, 20000, int(cfg.umbral_medio), 100)\n            muy_bueno = col2.number_input(\"Desde este valor es MUY BUENO ($/km)\", 0, 20000, int(cfg.umbral_muy_bueno), 100)\n            st.write(\"**Semáforo de ingreso por hora**\")\n            col1, col2 = st.columns(2)\n            h_medio = col1.number_input(\"Desde este valor es MEDIO ($/hora)\", 0, 500000,\n                                        int(cfg.umbral_hora_medio), 1000)\n            h_muy_bueno = col2.number_input(\"Desde este valor es MUY BUENO ($/hora)\", 0, 500000,\n                                            int(cfg.umbral_hora_muy_bueno), 1000)\n            ahorro_pct = st.slider(\"Porcentaje de la utilidad para ahorro\", 0, 80, int(cfg.porcentaje_ahorro * 100))\n            if st.form_submit_button(\"Guardar configuración\", width=\"stretch\"):\n                if muy_bueno <= medio or h_muy_bueno <= h_medio:\n                    error(\"En cada semáforo, el valor de MUY BUENO debe ser mayor que el de MEDIO.\")\n                else:\n                    nueva = Configuracion(medio, muy_bueno, ahorro_pct / 100,\n                                          umbral_hora_medio=h_medio, umbral_hora_muy_bueno=h_muy_bueno, modo=cfg.modo,\n                                          rendimiento_fuente=cfg.rendimiento_fuente)\n                    s.traza.evento(\"Configuración\", f\"Umbrales $/km {medio}/{muy_bueno}, $/hora {h_medio}/{h_muy_bueno}, \"\n                                                    f\"ahorro {ahorro_pct}%\", correo)\n                    db.guardar_configuracion(correo, nueva)\n                    db.guardar_traza(correo, s)\n                    aviso(\"Configuración guardada.\")\n                    st.rerun()\n\n\n    with t4:\n        st.write(\"En la app del celular tus datos se guardan **solo en este teléfono**. Descarga una copia \"\n                 \"cada semana y guárdala en Drive, iCloud o envíatela por correo: si cambias o pierdes el \"\n                 \"celular, la restauras y recuperas todo.\")\n        st.download_button(\"⬇️ Descargar copia de seguridad\", db.exportar_copia(),\n                           f\"control_conductor_{ahora():%Y-%m-%d}.db\", \"application/octet-stream\",\n                           type=\"primary\", width=\"stretch\", key=\"descargar_copia\")\n        st.divider()\n        st.write(\"**Restaurar una copia**\")\n        st.caption(\"Reemplaza todos los datos de este teléfono por los de la copia.\")\n        archivo = st.file_uploader(\"Copia de seguridad (.db)\", type=[\"db\"], key=\"subir_copia_perfil\")\n        confirmar = st.checkbox(\"Entiendo que los datos actuales se reemplazan por los de la copia\",\n                                key=\"confirmar_copia_perfil\")\n        if st.button(\"Restaurar copia\", disabled=not (archivo and confirmar), width=\"stretch\"):\n            try:\n                db.restaurar_copia(archivo.getvalue(), correo_requerido=correo)\n                s2 = db.cargar_sistema(correo)\n                s2.traza.evento(\"Copia de seguridad\", f\"Copia restaurada desde {archivo.name}\", correo)\n                db.guardar_traza(correo, s2)\n                aviso(\"Copia restaurada. Ya tienes todos los datos de la copia.\", \"cierre\")\n                st.rerun()\n            except ValueError as e:\n                error(f\"⚠️ {e}\")\n\n\n# =====================================================================\n# VIAJES GUARDADOS: tabla, corrección y eliminación\n# =====================================================================\ndef etiqueta_viaje(s, v) -> str:\n    return (f\"#{s.numero_viaje(v)} · {v.inicio:%H:%M}–{v.fin:%H:%M} · {v.plataforma} · {cop(v.valor)} · \"\n            f\"{v.km_pasajero:g} km · {v.metodo_pago}\")\n\n\ndef selector_pago(actual=\"Efectivo\", key=None, columna=st):\n    actual = normalizar_pago(actual) if actual else \"Efectivo\"\n    return columna.radio(\"Medio de pago\", METODOS_PAGO, index=METODOS_PAGO.index(actual), horizontal=True,\n                         format_func=lambda m: f\"{ICONO_PAGO[m]} {m}\", key=key)\n\n\ndef seccion_viajes(s, correo, jornada, titulo):\n    \"\"\"Muestra los viajes de una jornada y permite corregirlos o eliminarlos.\"\"\"\n    if not jornada.viajes:\n        return\n    st.subheader(titulo)\n    filas = []\n    for v in jornada.viajes:\n        clase = clasificar_ingreso_km(v.valor / v.km_pasajero, s.cfg) if v.km_pasajero else \"BAJO\"\n        filas.append({\"#\": s.numero_viaje(v), \"Inicio\": f\"{v.inicio:%H:%M}\", \"Fin\": f\"{v.fin:%H:%M}\",\n                      \"Valor\": cop(v.valor), \"Pago\": f\"{ICONO_PAGO.get(v.metodo_pago, '')} {v.metodo_pago}\",\n                      \"Km\": v.km_pasajero, \"$/km\": cop(v.valor / v.km_pasajero) if v.km_pasajero else \"—\",\n                      \"Nivel\": f\"{SEMAFORO[clase]} {clase}\", \"Plataforma\": v.plataforma,\n                      \"Propina\": cop(v.propina)})\n    st.dataframe(pd.DataFrame(filas), hide_index=True, width=\"stretch\")\n\n    k = f\"j{jornada.id}\"\n    with st.expander(\"✏️ Corregir o eliminar un viaje\"):\n        ids = [v.id for v in jornada.viajes]\n        vid = st.selectbox(\"Viaje\", ids, key=f\"{k}_sel\",\n                           format_func=lambda i: etiqueta_viaje(s, next(x for x in jornada.viajes if x.id == i)))\n        num = s.numero_viaje(next(x for x in jornada.viajes if x.id == vid))\n        v = next(x for x in jornada.viajes if x.id == vid)\n        plataformas = list(s.perfil.conductor.plataformas)\n        if v.plataforma not in plataformas:\n            plataformas.append(v.plataforma)\n\n        with st.form(f\"{k}_editar_{v.id}\"):\n            col1, col2 = st.columns(2)\n            hi = col1.time_input(\"Hora inicio\", v.inicio.time(), key=f\"{k}_{v.id}_hi\", step=60)\n            hf = col2.time_input(\"Hora fin\", v.fin.time(), key=f\"{k}_{v.id}_hf\", step=60)\n            plataforma = st.selectbox(\"Plataforma\", plataformas, index=plataformas.index(v.plataforma),\n                                      key=f\"{k}_{v.id}_pl\")\n            col1, col2 = st.columns(2)\n            valor = col1.number_input(\"Valor cobrado ($)\", 0, 5_000_000, int(v.valor), 1000, key=f\"{k}_{v.id}_va\")\n            km = col2.number_input(\"Km con pasajero\", 0.0, 1000.0, float(v.km_pasajero), 0.5, key=f\"{k}_{v.id}_km\")\n            pago = selector_pago(v.metodo_pago, key=f\"{k}_{v.id}_pa\")\n            propina = st.number_input(\"Propina ($)\", 0, 1_000_000, int(v.propina), 1000, key=f\"{k}_{v.id}_pr\")\n            if st.form_submit_button(\"💾 Guardar cambios\", type=\"primary\", width=\"stretch\"):\n                inicio = combinar(jornada.inicio, hi, jornada.inicio)\n                fin = combinar(inicio, hf, inicio)\n                problema = revisar_horas_viaje(inicio, fin, jornada.inicio, jornada.fin)\n                try:\n                    if problema:\n                        raise ErrorValidacion(problema)\n                    s.editar_viaje(v.id, inicio, fin, plataforma, valor, km, pago, propina)\n                    db.actualizar_viaje(v)\n                    s.metricas_dia(inicio.date(), registrar=True)\n                    texto = f\"Viaje #{s.numero_viaje(v)} corregido: {cop(valor)} — {cop(valor / km)}/km.\"\n                    recalculados = recalcular_dias(s, jornada)  # recalcula el día y deja traza\n                    for r in recalculados:\n                        texto += f\" Utilidad del día {r['fecha']:%d/%m}: {cop(r['utilidad_neta'])}.\"\n                    actualizar_consolidados(s, correo, [r[\"fecha\"] for r in recalculados])\n                    db.guardar_traza(correo, s)\n                    aviso(texto)\n                    st.rerun()\n                except ErrorValidacion as e:\n                    error(f\"⚠️ {e}\")\n\n        st.caption(\"Eliminar borra el viaje de la jornada. El registro queda en la trazabilidad.\")\n        confirmar = st.checkbox(f\"Sí, quiero eliminar el viaje #{num}\", key=f\"{k}_{v.id}_conf\")\n        if st.button(\"🗑️ Eliminar viaje\", key=f\"{k}_{v.id}_del\", disabled=not confirmar, width=\"stretch\"):\n            s.eliminar_viaje(v.id)\n            db.eliminar_viaje(v.id)\n            s.metricas_dia(v.inicio.date(), registrar=True)\n            actualizar_consolidados(s, correo, [r[\"fecha\"] for r in recalcular_dias(s, jornada)])\n            db.guardar_traza(correo, s)\n            aviso(f\"Viaje #{num} eliminado. Los viajes siguientes del día se renumeran.\")\n            st.rerun()\n\n\n# =====================================================================\n# JORNADA DE HOY: abrir turno, registrar viajes, cerrar\n# =====================================================================\ndef pantalla_jornada(s, correo):\n    p = s.perfil\n    diseno.encabezado(\"jornada\", \"Jornada de hoy\",\n                      \"Cierra para almorzar y vuelve a abrir cuando quieras: el día suma todos los turnos \"\n                      \"de 00:00 a 24:00.\")\n    abierta = next((j for j in p.jornadas if not j.cerrada), None)\n    hoy = ahora().date()\n    if abierta:\n        dia_ref = s.corte_jornada(abierta).date()\n    else:\n        dias = s.dias_trabajados()\n        dia_ref = hoy if hoy in dias or not dias else dias[-1]\n\n    def resumen_del_dia():\n        if s.turnos_del_dia(dia_ref):\n            titulo = \"Hoy\" if dia_ref == hoy else f\"Último día trabajado ({dia_ref:%d/%m/%Y})\"\n            st.subheader(titulo)\n            bloque_horas(s, dia_ref)\n\n    if not abierta:\n        if not p.tanqueos:\n            st.info(\"💡 Registra al menos un tanqueo en **⛽ Combustible** para que la app conozca el precio del galón.\")\n        with st.form(\"abrir\"):\n            col1, col2 = st.columns(2)\n            fecha = col1.date_input(\"Fecha\", ahora().date(), key=\"abrir_fecha\")\n            hora = col2.time_input(\"Hora de inicio\", hora_actual(), key=\"abrir_hora\", step=60)\n            odo = st.number_input(\"Odómetro inicial (km)\", 0.0, 2_000_000.0, float(p.vehiculo.odometro_km), 1.0,\n                                  key=f\"abrir_odo_{p.vehiculo.odometro_km:.0f}\",\n                                  help=\"Sale del kilometraje de tu vehículo. Si el tablero del carro marca más, \"\n                                       \"escribe el valor real y el vehículo se actualiza.\")\n            st.caption(f\"Kilometraje registrado del vehículo ({p.vehiculo.placa}): {p.vehiculo.odometro_km:,.0f} km\")\n            if st.form_submit_button(\"▶️ Abrir jornada\", type=\"primary\", width=\"stretch\"):\n                def guardar_apertura(j):\n                    db.guardar_jornada(correo, j)\n                    db.guardar_vehiculo(correo, p.vehiculo)\n\n                accion(s, correo, lambda: s.abrir_jornada(datetime.combine(fecha, hora), odo),\n                       guardar_apertura, \"Jornada abierta. ¡Buen turno!\", \"arranque\")\n\n        resumen_del_dia()\n        cerradas_dia = [j for j in p.jornadas if j.cerrada and dia_ref in (j.inicio.date(), j.fin.date())]\n        for j in reversed(cerradas_dia):\n            st.divider()\n            seccion_viajes(s, correo, j,\n                           f\"Viajes del turno cerrado ({j.inicio:%H:%M} a {j.fin:%H:%M})\")\n        return\n\n    bruto = sum(v.valor for v in abierta.viajes)\n    km_pas = sum(v.km_pasajero for v in abierta.viajes)\n    st.success(f\"Turno abierto desde {abierta.inicio:%d/%m/%Y %H:%M} — odómetro {abierta.odometro_inicial:,.0f} km\")\n    pausa = abierta.pausa_abierta\n    if pausa:\n        st.warning(f\"⏸️ Turno en pausa desde las {pausa[0]:%H:%M}. El tiempo de descanso no cuenta como horas \"\n                   \"trabajadas.\")\n        with st.form(\"reanudar\"):\n            hr = st.time_input(\"Hora en que terminó el descanso\", hora_actual(), step=60,\n                               key=f\"reanudar_hora_{abierta.id}_{len(abierta.pausas)}\")\n            if st.form_submit_button(\"▶️ Reanudar turno\", type=\"primary\", width=\"stretch\"):\n                fin_pausa = combinar(pausa[0], hr, pausa[0] + timedelta(minutes=1))\n\n                def guardar_reanudar(_):\n                    db.guardar_pausas(abierta)\n                    s.metricas_dia(fin_pausa.date(), registrar=True)\n\n                accion(s, correo, lambda: s.reanudar_turno(abierta.id, fin_pausa), guardar_reanudar,\n                       f\"Turno reanudado. Descansaste {texto_horas((fin_pausa - pausa[0]).total_seconds() / 3600)}.\",\n                       \"arranque\")\n    resumen_del_dia()\n\n    if p.tanqueos:\n        with st.expander(\"⛽ Combustible del turno (según los km andados)\", expanded=False):\n            combustible_turno(s, abierta, \"jornada\")\n\n    if pausa:\n        st.info(\"Para registrar viajes, primero reanuda el turno.\")\n        seccion_viajes(s, correo, abierta, \"Viajes del turno en curso\")\n        cierre_turno(s, correo, abierta, p)\n        return\n\n    with st.expander(\"⏸️ Pausar turno (descanso, almuerzo)\"):\n        with st.form(\"pausar\"):\n            hp = st.time_input(\"Hora de inicio del descanso\", hora_actual(), step=60,\n                               key=f\"pausar_hora_{abierta.id}_{len(abierta.pausas)}\")\n            if st.form_submit_button(\"⏸️ Pausar turno\", width=\"stretch\"):\n                inicio_pausa = combinar(abierta.inicio, hp, abierta.inicio)\n                accion(s, correo, lambda: s.pausar_turno(abierta.id, inicio_pausa),\n                       lambda _: db.guardar_pausas(abierta), f\"Turno en pausa desde las {hp:%H:%M}. ¡Buen descanso!\",\n                       \"cierre\")\n\n    st.subheader(\"Nuevo viaje\")\n    ultimo_fin = abierta.viajes[-1].fin if abierta.viajes else abierta.inicio\n    with st.form(\"viaje\", clear_on_submit=True):\n        col1, col2 = st.columns(2)\n        n_viaje = f\"{abierta.id}_{len(abierta.viajes)}\"\n        hi = col1.time_input(\"Hora inicio\", ultimo_fin.time().replace(second=0, microsecond=0),\n                             key=f\"nv_hi_{n_viaje}\", step=60)\n        hf = col2.time_input(\"Hora fin\", hora_actual(), key=f\"nv_hf_{n_viaje}\", step=60)\n        plataforma = st.selectbox(\"Plataforma\", list(p.conductor.plataformas))\n        col1, col2 = st.columns(2)\n        valor = col1.number_input(\"Valor cobrado ($)\", 0, 5_000_000, 0, 1000)\n        km = col2.number_input(\"Km con pasajero\", 0.0, 1000.0, 0.0, 0.5)\n        pago = selector_pago(abierta.viajes[-1].metodo_pago if abierta.viajes else \"Efectivo\",\n                             key=f\"nv_pago_{n_viaje}\")\n        propina = st.number_input(\"Propina ($)\", 0, 1_000_000, 0, 1000)\n        if km > 0 and valor > 0:\n            st.caption(f\"Valor por km: {cop(valor / km)}\")\n        if st.form_submit_button(\"Guardar viaje\", type=\"primary\", width=\"stretch\"):\n            if valor <= 0 or km <= 0:\n                error(\"Ingresa el valor cobrado y los km con pasajero.\")\n            else:\n                inicio = combinar(abierta.inicio, hi, abierta.inicio)\n                fin = combinar(inicio, hf, inicio)\n                problema = revisar_horas_viaje(inicio, fin, abierta.inicio)\n                vkm = valor / km\n                clase = clasificar_ingreso_km(vkm, s.cfg)\n\n                def registrar():\n                    if problema:\n                        raise ErrorValidacion(problema)\n                    return s.registrar_viaje(abierta.id, inicio, fin, plataforma, valor, km, pago, propina)\n\n                def guardar(v):\n                    db.guardar_viaje(abierta.id, v)\n                    s.metricas_dia(v.inicio.date(), registrar=True)\n\n                siguiente = len(s.viajes_del_dia(inicio.date())) + 1\n                accion(s, correo, registrar, guardar,\n                       f\"Viaje #{siguiente} del día guardado: {cop(valor)} en {pago} — {cop(vkm)}/km \"\n                       f\"{SEMAFORO[clase]} {clase}\",\n                       {\"MUY BUENO\": \"muy_bueno\", \"MEDIO\": \"medio\", \"BAJO\": \"bajo\"}[clase])\n\n    seccion_viajes(s, correo, abierta, \"Viajes del turno en curso\")\n    cierre_turno(s, correo, abierta, p)\n\n\ndef cierre_turno(s, correo, abierta, p):\n    km_pas = sum(v.km_pasajero for v in abierta.viajes)\n    st.subheader(\"Cerrar jornada\")\n    with st.form(\"cerrar\"):\n        st.caption(f\"El turno empezó el {abierta.inicio:%d/%m/%Y} a las {abierta.inicio:%H:%M}.\")\n        # Turno en vivo: hoy. Turno de hace más de un día (registro atrasado): el día en que empezó.\n        fecha_def = ahora().date() if ahora() - abierta.inicio <= timedelta(hours=24) else abierta.inicio.date()\n        col1, col2 = st.columns(2)\n        fc = col1.date_input(\"Fecha de cierre\", fecha_def, min_value=abierta.inicio.date(),\n                             key=f\"cerrar_fecha_{abierta.id}\")\n        hc = col2.time_input(\"Hora de cierre\", hora_actual(), key=f\"cerrar_hora_{abierta.id}\", step=60)\n        largo = st.checkbox(\"Confirmo que el turno duró más de 24 horas\", key=f\"cerrar_largo_{abierta.id}\")\n        odo_f = st.number_input(\"Odómetro final (km)\", float(abierta.odometro_inicial), 2_000_000.0,\n                                  max(float(abierta.odometro_inicial + km_pas),\n                                      float(st.session_state.get(f\"odo_ahora_{abierta.id}\", 0))), 1.0,\n                                  key=f\"cerrar_odo_{abierta.id}_{len(abierta.viajes)}_\"\n                                      f\"{st.session_state.get(f'odo_ahora_{abierta.id}', 0):.0f}\")\n        if st.form_submit_button(\"Cerrar jornada y calcular\", type=\"primary\", width=\"stretch\"):\n            fin = datetime.combine(fc, hc)\n            if fc == abierta.inicio.date() and fin <= abierta.inicio:\n                fin += timedelta(days=1)  # hora menor que la de inicio en el mismo día = pasó la medianoche\n            ultimo = max((v.fin for v in abierta.viajes), default=abierta.inicio)\n            try:\n                if fin <= abierta.inicio:\n                    raise ErrorValidacion(f\"El cierre ({fin:%d/%m %H:%M}) debe ser después del inicio del turno \"\n                                          f\"({abierta.inicio:%d/%m %H:%M}). Revisa la fecha y la hora.\")\n                if fin > ahora() + timedelta(minutes=15):\n                    raise ErrorValidacion(f\"El cierre ({fin:%d/%m %H:%M}) queda en el futuro. Revisa la fecha y la hora.\")\n                if fin - abierta.inicio > timedelta(hours=24) and not largo:\n                    raise ErrorValidacion(f\"El turno quedaría de {texto_horas((fin - abierta.inicio).total_seconds() / 3600)}. \"\n                                          \"Si es correcto, marca «Confirmo que el turno duró más de 24 horas»; \"\n                                          \"si no, revisa la fecha de cierre.\")\n                if fin < ultimo:\n                    raise ErrorValidacion(f\"La hora de cierre ({hc:%H:%M}) es anterior al último viaje, \"\n                                          f\"que terminó a las {ultimo:%H:%M}.\")\n                s.cerrar_jornada(abierta.id, fin, odo_f)\n                db.guardar_jornada(correo, abierta)\n                db.guardar_pausas(abierta)\n                db.guardar_vehiculo(correo, p.vehiculo)\n                dias_cierre = recalcular_dias(s, abierta)  # análisis oficial de cada día, con trazabilidad\n                for r in dias_cierre:\n                    s.metricas_dia(r[\"fecha\"], registrar=True)\n                actualizar_consolidados(s, correo, [r[\"fecha\"] for r in dias_cierre])\n                db.guardar_traza(correo, s)\n                st.session_state[\"ir_a\"] = \"📊 Tablero\"\n                st.session_state[\"tablero_dia\"] = abierta.inicio.date()\n                if dias_cierre:\n                    r = dias_cierre[0]\n                    aviso(f\"Jornada cerrada. Este es el análisis del día {r['fecha']:%d/%m/%Y}: \"\n                          f\"{r['turnos']} turno(s), {texto_horas(r['horas'])} trabajadas. Kilometraje del \"\n                          f\"vehículo: {p.vehiculo.odometro_km:,.0f} km.\", \"cierre\")\n                else:\n                    aviso(\"Jornada cerrada.\", \"cierre\")\n                st.rerun()\n            except ErrorValidacion as e:\n                error(f\"⚠️ {e}\")\n\n\n# =====================================================================\n# BILLETERA: cuánto hay en cada cuenta\n# =====================================================================\ndef pantalla_billetera(s, correo):\n    p = s.perfil\n    diseno.encabezado(\"billetera\", \"Billetera\",\n                      \"Cuánto tienes en efectivo, en la app, en Nequi y en Daviplata según cómo te pagó cada viaje.\")\n    with s.sin_traza():\n        saldos = s.saldos_billetera().set_index(\"cuenta\")\n    for par in (METODOS_PAGO[:2], METODOS_PAGO[2:]):  # filas de dos, en el mismo orden en el celular\n        for col, cuenta in zip(st.columns(2), par):\n            col.metric(f\"{ICONO_PAGO[cuenta]} {cuenta}\", cop(saldos.loc[cuenta, \"saldo\"]))\n    st.markdown(f\"### Total: {cop(saldos['saldo'].sum())}\")\n    st.caption(\"Saldo = saldo inicial + lo cobrado en los viajes (valor + propina) + entradas − salidas ± \"\n               \"traslados. Las comisiones de la plataforma no se descuentan aquí: cuando te las cobren, \"\n               \"regístralas como salida.\")\n\n    t1, t2, t3 = st.tabs([\"Hoy\", \"Registrar movimiento\", \"Movimientos\"])\n    with t1:\n        hoy = ahora().date()\n        dia = st.date_input(\"Día\", hoy, key=\"billetera_dia\")\n        cobrado = s.cobrado_por_medio(dia, dia)\n        viajes = s.viajes_del_dia(dia)\n        if not viajes:\n            diseno.vacio(\"No hay viajes ese día.\")\n        else:\n            for par in (METODOS_PAGO[:2], METODOS_PAGO[2:]):\n                for col, cuenta in zip(st.columns(2), par):\n                    n = sum(1 for v in viajes if v.metodo_pago == cuenta)\n                    col.metric(f\"{ICONO_PAGO[cuenta]} {cuenta}\", cop(cobrado[cuenta]),\n                               f\"{n} viaje(s)\" if n else None, delta_color=\"off\")\n            st.dataframe(pd.DataFrame([{\"#\": s.numero_viaje(v), \"Hora\": f\"{v.inicio:%H:%M}\",\n                                        \"Plataforma\": v.plataforma, \"Medio\": f\"{ICONO_PAGO[v.metodo_pago]} {v.metodo_pago}\",\n                                        \"Valor\": cop(v.valor), \"Propina\": cop(v.propina)} for v in viajes]),\n                         hide_index=True, width=\"stretch\")\n\n    with t2:\n        tipo = st.radio(\"Tipo\", TIPOS_MOVIMIENTO, horizontal=True, key=\"mov_tipo\",\n                        captions=[\"Lo que tenías al empezar\", \"Dinero que entra\", \"Pagos o retiros\",\n                                  \"Pasar de una cuenta a otra\"])\n        with st.form(\"movimiento\", clear_on_submit=True):\n            col1, col2 = st.columns(2)\n            cuenta = col1.selectbox(\"Cuenta\" if tipo != \"Traslado\" else \"Sale de\", METODOS_PAGO,\n                                    format_func=lambda m: f\"{ICONO_PAGO[m]} {m}\")\n            destino = None\n            if tipo == \"Traslado\":\n                destino = col2.selectbox(\"Entra a\", METODOS_PAGO, index=2,\n                                         format_func=lambda m: f\"{ICONO_PAGO[m]} {m}\")\n            valor = st.number_input(\"Valor ($)\", 0, 50_000_000, 0, 1000)\n            col1, col2 = st.columns(2)\n            fecha = col1.date_input(\"Fecha\", ahora().date(), key=\"mov_fecha\")\n            concepto = col2.text_input(\"Concepto\", placeholder=\"Ej.: retiro cajero, pago comisión, almuerzo\")\n            if st.form_submit_button(\"Guardar movimiento\", type=\"primary\", width=\"stretch\"):\n                momento = datetime.combine(fecha, ahora().time().replace(microsecond=0))\n                accion(s, correo, lambda: s.registrar_movimiento(momento, tipo, cuenta, valor, concepto, destino),\n                       lambda m: db.guardar_movimiento(correo, m), f\"Movimiento guardado: {tipo} {cop(valor)}\", \"caja\")\n\n    with t3:\n        if not p.movimientos:\n            diseno.vacio(\"Aún no has registrado movimientos.\")\n        else:\n            movs = list(reversed(p.movimientos))\n            st.dataframe(pd.DataFrame([{\"Fecha\": f\"{m.fecha:%d/%m/%Y}\", \"Tipo\": m.tipo,\n                                        \"Cuenta\": m.cuenta + (f\" → {m.cuenta_destino}\" if m.cuenta_destino else \"\"),\n                                        \"Valor\": cop(m.valor), \"Concepto\": m.concepto} for m in movs]),\n                         hide_index=True, width=\"stretch\")\n            with st.expander(\"🗑️ Eliminar un movimiento\"):\n                i = st.selectbox(\"Movimiento\", range(len(movs)), key=\"mov_borrar\",\n                                 format_func=lambda i: f\"{movs[i].fecha:%d/%m} · {movs[i].tipo} · {movs[i].cuenta} · \"\n                                                       f\"{cop(movs[i].valor)} {movs[i].concepto}\")\n                confirmar = st.checkbox(\"Sí, quiero eliminarlo\", key=\"mov_borrar_conf\")\n                if st.button(\"Eliminar movimiento\", disabled=not confirmar, width=\"stretch\"):\n                    m = movs[i]\n                    s.eliminar_movimiento(m)\n                    db.eliminar_movimiento(correo, m)\n                    db.guardar_traza(correo, s)\n                    aviso(\"Movimiento eliminado.\")\n                    st.rerun()\n\n\n# =====================================================================\n# TABLERO\n# =====================================================================\ndef eliminar_dia_ui(s, correo, fecha):\n    turnos = [j for j in s.perfil.jornadas if j.inicio.date() == fecha]\n    if not turnos:\n        return\n    with st.expander(f\"🗑️ Eliminar el día {fecha:%d/%m/%Y}\"):\n        viajes = sum(len(j.viajes) for j in turnos)\n        ingreso = sum(v.valor for j in turnos for v in j.viajes)\n        st.write(f\"Se borran **{len(turnos)} turno(s)** de ese día con sus **{viajes} viaje(s)** \"\n                 f\"({cop(ingreso)}) y sus pausas. Los gastos y tanqueos de esa fecha se conservan; \"\n                 \"bórralos en su pantalla si también sobran.\")\n        st.caption(\"No se puede deshacer, pero queda registrado en Trazabilidad.\")\n        confirmar = st.checkbox(f\"Sí, quiero eliminar el día {fecha:%d/%m/%Y}\", key=f\"conf_borrar_dia_{fecha}\")\n        if st.button(\"Eliminar día\", disabled=not confirmar, width=\"stretch\", key=f\"borrar_dia_{fecha}\"):\n            try:\n                borrados = s.eliminar_dia(fecha)\n            except ErrorValidacion as e:\n                error(f\"⚠️ {e}\")\n                return\n            db.eliminar_jornadas(correo, borrados)\n            db.eliminar_consolidados(correo)  # se reconstruyen sin el día borrado\n            actualizar_consolidados(s, correo, s.dias_trabajados(incluir_abierta=False))\n            db.guardar_traza(correo, s)\n            st.session_state.pop(\"tablero_sel\", None)\n            aviso(f\"Día {fecha:%d/%m/%Y} eliminado: {len(borrados)} turno(s) y {viajes} viaje(s).\", \"cierre\")\n            st.rerun()\n\n\ndef pantalla_tablero(s, correo):\n    p = s.perfil\n    diseno.encabezado(\"tablero\", \"Tablero del día\",\n                      \"Lo que dejó el día después de comisión, gasolina, provisiones y gastos.\")\n    dias = s.dias_trabajados(incluir_abierta=False)\n    if not dias:\n        diseno.vacio(\"Aún no tienes jornadas cerradas. Abre tu primera jornada en <b>Jornada de hoy<\/b> \"\n                     \"y aquí verás lo que te dejó el día.\")\n        return\n    opciones = {f\"{d:%d/%m/%Y}\": d for d in reversed(dias)}\n    preferido = st.session_state.pop(\"tablero_dia\", None)\n    if preferido in opciones.values():\n        st.session_state[\"tablero_sel\"] = f\"{preferido:%d/%m/%Y}\"\n    if st.session_state.get(\"tablero_sel\") not in opciones:\n        st.session_state.pop(\"tablero_sel\", None)\n    elegida = st.selectbox(\"Día trabajado (00:00 a 24:00)\", list(opciones), key=\"tablero_sel\")\n    fecha = opciones[elegida]\n    eliminar_dia_ui(s, correo, fecha)\n    try:\n        with s.sin_traza():\n            r = s.calcular_dia(fecha)\n            m = s.metricas_dia(fecha)\n    except ErrorValidacion as e:\n        st.warning(str(e))\n        return\n    st.caption(f\"{texto_turnos(m)}\")\n    if m[\"en_curso\"]:\n        st.warning(\"Hay un turno en curso este día. El análisis incluye solo los turnos cerrados; \"\n                   \"se actualizará cuando lo cierres.\")\n\n    clase = r[\"clasificacion\"]\n    clase_h = r[\"clasificacion_hora\"]\n    diseno.taximetro(\"Utilidad neta del día\", cop(r[\"utilidad_neta\"]), r[\"utilidad_neta\"] < 0,\n                     f\"Ingreso {cop(r['ingreso_bruto'] + r['propinas'])} · {r['viajes']} viajes · \"\n                     f\"{texto_horas(r['horas'])}\",\n                     [(cop(r[\"ingreso_km\"]), \"Ingreso por km\", clase), (cop(r[\"ingreso_hora\"]), \"Ingreso por hora\", clase_h)])\n    c1, c2, c3 = st.columns(3)\n    c1.metric(\"Utilidad por hora\", cop(r[\"utilidad_hora\"]))\n    c2.metric(\"Ahorro sugerido\", cop(r[\"ahorro\"]))\n    c3.metric(\"Disponible para gastar\", cop(r[\"disponible\"]))\n    c1, c2, c3, c4 = st.columns(4)\n    c1.metric(\"Turnos\", r[\"turnos\"])\n    c2.metric(\"Horas trabajadas\", texto_horas(r[\"horas\"]))\n    c3.metric(\"Viajes\", r[\"viajes\"])\n    c4.metric(\"Viajes por hora\", f\"{r['viajes_hora']:.2f}\")\n\n    st.subheader(\"Turnos del día\")\n    turnos = s.tabla_turnos_dia(fecha)\n    st.dataframe(pd.DataFrame({\n        \"Turno\": turnos[\"turno\"], \"Inicio\": turnos[\"inicio\"], \"Fin\": turnos[\"fin\"],\n        \"Horas\": turnos[\"horas\"].map(texto_horas), \"Km\": turnos[\"km\"].map(lambda x: \"—\" if pd.isna(x) else f\"{x:,.1f}\"),\n        \"Viajes\": turnos[\"viajes\"], \"Ingreso\": turnos[\"ingreso\"].map(cop), \"Nota\": turnos[\"nota\"]}),\n        hide_index=True, width=\"stretch\")\n    if r[\"pausas_horas\"]:\n        st.caption(f\"Pausas entre turnos: {texto_horas(r['pausas_horas'])} (no cuentan como horas trabajadas).\")\n\n    st.subheader(\"Combustible del día\")\n    c1, c2, c3, c4 = st.columns(4)\n    c1.metric(\"Km recorridos\", f\"{r['km_totales']:,.1f}\")\n    c2.metric(\"Km en vacío\", f\"{r['km_vacio']:,.1f}\")\n    c3.metric(\"Galones consumidos\", f\"{r['galones']:.2f}\")\n    c4.metric(\"Costo gasolina\", cop(r[\"gasolina\"]))\n    st.caption(f\"Precio del galón usado: {cop(r['precio_galon'])} · costo por km {cop(r['costo_gasolina_km'])}. \"\n               f\"Tanqueado ese día: {cop(r['tanqueado'])}.\")\n    gastos_dia = [g for g in p.gastos if g.fecha == fecha]\n    if gastos_dia:\n        st.subheader(\"Gastos del día\")\n        st.dataframe(pd.DataFrame([{\"Concepto\": g.concepto, \"Valor\": cop(g.valor)} for g in gastos_dia]),\n                     hide_index=True, width=\"stretch\")\n\n    st.subheader(\"¿A dónde se va la plata del día?\")\n    detalle = pd.DataFrame({\n        \"Concepto\": [\"Ingreso bruto + propinas\", \"Comisión plataformas\", \"Gasolina\",\n                     \"Provisión aceite\", \"Provisión llantas\", \"Provisión mantenimiento\",\n                     \"Provisión SOAT y RTM\", \"Gastos extra\", \"Utilidad neta\", \"→ Ahorro\", \"→ Disponible para gastar\"],\n        \"Valor\": [r[\"ingreso_bruto\"] + r[\"propinas\"], -r[\"comision\"], -r[\"gasolina\"], -r[\"aceite\"], -r[\"llantas\"],\n                  -r[\"mantenimiento\"], -r[\"provision_documentos\"], -r[\"gastos_extra\"],\n                  r[\"utilidad_neta\"], r[\"ahorro\"], r[\"disponible\"]],\n    })\n    st.dataframe(detalle.assign(Valor=detalle[\"Valor\"].map(cop)), hide_index=True, width=\"stretch\")\n    st.bar_chart(detalle.iloc[1:8].assign(Valor=lambda d: d[\"Valor\"].abs()).set_index(\"Concepto\"), horizontal=True)\n\n    with s.sin_traza():\n        total_fondo = sum(s.calcular_dia(d)[\"provision_total\"] for d in dias)\n    st.info(f\"🔧 **Fondo de mantenimiento:** con todos tus días trabajados deberías llevar apartados \"\n            f\"**{cop(total_fondo)}** para aceite, llantas, mantenimiento, SOAT y técnico-mecánica.\")\n\n\n# =====================================================================\n# VIAJES POR HORA\n# =====================================================================\ndef pantalla_por_hora(s, correo):\n    p = s.perfil\n    diseno.encabezado(\"hora\", \"Viajes por hora\", \"Cuántos viajes haces y cuánto cobras en cada hora del día.\")\n    t1, t2 = st.tabs([\"Por día\", \"Mejores horas\"])\n\n    with t1:\n        dias = s.dias_trabajados()\n        if not dias:\n            diseno.vacio(\"Aún no tienes jornadas. Abre la primera en <b>Jornada de hoy<\/b>.\")\n        else:\n            opciones = {f\"{d:%d/%m/%Y}\": d for d in reversed(dias)}\n            elegida = st.selectbox(\"Día trabajado (00:00 a 24:00)\", list(opciones), key=\"hora_dia\")\n            fecha = opciones[elegida]\n            m = bloque_horas(s, fecha)\n            franjas = s.desglose_por_dia(fecha)\n            st.subheader(\"Viajes por cada hora\")\n            mostrar_franjas(franjas, s.cfg)\n            if not franjas.empty:\n                cuadra = (int(franjas[\"viajes\"].sum()) == m[\"viajes\"]\n                          and abs(float(franjas[\"ingreso\"].sum()) - m[\"ingreso\"]) < 1\n                          and abs(franjas[\"minutos_trabajados\"].sum() / 60 - m[\"horas\"]) < 0.02)\n                if cuadra:\n                    st.caption(f\"✔ El desglose cuadra con el día: {texto_horas(m['horas'])}, \"\n                               f\"{m['viajes']} viajes y {cop(m['ingreso'])}.\")\n                else:\n                    st.warning(\"El desglose por hora no cuadra con el día. Revisa las horas de los viajes.\")\n                mejor = franjas.loc[franjas[\"ingreso\"].idxmax()]\n                st.success(f\"Tu mejor hora fue **{mejor['franja']}**: {mejor['viajes']} viajes por {cop(mejor['ingreso'])}.\")\n                st.download_button(\"⬇️ Descargar reporte del día (CSV)\", reporte_dia_csv(s, fecha, m, franjas),\n                                   f\"reporte_{fecha:%Y-%m-%d}.csv\", \"text/csv\",\n                                   width=\"stretch\", key=f\"rep_dia_{fecha}\")\n\n    with t2:\n        hoy = ahora().date()\n        col1, col2 = st.columns(2)\n        desde = col1.date_input(\"Desde\", hoy - timedelta(days=30), key=\"hora_desde\")\n        hasta = col2.date_input(\"Hasta\", hoy, key=\"hora_hasta\")\n        with s.sin_traza():\n            mh = s.mejores_horas(desde, hasta)\n        if mh.empty:\n            st.info(\"No hay jornadas cerradas en ese rango.\")\n        else:\n            st.write(\"Promedio de cada franja en los días que trabajaste a esa hora:\")\n            st.dataframe(pd.DataFrame({\n                \"Hora\": mh[\"franja\"], \"Días\": mh[\"dias\"], \"Viajes promedio\": mh[\"viajes_promedio\"],\n                \"Ingreso promedio\": mh[\"ingreso_promedio\"].map(cop),\n                \"Nivel\": mh[\"clasificacion\"].map(lambda c: f\"{SEMAFORO[c]} {c}\")}),\n                hide_index=True, width=\"stretch\")\n            st.bar_chart(pd.DataFrame({\"Hora\": mh[\"franja\"], \"Ingreso promedio\": mh[\"ingreso_promedio\"],\n                                       \"color\": mh[\"clasificacion\"].map(HEX_CLASE)}),\n                         x=\"Hora\", y=\"Ingreso promedio\", color=\"color\")\n            top = mh.sort_values(\"ingreso_promedio\", ascending=False).head(3)\n            st.success(\"Las horas que más te rinden: \" +\n                       \", \".join(f\"**{f}** ({cop(v)})\" for f, v in zip(top[\"franja\"], top[\"ingreso_promedio\"])))\n\n\n# =====================================================================\n# MANTENIMIENTO Y DOCUMENTOS\n# =====================================================================\ndef pantalla_mantenimiento(s, correo):\n    p = s.perfil\n    diseno.encabezado(\"mantenimiento\", \"Mantenimiento y documentos\",\n                      \"Aceite, llantas, SOAT y técnico-mecánica, con avisos antes de que se venzan.\")\n    t1, t2, t3 = st.tabs([\"Alertas\", \"Mantenimientos\", \"SOAT y técnico-mecánica\"])\n\n    with t1:\n        with s.sin_traza():\n            alertas = s.alertas()\n        if alertas.empty:\n            st.info(\"Registra tus mantenimientos y documentos para recibir alertas.\")\n        else:\n            st.dataframe(alertas, hide_index=True, width=\"stretch\")\n\n    with t2:\n        if p.mantenimientos:\n            st.dataframe(pd.DataFrame([{\n                \"Ítem\": m.nombre, \"Categoría\": m.categoria, \"Costo\": cop(m.costo),\n                \"Cada (km)\": f\"{m.intervalo_km:,.0f}\", \"Cada (meses)\": m.intervalo_meses,\n                \"Último (km)\": f\"{m.ultimo_km:,.0f}\", \"Última fecha\": m.ultima_fecha.strftime(\"%d/%m/%Y\"),\n                \"Costo por km\": cop(m.costo / m.intervalo_km, 2)} for m in p.mantenimientos]),\n                hide_index=True, width=\"stretch\")\n        with st.expander(\"➕ Agregar ítem de mantenimiento\", expanded=not p.mantenimientos):\n            st.caption(\"Ejemplos: cambio de aceite (aceite), juego de llantas (llantas), \"\n                       \"frenos, filtro de aire, batería, alineación y balanceo (general).\")\n            with st.form(\"mant\", clear_on_submit=True):\n                col1, col2 = st.columns(2)\n                nombre = col1.text_input(\"Nombre\")\n                categoria = col2.selectbox(\"Categoría\", [\"aceite\", \"llantas\", \"general\"])\n                costo = col1.number_input(\"Costo total ($)\", 0, 50_000_000, 0, 10000)\n                int_km = col2.number_input(\"Cada cuántos km\", 1, 500_000, 5000, 500)\n                int_meses = col1.number_input(\"Cada cuántos meses\", 1, 120, 6)\n                ultimo_km = col2.number_input(\"Km del último cambio\", 0.0, 2_000_000.0, float(p.vehiculo.odometro_km), 1.0)\n                ultima_fecha = st.date_input(\"Fecha del último cambio\", ahora().date())\n                if st.form_submit_button(\"Guardar ítem\", type=\"primary\", width=\"stretch\"):\n                    if not nombre or costo <= 0:\n                        error(\"Escribe el nombre y el costo.\")\n                    else:\n                        accion(s, correo, lambda: s.registrar_mantenimiento(\n                            nombre, categoria, costo, int_km, int(int_meses), ultimo_km, ultima_fecha),\n                            lambda m: db.guardar_mantenimiento(correo, m), f\"{nombre} agregado.\")\n        if p.mantenimientos:\n            with st.expander(\"✅ Registrar un cambio ya realizado\"):\n                with st.form(\"hecho\"):\n                    idx = st.selectbox(\"Ítem\", range(len(p.mantenimientos)),\n                                       format_func=lambda i: p.mantenimientos[i].nombre)\n                    col1, col2 = st.columns(2)\n                    fecha = col1.date_input(\"Fecha\", ahora().date(), key=\"f_hecho\")\n                    km = col2.number_input(\"Km del odómetro\", 0.0, 2_000_000.0, float(p.vehiculo.odometro_km), 1.0)\n                    costo = st.number_input(\"Costo pagado ($) — actualiza el costo para próximas provisiones\",\n                                            0, 50_000_000, int(p.mantenimientos[0].costo), 10000)\n                    if st.form_submit_button(\"Registrar cambio\", width=\"stretch\"):\n                        m = p.mantenimientos[idx]\n                        m.ultima_fecha, m.ultimo_km, m.costo = fecha, km, costo\n                        s.traza.evento(\"Mantenimiento\", f\"Cambio realizado: {m.nombre} el {fecha} a los {km:,.0f} km por {cop(costo)}\", correo)\n                        db.guardar_mantenimiento(correo, m)\n                        db.guardar_traza(correo, s)\n                        aviso(f\"Cambio de {m.nombre} registrado.\")\n                        st.rerun()\n\n    with t3:\n        if p.documentos:\n            st.dataframe(pd.DataFrame([{\n                \"Documento\": d.tipo, \"Entidad\": d.entidad, \"Valor\": cop(d.valor),\n                \"Expedición\": d.expedicion.strftime(\"%d/%m/%Y\"), \"Vence\": d.vencimiento.strftime(\"%d/%m/%Y\"),\n                \"Provisión diaria\": cop(d.valor / 365, 2)} for d in p.documentos]),\n                hide_index=True, width=\"stretch\")\n        with st.form(\"doc\", clear_on_submit=True):\n            st.write(\"**Registrar SOAT o técnico-mecánica**\")\n            col1, col2 = st.columns(2)\n            tipo = col1.selectbox(\"Documento\", [\"SOAT\", \"Técnico-mecánica\"])\n            entidad = col2.text_input(\"Aseguradora / CDA\")\n            valor = st.number_input(\"Valor pagado ($)\", 0, 10_000_000, 0, 10000)\n            col1, col2 = st.columns(2)\n            exp = col1.date_input(\"Fecha de expedición\", ahora().date())\n            ven = col2.date_input(\"Fecha de vencimiento\", ahora().date() + timedelta(days=365))\n            if st.form_submit_button(\"Guardar documento\", type=\"primary\", width=\"stretch\"):\n                accion(s, correo, lambda: s.registrar_documento(tipo, entidad, valor, exp, ven),\n                       lambda d: db.guardar_documento(correo, d), f\"{tipo} guardado.\")\n\n        if p.documentos:\n            editar_documentos(s, correo, p)\n\n\ndef editar_documentos(s, correo, p):\n    \"\"\"Corregir o eliminar un SOAT o técnico-mecánica ya guardado.\"\"\"\n    with st.expander(\"✏️ Editar o eliminar un documento\"):\n        docs = p.documentos\n        i = st.selectbox(\"Documento\", range(len(docs)), key=\"doc_sel\",\n                         format_func=lambda i: f\"{docs[i].tipo} · {docs[i].entidad or 'sin entidad'} · \"\n                                               f\"{cop(docs[i].valor)} · vence {docs[i].vencimiento:%d/%m/%Y}\")\n        d = docs[i]\n        k = f\"doc_{getattr(d, '_id', i)}\"\n        tipos = [\"SOAT\", \"Técnico-mecánica\"]\n        with st.form(f\"{k}_editar\"):\n            col1, col2 = st.columns(2)\n            tipo = col1.selectbox(\"Documento\", tipos, index=tipos.index(d.tipo) if d.tipo in tipos else 0, key=f\"{k}_ti\")\n            entidad = col2.text_input(\"Aseguradora / CDA\", d.entidad, key=f\"{k}_en\")\n            valor = st.number_input(\"Valor pagado ($)\", 0, 10_000_000, int(d.valor), 10000, key=f\"{k}_va\")\n            col1, col2 = st.columns(2)\n            exp = col1.date_input(\"Fecha de expedición\", d.expedicion, key=f\"{k}_ex\")\n            ven = col2.date_input(\"Fecha de vencimiento\", d.vencimiento, key=f\"{k}_ve\")\n            if st.form_submit_button(\"💾 Guardar cambios\", type=\"primary\", width=\"stretch\"):\n                def guardar_doc(doc):\n                    db.actualizar_documento(correo, doc)\n                    actualizar_consolidados(s, correo, s.dias_trabajados(incluir_abierta=False))\n\n                accion(s, correo, lambda: s.editar_documento(d, tipo, entidad, valor, exp, ven), guardar_doc,\n                       f\"{tipo} actualizado. Provisión diaria: {cop(valor / 365, 2)}.\")\n        st.caption(\"Eliminar borra el documento y su provisión diaria. Queda registrado en Trazabilidad.\")\n        confirmar = st.checkbox(f\"Sí, quiero eliminar este {d.tipo}\", key=f\"{k}_conf\")\n        if st.button(\"🗑️ Eliminar documento\", disabled=not confirmar, width=\"stretch\", key=f\"{k}_del\"):\n            s.eliminar_documento(d)\n            db.eliminar_documento(correo, d)\n            actualizar_consolidados(s, correo, s.dias_trabajados(incluir_abierta=False))\n            db.guardar_traza(correo, s)\n            st.session_state.pop(\"doc_sel\", None)\n            aviso(f\"{d.tipo} eliminado.\")\n            st.rerun()\n\n\n# =====================================================================\n# COMBUSTIBLE\n# =====================================================================\ndef combustible_turno(s, abierta, lugar):\n    \"\"\"Gasto aproximado del turno abierto: el conductor escribe lo que marca el odómetro ahora.\"\"\"\n    clave = f\"odo_ahora_{abierta.id}\"\n    if clave not in st.session_state:\n        st.session_state[clave] = float(abierta.odometro_inicial)\n    odo = st.number_input(\"¿Qué marca el odómetro ahora? (km)\", float(abierta.odometro_inicial), 2_000_000.0,\n                          step=1.0, key=clave)\n    km = odo - abierta.odometro_inicial\n    with s.sin_traza():\n        e = s.estimar_combustible(km, ahora().date())\n    c1, c2, c3 = st.columns(3)\n    c1.metric(\"Km andados\", f\"{km:,.0f}\")\n    c2.metric(\"Galones\", f\"{e['galones']:.2f}\")\n    c3.metric(\"Gasto aproximado\", cop(e[\"costo\"]))\n    st.caption(f\"{km:,.0f} km ÷ {e['rendimiento']:.1f} km/galón × {cop(e['precio_galon'])} el galón \"\n               f\"({cop(e['costo_km'])} por km).\")\n    return e\n\n\nFUENTES_RENDIMIENTO = {\"declarado\": \"Declarado del vehículo\", \"real\": \"Real de mis tanqueos\", \"auto\": \"Automático\"}\n\n\ndef bloque_estimacion_combustible(s, correo):\n    \"\"\"Gasto de combustible aproximado a partir de los km andados: km ÷ km/galón × precio del galón.\"\"\"\n    p = s.perfil\n    hoy = ahora().date()\n    st.subheader(\"Gasto estimado según los km andados\")\n    elegido = st.radio(\"Km por galón para calcular\", list(FUENTES_RENDIMIENTO), horizontal=True,\n                       index=list(FUENTES_RENDIMIENTO).index(s.cfg.rendimiento_fuente),\n                       format_func=FUENTES_RENDIMIENTO.get, key=f\"fuente_rend_{s.cfg.rendimiento_fuente}\",\n                       help=\"Declarado: el de Mi perfil → Vehículo. Real: el que sale de tus tanqueos (tanquea \"\n                            \"siempre hasta llenar). Automático: el real cuando ya hay datos, si no el declarado.\")\n    if elegido != s.cfg.rendimiento_fuente:\n        s.cfg.rendimiento_fuente = elegido\n        db.guardar_configuracion(correo, s.cfg)\n        s.traza.evento(\"Configuración\", f\"Km por galón para estimar combustible: {FUENTES_RENDIMIENTO[elegido]}\", correo)\n        actualizar_consolidados(s, correo, s.dias_trabajados(incluir_abierta=False))\n        db.guardar_traza(correo, s)\n        aviso(\"Listo: los gastos de combustible se recalcularon con el nuevo rendimiento.\")\n        st.rerun()\n\n    with s.sin_traza():\n        base = s.estimar_combustible(1, hoy)\n    real = s._rendimiento_real_valor()\n    if real and base[\"fuente\"] != \"real de tus tanqueos\":\n        st.caption(f\"Con tus tanqueos, el rendimiento real da {real:.1f} km por galón.\")\n    if elegido == \"real\" and base[\"fuente\"] != \"real de tus tanqueos\":\n        st.warning(\"Aún no hay dos tanqueos a tanque lleno para calcular el rendimiento real; \"\n                   \"mientras tanto se usa el declarado.\")\n    st.caption(f\"Tu vehículo rinde **{base['rendimiento']:.1f} km por galón** ({base['fuente']}) y el galón está a \"\n               f\"**{cop(base['precio_galon'])}**: cada kilómetro te cuesta **{cop(base['costo_km'])}** de combustible.\")\n\n    abierta = next((j for j in p.jornadas if not j.cerrada), None)\n    if abierta:\n        st.write(\"**Turno en curso**\")\n        combustible_turno(s, abierta, \"comb\")\n\n    st.write(\"**Por periodo** (turnos cerrados)\")\n    with s.sin_traza():\n        filas = []\n        dias = s.dias_trabajados(incluir_abierta=False)\n        if hoy in dias:\n            r = s.calcular_dia(hoy)\n            filas.append((\"Hoy\", r[\"km_totales\"], r[\"galones\"], r[\"gasolina\"], r[\"tanqueado\"]))\n        for tipo, nombre in ((\"semana\", \"Esta semana\"), (\"mes\", \"Este mes\")):\n            r = s.resumen_periodo(tipo, hoy)\n            filas.append((nombre, r[\"km_totales\"], r[\"galones\"], r[\"gasolina\"], r[\"tanqueado\"]))\n    st.dataframe(pd.DataFrame([{\"Periodo\": n, \"Gasto estimado\": cop(c), \"Km andados\": f\"{km:,.0f}\",\n                                \"Galones\": f\"{g:.2f}\", \"Tanqueado\": cop(t)} for n, km, g, c, t in filas]),\n                 hide_index=True, width=\"stretch\")\n    st.caption(\"Gasto estimado = km andados ÷ km por galón × precio del galón. «Tanqueado» es lo que pagaste \"\n               \"en la bomba en ese periodo; no tiene que coincidir día a día porque un tanqueo dura varios días.\")\n\n    with st.expander(\"🧮 ¿Cuánto gasto en un recorrido?\"):\n        km_calc = st.number_input(\"Kilómetros\", 0.0, 10_000.0, 100.0, 10.0, key=\"km_calculadora\")\n        e = s.estimar_combustible(km_calc, hoy)\n        st.write(f\"{km_calc:,.0f} km ≈ **{e['galones']:.2f} galones** ≈ **{cop(e['costo'])}** de combustible.\")\n\n\ndef pantalla_combustible(s, correo):\n    p = s.perfil\n    diseno.encabezado(\"combustible\", \"Combustible\",\n                      \"Cuánto te cuesta la gasolina según los kilómetros que andas, y tus tanqueos.\")\n    if not p.tanqueos:\n        st.info(\"💡 Registra tu primer tanqueo abajo: con el precio del galón la app calcula cuánto gastas \"\n                \"en combustible por cada kilómetro.\")\n    else:\n        bloque_estimacion_combustible(s, correo)\n        st.divider()\n\n    st.subheader(\"Registrar tanqueo\")\n    with st.form(\"tanqueo\", clear_on_submit=True):\n        col1, col2 = st.columns(2)\n        fecha = col1.date_input(\"Fecha\", ahora().date())\n        precio = col2.number_input(\"Precio por galón ($)\", 0, 100_000, 16000, 100)\n        galones = col1.number_input(\"Galones\", 0.0, 100.0, 0.0, 0.1)\n        odo = col2.number_input(\"Odómetro (km)\", 0.0, 2_000_000.0, float(p.vehiculo.odometro_km), 1.0)\n        st.caption(\"Para calcular el rendimiento real, tanquea siempre hasta llenar.\")\n        if st.form_submit_button(\"Guardar tanqueo\", type=\"primary\", width=\"stretch\"):\n            if precio <= 0 or galones <= 0:\n                error(\"Ingresa galones y precio.\")\n            else:\n                def guardar_t(t):\n                    db.guardar_tanqueo(correo, t)\n                    db.guardar_vehiculo(correo, p.vehiculo)\n                    actualizar_consolidados(s, correo, [t.fecha])\n\n                accion(s, correo, lambda: s.registrar_tanqueo(fecha, galones, precio, odo),\n                       guardar_t, f\"Tanqueo guardado: {cop(galones * precio)}\", \"caja\")\n    if p.tanqueos:\n        c1, c2, c3 = st.columns(3)\n        precio_v = s.precio_galon_vigente()\n        c1.metric(\"Precio vigente\", cop(precio_v))\n        with s.sin_traza():\n            c2.metric(\"Costo por km\", cop(s.estimar_combustible(1)[\"costo_km\"]))\n        real = s.rendimiento_real()\n        c3.metric(\"Rendimiento real\", f\"{real:.1f} km/gal\" if real else \"—\",\n                  f\"{real - p.vehiculo.rendimiento_km_galon:+.1f} vs. declarado\" if real else None)\n        st.subheader(\"Tanqueos\")\n        st.dataframe(pd.DataFrame([{\"Fecha\": t.fecha.strftime(\"%d/%m/%Y\"), \"Galones\": t.galones,\n                                    \"Precio galón\": cop(t.precio_galon), \"Total\": cop(t.total),\n                                    \"Odómetro\": f\"{t.odometro_km:,.0f}\"} for t in reversed(p.tanqueos)]),\n                     hide_index=True, width=\"stretch\")\n        dias = s.dias_trabajados(incluir_abierta=False)\n        if dias:\n            st.subheader(\"Consumo por día trabajado\")\n            st.caption(\"Suma todos los turnos del día (00:00 a 24:00).\")\n            with s.sin_traza():\n                filas = [s.calcular_dia(d) for d in reversed(dias[-31:])]\n            st.dataframe(pd.DataFrame([{\n                \"Día\": f\"{r['fecha']:%d/%m/%Y}\", \"Gasto estimado\": cop(r[\"gasolina\"]),\n                \"Km andados\": f\"{r['km_totales']:,.1f}\", \"Km/galón\": f\"{r['rendimiento']:.1f}\",\n                \"Galones\": f\"{r['galones']:.2f}\", \"Turnos\": r[\"turnos\"], \"Tanqueado ese día\": cop(r[\"tanqueado\"])} for r in filas]),\n                hide_index=True, width=\"stretch\")\n\n\n# =====================================================================\n# GASTOS EXTRA\n# =====================================================================\ndef pantalla_gastos(s, correo):\n    p = s.perfil\n    diseno.encabezado(\"gastos\", \"Gastos extra\", \"Peajes, parqueaderos, lavadas y todo lo que sale del bolsillo.\")\n    with st.form(\"gasto\", clear_on_submit=True):\n        col1, col2 = st.columns(2)\n        fecha = col1.date_input(\"Fecha\", ahora().date())\n        concepto = col2.selectbox(\"Concepto\", [\"Peaje\", \"Parqueadero\", \"Lavado\", \"Plan de datos\",\n                                                \"Reparación imprevista\", \"Multa\", \"Comida en turno\", \"Otro\"])\n        detalle = st.text_input(\"Detalle (opcional)\")\n        valor = st.number_input(\"Valor ($)\", 0, 50_000_000, 0, 1000)\n        if st.form_submit_button(\"Guardar gasto\", type=\"primary\", width=\"stretch\"):\n            if valor <= 0:\n                error(\"Ingresa el valor.\")\n            else:\n                texto = f\"{concepto} — {detalle}\" if detalle else concepto\n                def guardar_g(g):\n                    db.guardar_gasto(correo, g)\n                    actualizar_consolidados(s, correo, [g.fecha])\n\n                accion(s, correo, lambda: s.registrar_gasto(fecha, texto, valor),\n                       guardar_g, \"Gasto guardado.\", \"caja\")\n    if p.gastos:\n        df = pd.DataFrame([{\"Fecha\": g.fecha, \"Concepto\": g.concepto, \"Valor\": g.valor} for g in p.gastos])\n        st.metric(\"Total registrado\", cop(df[\"Valor\"].sum()))\n        por_dia = df.groupby(\"Fecha\").agg(Gastos=(\"Valor\", \"count\"), Total=(\"Valor\", \"sum\")).reset_index()\n        st.subheader(\"Gastos por día\")\n        st.caption(\"Estos totales se descuentan en el análisis del día en el Tablero.\")\n        st.dataframe(por_dia.sort_values(\"Fecha\", ascending=False).assign(\n            Fecha=por_dia[\"Fecha\"].map(lambda d: f\"{d:%d/%m/%Y}\"), Total=por_dia[\"Total\"].map(cop)),\n            hide_index=True, width=\"stretch\")\n        st.subheader(\"Detalle\")\n        st.dataframe(df.sort_values(\"Fecha\", ascending=False).assign(Valor=df[\"Valor\"].map(cop)),\n                     hide_index=True, width=\"stretch\")\n\n\n# =====================================================================\n# REPORTES\n# =====================================================================\ndef pantalla_reportes(s, correo):\n    diseno.encabezado(\"reportes\", \"Reportes\", \"Resultados de un rango de fechas, día por día.\")\n    hoy = ahora().date()\n    col1, col2 = st.columns(2)\n    desde = col1.date_input(\"Desde\", hoy.replace(day=1))\n    hasta = col2.date_input(\"Hasta\", hoy)\n    try:\n        with s.sin_traza():\n            detalle, r = s.reporte_rango(desde, hasta)\n    except ErrorValidacion as e:\n        st.warning(str(e))\n        return\n    if detalle.empty:\n        st.info(\"No hay días con jornadas cerradas en ese rango.\")\n        return\n    st.caption(\"Cada día suma todos sus turnos cerrados, de 00:00 a 24:00.\")\n\n    clase = r[\"clasificacion_periodo\"]\n    clase_h = r[\"clasificacion_hora_periodo\"]\n    st.markdown(f\"### Ingreso por km del periodo: :{COLOR_CLASE[clase]}[{cop(r['ingreso_km_periodo'])} — {SEMAFORO[clase]} {clase}]\")\n    st.markdown(f\"### Ingreso por hora del periodo: :{COLOR_CLASE[clase_h]}[{cop(r['ingreso_hora_periodo'])} — \"\n                f\"{SEMAFORO[clase_h]} {clase_h}] · {r['viajes_hora_periodo']:.1f} viajes por hora\")\n    c1, c2, c3 = st.columns(3)\n    c1.metric(\"Días trabajados\", r[\"dias_trabajados\"])\n    c2.metric(\"Viajes\", r[\"total_viajes\"])\n    c3.metric(\"Promedio viajes/día\", f\"{r['promedio_viajes_dia']:.1f}\")\n    c1, c2, c3 = st.columns(3)\n    c1.metric(\"Ingreso bruto\", cop(r[\"ingreso_bruto\"]))\n    c2.metric(\"Utilidad neta\", cop(r[\"utilidad_neta\"]))\n    c3.metric(\"Ahorro\", cop(r[\"ahorro\"]))\n    c1, c2, c3 = st.columns(3)\n    c1.metric(\"Km totales\", f\"{r['km_totales']:,.0f}\")\n    c2.metric(\"Gasolina\", cop(r[\"gasolina\"]))\n    c3.metric(\"Provisión mantenimiento\", cop(r[\"provision_total\"]))\n\n    st.subheader(\"Ingreso por km por día\")\n    st.bar_chart(detalle.assign(fecha=detalle[\"fecha\"].astype(str)).set_index(\"fecha\")[\"ingreso_km\"])\n    st.subheader(\"Utilidad neta por día\")\n    st.line_chart(detalle.assign(fecha=detalle[\"fecha\"].astype(str)).set_index(\"fecha\")[\"utilidad_neta\"])\n    s
