t.subheader(\"Detalle por día\")\n    st.dataframe(pd.DataFrame({\n        \"Día\": detalle[\"fecha\"].map(lambda d: f\"{d:%d/%m/%Y}\"), \"Turnos\": detalle[\"turnos\"],\n        \"Horas\": detalle[\"horas\"].map(texto_horas), \"Viajes\": detalle[\"viajes\"],\n        \"Km\": detalle[\"km_totales\"].map(lambda x: f\"{x:,.1f}\"), \"Ingreso\": detalle[\"ingreso_bruto\"].map(cop),\n        \"Gasolina\": detalle[\"gasolina\"].map(cop), \"Gastos extra\": detalle[\"gastos_extra\"].map(cop),\n        \"Utilidad\": detalle[\"utilidad_neta\"].map(cop), \"$/hora\": detalle[\"ingreso_hora\"].map(cop),\n        \"$/km\": detalle[\"ingreso_km\"].map(cop)}), hide_index=True, width=\"stretch\")\n\n    viajes = s.tabla_viajes()\n    if not viajes.empty:\n        viajes = viajes[(viajes[\"inicio\"].dt.date >= desde) & (viajes[\"inicio\"].dt.date <= hasta)]\n    if not viajes.empty:\n        st.subheader(\"Por plataforma\")\n        por_plat = viajes.groupby(\"plataforma\").agg(viajes=(\"viaje_del_dia\", \"count\"), ingreso=(\"valor\", \"sum\"),\n                                                     km=(\"km_pasajero\", \"sum\")).reset_index()\n        por_plat[\"$/km con pasajero\"] = (por_plat[\"ingreso\"] / por_plat[\"km\"]).map(cop)\n        por_plat[\"ingreso\"] = por_plat[\"ingreso\"].map(cop)\n        st.dataframe(por_plat, hide_index=True, width=\"stretch\")\n\n    try:\n        import openpyxl  # noqa: F401\n        salida = io.BytesIO()\n        with pd.ExcelWriter(salida, engine=\"openpyxl\") as xl:\n            pd.DataFrame([r]).to_excel(xl, sheet_name=\"Resumen\", index=False)\n            detalle.to_excel(xl, sheet_name=\"Días\", index=False)\n            viajes.to_excel(xl, sheet_name=\"Viajes\", index=False)\n            with s.sin_traza():\n                s.alertas().to_excel(xl, sheet_name=\"Alertas\", index=False)\n            db.leer_traza(correo).to_excel(xl, sheet_name=\"Trazabilidad\", index=False)\n        st.download_button(\"⬇️ Descargar reporte en Excel\", salida.getvalue(),\n                           f\"reporte_{desde}_{hasta}.xlsx\", width=\"stretch\",\n                           mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n    except ImportError:\n        # Sin openpyxl (por ejemplo en la versión de navegador) se descarga en CSV\n        st.download_button(\"⬇️ Descargar días (CSV)\", detalle.to_csv(index=False).encode(\"utf-8-sig\"),\n                           f\"dias_{desde}_{hasta}.csv\", \"text/csv\", width=\"stretch\")\n\n\n# =====================================================================\n# SEMANAL Y MENSUAL\n# =====================================================================\ndef etiqueta_periodo(tipo, clave, desde, hasta):\n    if tipo == \"semana\":\n        return f\"Semana {int(clave[-2:])} · {desde:%d/%m} al {hasta:%d/%m/%Y}\"\n    return f\"{MESES[desde.month - 1]} {desde.year}\"\n\n\ndef vista_periodo(s, correo, tipo):\n    nombre = \"semana\" if tipo == \"semana\" else \"mes\"\n    periodos = s.periodos_con_actividad(tipo)\n    if not periodos:\n        st.info(\"Aún no hay días cerrados, gastos ni tanqueos para consolidar.\")\n        return\n    opciones = {etiqueta_periodo(tipo, *x): x for x in reversed(periodos)}\n    elegida = st.selectbox(\"Semana\" if tipo == \"semana\" else \"Mes\", list(opciones), key=f\"cons_{tipo}\")\n    clave, desde, hasta = opciones[elegida]\n    try:\n        with s.sin_traza():\n            r = s.resumen_periodo(tipo, desde)\n            a = s.resumen_periodo(tipo, desde - timedelta(days=1))\n    except ErrorValidacion as e:\n        st.warning(str(e))\n        return\n    hay_anterior = bool(a[\"dias_trabajados\"] or a[\"gastos_extra\"])\n    dif = (lambda k, f: f(r[k] - a[k])) if hay_anterior else (lambda k, f: None)\n    signo_cop = lambda x: (\"+\" if x >= 0 else \"\") + cop(x)\n\n    comparacion = (f\" · {signo_cop(r['utilidad_neta'] - a['utilidad_neta'])} frente \"\n                   + (\"a la semana anterior\" if tipo == \"semana\" else \"al mes anterior\")) if hay_anterior else \"\"\n    diseno.taximetro(\"Utilidad neta \" + (\"de la semana\" if tipo == \"semana\" else \"del mes\"), cop(r[\"utilidad_neta\"]),\n                     r[\"utilidad_neta\"] < 0,\n                     f\"Rentabilidad {r['rentabilidad']:.1f} % · {r['dias_trabajados']} días trabajados{comparacion}\",\n                     [(cop(r[\"ingreso_km\"]), \"Ingreso por km\", r[\"clasificacion_km\"]),\n                      (cop(r[\"ingreso_hora\"]), \"Ingreso por hora\", r[\"clasificacion_hora\"])])\n    c1, c2, c3 = st.columns(3)\n    c1.metric(\"Ingreso total\", cop(r[\"ingreso_total\"]), dif(\"ingreso_total\", signo_cop))\n    c2.metric(\"Rentabilidad\", f\"{r['rentabilidad']:.1f} %\", dif(\"rentabilidad\", lambda x: f\"{x:+.1f} puntos\"))\n    c3.metric(\"Utilidad por hora\", cop(r[\"utilidad_hora\"]), dif(\"utilidad_hora\", signo_cop))\n    st.caption((\"Comparado con \" + (\"la semana anterior\" if tipo == \"semana\" else \"el mes anterior\") + \". \")\n               if hay_anterior else \"No hay datos del periodo anterior para comparar. \")\n    c1, c2, c3, c4 = st.columns(4)\n    c1.metric(\"Días trabajados\", r[\"dias_trabajados\"], dif(\"dias_trabajados\", lambda x: f\"{x:+d}\"))\n    c2.metric(\"Horas\", texto_horas(r[\"horas\"]))\n    c3.metric(\"Viajes\", r[\"viajes\"], dif(\"viajes\", lambda x: f\"{x:+d}\"))\n    c4.metric(\"Km\", f\"{r['km_totales']:,.0f}\")\n\n    st.subheader(\"Ingresos, costos y rentabilidad\")\n    total = r[\"ingreso_total\"] or 1\n    filas = [(\"Ingreso por viajes\", r[\"ingreso_bruto\"]), (\"Propinas\", r[\"propinas\"]),\n             (\"= Ingreso total\", r[\"ingreso_total\"]),\n             (\"Comisión plataformas\", -r[\"comision\"]), (\"Gasolina consumida\", -r[\"gasolina\"]),\n             (\"Provisión aceite\", -r[\"aceite\"]), (\"Provisión llantas\", -r[\"llantas\"]),\n             (\"Provisión mantenimiento general\", -r[\"mantenimiento\"]), (\"Provisión SOAT y técnico-mecánica\", -r[\"provision_documentos\"]),\n             (\"Gastos extra en días trabajados\", -(r[\"gastos_extra\"] - r[\"gastos_dias_no_trabajados\"])),\n             (\"Gastos extra en días sin turno\", -r[\"gastos_dias_no_trabajados\"]),\n             (\"= Costos totales\", -r[\"costos_totales\"]), (\"= Utilidad neta\", r[\"utilidad_neta\"]),\n             (\"Ahorro sugerido (acumulado de los días)\", r[\"ahorro\"])]\n    porcentaje = lambda c, v: (v if c in (\"= Utilidad neta\", \"Ahorro sugerido (acumulado de los días)\") else abs(v)) / total * 100\n    st.dataframe(pd.DataFrame([{\"Concepto\": c, \"Valor\": cop(v), \"% del ingreso\": f\"{porcentaje(c, v):.1f} %\"}\n                               for c, v in filas]), hide_index=True, width=\"stretch\")\n    costos = pd.DataFrame({\"Concepto\": [\"Comisión\", \"Gasolina\", \"Aceite\", \"Llantas\", \"Mantenimiento\", \"SOAT y RTM\", \"Gastos extra\"],\n                           \"Valor\": [r[\"comision\"], r[\"gasolina\"], r[\"aceite\"], r[\"llantas\"], r[\"mantenimiento\"],\n                                     r[\"provision_documentos\"], r[\"gastos_extra\"]]})\n    st.bar_chart(costos.set_index(\"Concepto\"), horizontal=True)\n\n    st.subheader(\"Indicadores\")\n    c1, c2, c3, c4 = st.columns(4)\n    c1.metric(\"Costo por km\", cop(r[\"costo_km\"]))\n    c2.metric(\"Utilidad por día\", cop(r[\"utilidad_dia\"]))\n    c3.metric(\"Viajes por día\", f\"{r['viajes_dia']:.1f}\")\n    c4.metric(\"Viajes por hora\", f\"{r['viajes_hora']:.2f}\")\n    st.caption(f\"Combustible: {r['galones']:.2f} galones consumidos ({cop(r['gasolina'])}); \"\n               f\"dinero tanqueado en el periodo: {cop(r['tanqueado'])}.\")\n\n    dias = [d for d in s.dias_trabajados(incluir_abierta=False) if desde <= d <= hasta]\n    if dias:\n        st.subheader(\"Días del periodo\")\n        with s.sin_traza():\n            det = [s.calcular_dia(d) for d in dias]\n        st.dataframe(pd.DataFrame([{\n            \"Día\": f\"{DIAS_SEMANA[x['fecha'].weekday()]} {x['fecha']:%d/%m}\", \"Turnos\": x[\"turnos\"], \"Horas\": texto_horas(x[\"horas\"]),\n            \"Viajes\": x[\"viajes\"], \"Km\": f\"{x['km_totales']:,.1f}\", \"Ingreso\": cop(x[\"ingreso_bruto\"]),\n            \"Costos\": cop(x[\"comision\"] + x[\"gasolina\"] + x[\"provision_total\"] + x[\"gastos_extra\"]),\n            \"Utilidad\": cop(x[\"utilidad_neta\"])} for x in det]), hide_index=True, width=\"stretch\")\n\n    st.subheader(\"Base de datos \" + (\"semanal\" if tipo == \"semana\" else \"mensual\"))\n    guardado = db.leer_consolidado(correo, tipo)\n    actual = s.tabla_periodos(tipo)\n    desactualizado = guardado.empty or set(guardado[\"periodo\"]) != set(actual[\"periodo\"]) or any(\n        abs(float(guardado.set_index(\"periodo\").loc[f.periodo, \"utilidad_neta\"]) - f.utilidad_neta) > 0.5\n        for f in actual.itertuples() if f.periodo in set(guardado[\"periodo\"]))\n    if desactualizado:\n        st.warning(\"La base de datos no tiene todos los periodos al día. Actualízala para guardarlos.\")\n    if st.button(f\"🔄 Recalcular y guardar todos los periodos ({nombre})\", key=f\"act_{tipo}\", width=\"stretch\"):\n        actualizar_consolidados(s, correo, [d for _, d, _ in s.periodos_con_actividad(tipo)])\n        db.guardar_traza(correo, s)\n        aviso(f\"Base de datos {'semanal' if tipo == 'semana' else 'mensual'} actualizada.\")\n        st.rerun()\n    if not guardado.empty:\n        st.dataframe(pd.DataFrame({\n            \"Periodo\": [etiqueta_periodo(tipo, f.periodo, date.fromisoformat(f.desde), date.fromisoformat(f.hasta))\n                        for f in guardado.itertuples()],\n            \"Días\": guardado[\"dias_trabajados\"], \"Horas\": guardado[\"horas\"].map(texto_horas),\n            \"Viajes\": guardado[\"viajes\"], \"Km\": guardado[\"km_totales\"].map(lambda x: f\"{x:,.0f}\"),\n            \"Ingreso\": guardado[\"ingreso_total\"].map(cop), \"Costos\": guardado[\"costos_totales\"].map(cop),\n            \"Utilidad\": guardado[\"utilidad_neta\"].map(cop), \"Rentabilidad\": guardado[\"rentabilidad\"].map(lambda x: f\"{x:.1f} %\"),\n            \"Actualizado\": guardado[\"actualizado\"].str.replace(\"T\", \" \")}), hide_index=True, width=\"stretch\")\n        if len(guardado) > 1:\n            st.bar_chart(pd.DataFrame({\"Periodo\": guardado[\"periodo\"], \"Utilidad neta\": guardado[\"utilidad_neta\"]}),\n                         x=\"Periodo\", y=\"Utilidad neta\")\n        st.download_button(f\"⬇️ Descargar base de datos {'semanal' if tipo == 'semana' else 'mensual'} (CSV)\",\n                           guardado.to_csv(index=False).encode(\"utf-8-sig\"),\n                           f\"consolidado_{'semanal' if tipo == 'semana' else 'mensual'}.csv\", \"text/csv\",\n                           width=\"stretch\", key=f\"desc_{tipo}\")\n\n\ndef pantalla_consolidado(s, correo):\n    diseno.encabezado(\"semanal\", \"Semanal y mensual\",\n                      \"Todo junto por semana (lunes a domingo) y por mes: ingresos, costos, gastos y rentabilidad. \"\n                      \"Se guarda en la base de datos cada vez que cierras una jornada o registras un gasto o un tanqueo.\")\n    t1, t2 = st.tabs([\"Semanal\", \"Mensual\"])\n    with t1:\n        vista_periodo(s, correo, \"semana\")\n    with t2:\n        vista_periodo(s, correo, \"mes\")\n\n\n# =====================================================================\n# TRAZABILIDAD\n# =====================================================================\ndef pantalla_trazabilidad(s, correo):\n    diseno.encabezado(\"trazabilidad\", \"Trazabilidad\",\n                      \"Cada registro y cada cálculo, con su fórmula, sus datos de entrada y su resultado.\")\n    df = db.leer_traza(correo)\n    if df.empty:\n        st.info(\"Aún no hay registros.\")\n        return\n    col1, col2 = st.columns(2)\n    modulos = col1.multiselect(\"Módulo\", sorted(df[\"modulo\"].unique()))\n    buscar = col2.text_input(\"Buscar texto\")\n    dias = s.dias_trabajados()\n    opciones_dia = [\"Todos\"] + [f\"{d:%d/%m/%Y}\" for d in reversed(dias)]\n    dia_txt = st.selectbox(\"Día trabajado\", opciones_dia,\n                           help=\"Muestra lo registrado ese día y los cálculos del análisis de ese día.\")\n    if dia_txt != \"Todos\":\n        d = datetime.strptime(dia_txt, \"%d/%m/%Y\").date()\n        iso = d.isoformat()\n        df = df[df[\"fecha_hora\"].str.startswith(iso) | df[\"modulo\"].str.contains(iso, regex=False)\n                | df[\"operacion\"].str.contains(iso, regex=False)]\n    if modulos:\n        df = df[df[\"modulo\"].isin(modulos)]\n    if buscar:\n        df = df[df.apply(lambda f: buscar.lower() in \" \".join(map(str, f.values)).lower(), axis=1)]\n    st.caption(f\"{len(df)} registros\")\n    st.dataframe(df, hide_index=True, width=\"stretch\")\n    st.download_button(\"⬇️ Descargar CSV\", df.to_csv(index=False).encode(\"utf-8-sig\"),\n                       \"trazabilidad.csv\", \"text/csv\", width=\"stretch\")\n\n\n# =====================================================================\n# MENÚ DE INICIO: un botón por autor\n# =====================================================================\nDESCRIPCION_PAGINA = {\n    \"📊 Tablero\": \"Lo que te dejó cada día\",\n    \"🚕 Jornada de hoy\": \"Turnos, viajes y pausas\",\n    \"👛 Billetera\": \"Efectivo, app, Nequi, Daviplata\",\n    \"⏱️ Viajes por hora\": \"Tus mejores horas\",\n    \"🔧 Mantenimiento y documentos\": \"Aceite, llantas, SOAT\",\n    \"⛽ Combustible\": \"Gasto según los km\",\n    \"💸 Gastos\": \"Peajes, parqueos y más\",\n    \"📈 Reportes\": \"Promedios y totales\",\n    \"📆 Semanal y mensual\": \"Rentabilidad por periodo\",\n    \"🔎 Trazabilidad\": \"Todo lo que se registró\",\n    \"👤 Mi perfil\": \"Tus datos, vehículo y fotos\",\n}\n\n\ndef pantalla_menu(s, correo):\n    p = s.perfil\n    nombre = p.conductor.nombres.split()[0] if p.conductor and p.conductor.nombres else \"\"\n    diseno.encabezado(\"tablero\", f\"Hola{', ' + nombre if nombre else ''}\", \"Toca lo que quieres ver.\")\n    abierta = next((j for j in p.jornadas if not j.cerrada), None)\n    if abierta:\n        estado = \"⏸️ en pausa\" if abierta.pausa_abierta else \"▶️ abierto\"\n        st.info(f\"Turno {estado} desde las {abierta.inicio:%H:%M} · {len(abierta.viajes)} viaje(s) · \"\n                f\"{cop(sum(v.valor for v in abierta.viajes))}\")\n    paginas = [x for x in PAGINAS if x != MENU]\n    with st.container(key=\"menu_inicio\"):\n        for fila in range(0, len(paginas), 2):\n            for col, pag in zip(st.columns(2), paginas[fila:fila + 2]):\n                if col.button(f\"{pag}\\n\\n{DESCRIPCION_PAGINA[pag]}\", key=f\"ir_{pag}\", width=\"stretch\"):\n                    st.session_state[\"ir_a\"] = pag\n                    st.rerun()\n\n\n# =====================================================================\n# NAVEGACIÓN PRINCIPAL\n# =====================================================================\nDESLIZAR_PESTANAS = \"\"\"<script>(function(){\nif (window.__deslizarPestanas) return; window.__deslizarPestanas = true;\nvar x0 = null, y0 = null, objetivo = null;\nvar EXCLUIR = '[role=\"slider\"], [data-testid=\"stDataFrame\"], [data-testid=\"stTable\"], canvas, .stSlider, [data-baseweb=\"slider\"]';\ndocument.addEventListener('touchstart', function(e){\n  if (e.touches.length !== 1) { x0 = null; return; }\n  objetivo = e.target; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;\n}, {passive: true});\ndocument.addEventListener('touchend', function(e){\n  if (x0 === null || !objetivo) return;\n  var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;\n  if (Math.abs(dx) < 70 || Math.abs(dx) < 1.8 * Math.abs(dy)) return;\n  if (objetivo.closest && objetivo.closest(EXCLUIR)) return;\n  var cont = objetivo.closest && objetivo.closest('[data-testid=\"stTabs\"]');\n  if (!cont) return;\n  var pestanas = Array.prototype.slice.call(cont.querySelectorAll('[role=\"tab\"]'))\n    .filter(function(t){ return t.closest('[data-testid=\"stTabs\"]') === cont; });\n  var actual = pestanas.findIndex(function(t){ return t.getAttribute('aria-selected') === 'true'; });\n  var siguiente = actual + (dx < 0 ? 1 : -1);\n  if (actual < 0 || siguiente < 0 || siguiente >= pestanas.length) return;\n  pestanas[siguiente].click();\n  pestanas[siguiente].scrollIntoView({block: 'nearest', inline: 'center', behavior: 'smooth'});\n}, {passive: true});\n})();<\/script>\"\"\"\n\n\ndef main():\n    if not st.session_state.get(\"correo\") and not st.session_state.get(\"_auto_revisado\"):\n        st.session_state[\"_auto_revisado\"] = True\n        recordado = db.sesion_recordada()\n        if recordado:\n            st.session_state[\"correo\"] = recordado\n    correo = st.session_state.get(\"correo\")\n    s = db.cargar_sistema(correo) if correo else None\n    preferencia = s.cfg.modo if s else \"auto\"\n    modo = diseno.modo_efectivo(preferencia, ahora())\n    st.session_state[\"_modo_efectivo\"] = modo\n    cambio_de_tema = diseno.aplicar_tema(modo)\n    diseno.aplicar(modo)\n    st.html(DESLIZAR_PESTANAS, unsafe_allow_javascript=True)  # deslizar el dedo cambia de pestaña\n    # Primero se atiende lo que el conductor acaba de tocar; después, si el modo cambió (por ejemplo a las 18:00),\n    # se vuelve a dibujar para que el navegador reciba los colores nuevos. Así no se pierde ningún clic.\n    cuerpo(correo, s, modo)\n    if cambio_de_tema:\n        st.rerun()\n\n\ndef cuerpo(correo, s, modo):\n    if not correo:\n        if \"aviso\" in st.session_state:\n            st.success(st.session_state.pop(\"aviso\"))\n        reproducir(st.session_state.pop(\"sonido\", None))\n        pantalla_acceso()\n        return\n\n    p = s.perfil\n\n    with st.sidebar:\n        diseno.marca_lateral()\n        opciones = list(diseno.MODOS)\n        elegido = st.radio(\"Pantalla\", opciones, index=opciones.index(s.cfg.modo), horizontal=True,\n                           format_func=lambda m: diseno.MODOS[m], key=f\"modo_pantalla_{s.cfg.modo}\",\n                           help=\"Auto: modo día de 6:00 a 18:00 y modo noche el resto del tiempo.\")\n        if elegido != s.cfg.modo:\n            s.cfg.modo = elegido\n            db.guardar_configuracion(correo, s.cfg)\n            s.traza.evento(\"Configuración\", f\"Modo de pantalla: {diseno.MODOS[elegido]}\", correo)\n            db.guardar_traza(correo, s)\n            st.rerun()\n        if s.cfg.modo == \"auto\":\n            st.caption(\"Ahora: ☀️ modo día\" if modo == \"dia\" else \"Ahora: 🌙 modo noche\")\n        foto = db.leer_foto(correo, \"conductor\")\n        if foto:\n            st.image(foto, width=96)\n        st.write(f\"**{p.conductor.nombres if p.conductor else correo}**\")\n        if p.vehiculo:\n            st.caption(f\"{p.vehiculo.marca} {p.vehiculo.referencia} · {p.vehiculo.placa} · \"\n                       f\"{p.vehiculo.odometro_km:,.0f} km\")\n        if \"ir_a\" in st.session_state:\n            st.session_state[\"pagina\"] = st.session_state.pop(\"ir_a\")\n        pagina = st.radio(\"Menú\", PAGINAS, key=\"pagina\", label_visibility=\"collapsed\")\n        st.divider()\n        st.toggle(\"Sonidos\", value=True, key=\"sonidos_activos\",\n                  help=\"Suena al guardar un viaje (según su semáforo), abrir o cerrar la jornada, \"\n                       \"registrar un gasto o un tanqueo, y cuando hay un error.\")\n        if st.button(\"Cerrar sesión\", width=\"stretch\"):\n            s.cerrar_sesion()\n            db.olvidar_sesion()\n            db.guardar_traza(correo, s)\n            st.session_state.clear()\n            st.session_state[\"_auto_revisado\"] = True\n            st.rerun()\n\n    if \"aviso\" in st.session_state:\n        st.success(st.session_state.pop(\"aviso\"))\n    reproducir(st.session_state.pop(\"sonido\", None))\n\n    if not (p.conductor and p.vehiculo):\n        st.warning(\"Para empezar, completa los datos del **conductor** y del **vehículo**.\")\n        pantalla_perfil(s, correo)\n        return\n\n    if pagina != MENU:\n        if st.button(\"⬅️ Volver al menú\", key=\"volver_menu\"):\n            st.session_state[\"ir_a\"] = MENU\n            st.rerun()\n\n    with s.sin_traza():\n        pendientes = s.alertas()\n    pendientes = pendientes[~pendientes[\"estado\"].str.contains(\"OK\")] if not pendientes.empty else pendientes\n    for _, a in pendientes.iterrows():\n        st.warning(f\"{a['estado']} — {a['item']}\")\n\n    {\n        MENU: pantalla_menu, \"📊 Tablero\": pantalla_tablero, \"🚕 Jornada de hoy\": pantalla_jornada, \"👛 Billetera\": pantalla_billetera,\n        \"⏱️ Viajes por hora\": pantalla_por_hora, \"🔧 Mantenimiento y documentos\": pantalla_mantenimiento,\n        \"⛽ Combustible\": pantalla_combustible, \"💸 Gastos\": pantalla_gastos, \"📈 Reportes\": pantalla_reportes,\n        \"📆 Semanal y mensual\": pantalla_consolidado, \"🔎 Trazabilidad\": pantalla_trazabilidad,\n        \"👤 Mi perfil\": pantalla_perfil,\n    }[pagina](s, correo)\n\n\nmain()\n", "db.py": "\"\"\"\nCapa de persistencia en SQLite para la app del conductor.\nGuarda y carga todos los datos de cada usuario y la bitácora de trazabilidad.\n\"\"\"\nimport json\nimport os\nimport sqlite3\nimport sys\nfrom contextlib import contextmanager\nfrom datetime import date, datetime\n\nimport pandas as pd\n\nfrom control_conductor import (\n    Conductor, Configuracion, DocumentoVehiculo, GastoExtra, ItemMantenimiento,\n    Jornada, MovimientoBilletera, Perfil, SistemaConductor, Tanqueo, Usuario, Vehiculo, Viaje,\n)\n\nRUTA_DB = os.environ.get(\"CONDUCTOR_DB\", \"conductor.db\")\n\nESQUEMA = \"\"\"\nCREATE TABLE IF NOT EXISTS usuario (\n    correo TEXT PRIMARY KEY, hash_clave TEXT NOT NULL, sal TEXT NOT NULL, creado TEXT NOT NULL);\nCREATE TABLE IF NOT EXISTS conductor (\n    correo TEXT PRIMARY KEY REFERENCES usuario(correo), nombres TEXT, apellidos TEXT,\n    tipo_documento TEXT, numero_documento TEXT, celular TEXT, ciudad TEXT, plataformas TEXT);\nCREATE TABLE IF NOT EXISTS vehiculo (\n    correo TEXT PRIMARY KEY REFERENCES usuario(correo), placa TEXT, tipo TEXT, marca TEXT,\n    referencia TEXT, modelo INTEGER, cilindrada_cc INTEGER, combustible TEXT,\n    rendimiento_km_galon REAL, odometro_km REAL);\nCREATE TABLE IF NOT EXISTS configuracion (\n    correo TEXT PRIMARY KEY REFERENCES usuario(correo),\n    umbral_medio REAL, umbral_muy_bueno REAL, porcentaje_ahorro REAL);\nCREATE TABLE IF NOT EXISTS jornada (\n    id INTEGER PRIMARY KEY, correo TEXT NOT NULL REFERENCES usuario(correo),\n    inicio TEXT NOT NULL, odometro_inicial REAL NOT NULL, fin TEXT, odometro_final REAL);\nCREATE TABLE IF NOT EXISTS viaje (\n    id INTEGER PRIMARY KEY, jornada_id INTEGER NOT NULL REFERENCES jornada(id),\n    inicio TEXT, fin TEXT, plataforma TEXT, valor REAL, km_pasajero REAL, metodo_pago TEXT, propina REAL);\nCREATE TABLE IF NOT EXISTS tanqueo (\n    id INTEGER PRIMARY KEY AUTOINCREMENT, correo TEXT NOT NULL REFERENCES usuario(correo),\n    fecha TEXT, galones REAL, precio_galon REAL, odometro_km REAL);\nCREATE TABLE IF NOT EXISTS mantenimiento (\n    id INTEGER PRIMARY KEY AUTOINCREMENT, correo TEXT NOT NULL REFERENCES usuario(correo),\n    nombre TEXT, categoria TEXT, costo REAL, intervalo_km REAL, intervalo_meses INTEGER,\n    ultimo_km REAL, ultima_fecha TEXT);\nCREATE TABLE IF NOT EXISTS documento (\n    id INTEGER PRIMARY KEY AUTOINCREMENT, correo TEXT NOT NULL REFERENCES usuario(correo),\n    tipo TEXT, entidad TEXT, valor REAL, expedicion TEXT, vencimiento TEXT);\nCREATE TABLE IF NOT EXISTS gasto (\n    id INTEGER PRIMARY KEY AUTOINCREMENT, correo TEXT NOT NULL REFERENCES usuario(correo),\n    fecha TEXT, concepto TEXT, valor REAL);\nCREATE TABLE IF NOT EXISTS trazabilidad (\n    id INTEGER PRIMARY KEY AUTOINCREMENT, correo TEXT, fecha_hora TEXT, modulo TEXT,\n    operacion TEXT, formula TEXT, entradas TEXT, resultado TEXT);\nCREATE INDEX IF NOT EXISTS ix_jornada_correo ON jornada(correo, inicio);\nCREATE INDEX IF NOT EXISTS ix_viaje_jornada ON viaje(jornada_id);\nCREATE INDEX IF NOT EXISTS ix_traza_correo ON trazabilidad(correo, id);\nCREATE TABLE IF NOT EXISTS consolidado (\n    correo TEXT NOT NULL REFERENCES usuario(correo), tipo TEXT NOT NULL, periodo TEXT NOT NULL,\n    desde TEXT NOT NULL, hasta TEXT NOT NULL, datos TEXT NOT NULL, actualizado TEXT NOT NULL,\n    PRIMARY KEY (correo, tipo, periodo));\nCREATE TABLE IF NOT EXISTS sesion_recordada (\n    dispositivo TEXT PRIMARY KEY, correo TEXT NOT NULL REFERENCES usuario(correo), desde TEXT NOT NULL);\nCREATE TABLE IF NOT EXISTS foto (\n    correo TEXT NOT NULL REFERENCES usuario(correo), tipo TEXT NOT NULL, mime TEXT NOT NULL,\n    datos BLOB NOT NULL, actualizado TEXT NOT NULL, PRIMARY KEY (correo, tipo));\nCREATE TABLE IF NOT EXISTS pausa (\n    id INTEGER PRIMARY KEY AUTOINCREMENT, jornada_id INTEGER NOT NULL REFERENCES jornada(id),\n    inicio TEXT NOT NULL, fin TEXT);\nCREATE TABLE IF NOT EXISTS movimiento (\n    id INTEGER PRIMARY KEY AUTOINCREMENT, correo TEXT NOT NULL REFERENCES usuario(correo),\n    fecha TEXT NOT NULL, tipo TEXT NOT NULL, cuenta TEXT NOT NULL, valor REAL NOT NULL,\n    concepto TEXT, cuenta_destino TEXT);\n\"\"\"\n\n\ndef _sincronizar_navegador():\n    \"\"\"En la versión de navegador (Pyodide) guarda la base en el almacenamiento del navegador.\"\"\"\n    if sys.platform != \"emscripten\":\n        return\n    try:\n        import pyodide_js\n        from pyodide.ffi import create_once_callable\n        pyodide_js.FS.syncfs(False, create_once_callable(lambda *_: None))\n    except Exception:\n        pass\n\n\n@contextmanager\ndef conexion():\n    carpeta = os.path.dirname(RUTA_DB)\n    if carpeta:\n        os.makedirs(carpeta, exist_ok=True)\n    con = sqlite3.connect(RUTA_DB)\n    con.row_factory = sqlite3.Row\n    con.execute(\"PRAGMA foreign_keys = ON\")\n    try:\n        yield con\n        con.commit()\n    finally:\n        con.close()\n    _sincronizar_navegador()\n\n\ndef inicializar():\n    with conexion() as con:\n        con.executescript(ESQUEMA)\n        # Migración: columnas agregadas después de la primera versión\n        columnas = {f[\"name\"] for f in con.execute(\"PRAGMA table_info(configuracion)\")}\n        for nombre in (\"umbral_hora_medio\", \"umbral_hora_muy_bueno\"):\n            if nombre not in columnas:\n                con.execute(f\"ALTER TABLE configuracion ADD COLUMN {nombre} REAL\")\n        if \"modo\" not in columnas:\n            con.execute(\"ALTER TABLE configuracion ADD COLUMN modo TEXT\")\n        if \"rendimiento_fuente\" not in columnas:\n            con.execute(\"ALTER TABLE configuracion ADD COLUMN rendimiento_fuente TEXT\")\n        # Migración: los medios de pago ahora son las cuentas de la billetera\n        con.execute(\"UPDATE viaje SET metodo_pago = 'App' WHERE lower(metodo_pago) = 'app' AND metodo_pago <> 'App'\")\n        con.execute(\"UPDATE viaje SET metodo_pago = 'Efectivo' WHERE lower(metodo_pago) = 'efectivo' \"\n                    \"AND metodo_pago <> 'Efectivo'\")\n\n\n# ---------------- Usuarios ----------------\ndef obtener_usuario(correo: str):\n    with conexion() as con:\n        fila = con.execute(\"SELECT * FROM usuario WHERE correo = ?\", (correo,)).fetchone()\n    return Usuario(fila[\"correo\"], fila[\"hash_clave\"], fila[\"sal\"],\n                   datetime.fromisoformat(fila[\"creado\"])) if fila else None\n\n\ndef guardar_usuario(u: Usuario):\n    with conexion() as con:\n        con.execute(\"INSERT INTO usuario VALUES (?,?,?,?)\",\n                    (u.correo, u.hash_clave, u.sal, u.creado.isoformat()))\n\n\n# ---------------- Carga completa del perfil ----------------\ndef cargar_sistema(correo: str) -> SistemaConductor:\n    \"\"\"Reconstruye el sistema con todos los datos del usuario (sin generar trazas).\"\"\"\n    with conexion() as con:\n        q = lambda sql, *a: con.execute(sql, a).fetchall()\n        uno = lambda sql, *a: con.execute(sql, a).fetchone()\n\n        cfg_f = uno(\"SELECT * FROM configuracion WHERE correo = ?\", correo)\n        cfg = Configuracion()\n        if cfg_f:\n            cfg.umbral_medio, cfg.umbral_muy_bueno = cfg_f[\"umbral_medio\"], cfg_f[\"umbral_muy_bueno\"]\n            cfg.porcentaje_ahorro = cfg_f[\"porcentaje_ahorro\"]\n            if cfg_f[\"umbral_hora_medio\"] is not None:\n                cfg.umbral_hora_medio = cfg_f[\"umbral_hora_medio\"]\n            if cfg_f[\"umbral_hora_muy_bueno\"] is not None:\n                cfg.umbral_hora_muy_bueno = cfg_f[\"umbral_hora_muy_bueno\"]\n            if cfg_f[\"modo\"] in (\"auto\", \"dia\", \"noche\"):\n                cfg.modo = cfg_f[\"modo\"]\n            if cfg_f[\"rendimiento_fuente\"] in (\"auto\", \"real\", \"declarado\"):\n                cfg.rendimiento_fuente = cfg_f[\"rendimiento_fuente\"]\n        s = SistemaConductor(cfg)\n        s._usuarios[correo] = obtener_usuario(correo)\n        p = s._perfiles[correo] = Perfil()\n        s.sesion = correo\n        s._traza_guardada = 0\n\n        c = uno(\"SELECT * FROM conductor WHERE correo = ?\", correo)\n        if c:\n            p.conductor = Conductor(c[\"nombres\"], c[\"apellidos\"], c[\"tipo_documento\"], c[\"numero_documento\"],\n                                    c[\"celular\"], c[\"ciudad\"], json.loads(c[\"plataformas\"]))\n        v = uno(\"SELECT * FROM vehiculo WHERE correo = ?\", correo)\n        if v:\n            p.vehiculo = Vehiculo(v[\"placa\"], v[\"tipo\"], v[\"marca\"], v[\"referencia\"], v[\"modelo\"],\n                                  v[\"cilindrada_cc\"], v[\"combustible\"], v[\"rendimiento_km_galon\"], v[\"odometro_km\"])\n        for j in q(\"SELECT * FROM jornada WHERE correo = ? ORDER BY inicio\", correo):\n            jornada = Jornada(j[\"id\"], datetime.fromisoformat(j[\"inicio\"]), j[\"odometro_inicial\"],\n                              datetime.fromisoformat(j[\"fin\"]) if j[\"fin\"] else None, j[\"odometro_final\"])\n            for pa in q(\"SELECT * FROM pausa WHERE jornada_id = ? ORDER BY inicio\", j[\"id\"]):\n                jornada.pausas.append([datetime.fromisoformat(pa[\"inicio\"]),\n                                       datetime.fromisoformat(pa[\"fin\"]) if pa[\"fin\"] else None])\n            for x in q(\"SELECT * FROM viaje WHERE jornada_id = ? ORDER BY inicio\", j[\"id\"]):\n                jornada.viajes.append(Viaje(x[\"id\"], datetime.fromisoformat(x[\"inicio\"]),\n                                            datetime.fromisoformat(x[\"fin\"]), x[\"plataforma\"], x[\"valor\"],\n                                            x[\"km_pasajero\"], x[\"metodo_pago\"], x[\"propina\"]))\n            p.jornadas.append(jornada)\n        for t in q(\"SELECT * FROM tanqueo WHERE correo = ? ORDER BY fecha, id\", correo):\n            p.tanqueos.append(Tanqueo(date.fromisoformat(t[\"fecha\"]), t[\"galones\"], t[\"precio_galon\"], t[\"odometro_km\"]))\n        for m in q(\"SELECT * FROM mantenimiento WHERE correo = ? ORDER BY id\", correo):\n            item = ItemMantenimiento(m[\"nombre\"], m[\"categoria\"], m[\"costo\"], m[\"intervalo_km\"],\n                                     m[\"intervalo_meses\"], m[\"ultimo_km\"], date.fromisoformat(m[\"ultima_fecha\"]))\n            item._id = m[\"id\"]\n            p.mantenimientos.append(item)\n        for d in q(\"SELECT * FROM documento WHERE correo = ? ORDER BY id\", correo):\n            doc = DocumentoVehiculo(d[\"tipo\"], d[\"entidad\"], d[\"valor\"],\n                                    date.fromisoformat(d[\"expedicion\"]), date.fromisoformat(d[\"vencimiento\"]))\n            doc._id = d[\"id\"]\n            p.documentos.append(doc)\n        for g in q(\"SELECT * FROM gasto WHERE correo = ? ORDER BY fecha, id\", correo):\n            gasto = GastoExtra(date.fromisoformat(g[\"fecha\"]), g[\"concepto\"], g[\"valor\"])\n            gasto._id = g[\"id\"]\n            p.gastos.append(gasto)\n        for m in q(\"SELECT * FROM movimiento WHERE correo = ? ORDER BY fecha, id\", correo):\n            mov = MovimientoBilletera(datetime.fromisoformat(m[\"fecha\"]), m[\"tipo\"], m[\"cuenta\"], m[\"valor\"],\n                                      m[\"concepto\"] or \"\", m[\"cuenta_destino\"])\n            mov._id = m[\"id\"]\n            p.movimientos.append(mov)\n\n        # Los consecutivos siguen el máximo global para no repetir llaves entre usuarios\n        s._seq_jornada = uno(\"SELECT COALESCE(MAX(id), 0) AS m FROM jornada\")[\"m\"]\n        s._seq_viaje = uno(\"SELECT COALESCE(MAX(id), 0) AS m FROM viaje\")[\"m\"]\n    return s\n\n\n# ---------------- Guardado por entidad ----------------\ndef guardar_conductor(correo, c: Conductor):\n    with conexion() as con:\n        con.execute(\"INSERT OR REPLACE INTO conductor VALUES (?,?,?,?,?,?,?,?)\",\n                    (correo, c.nombres, c.apellidos, c.tipo_documento, c.numero_documento,\n                     c.celular, c.ciudad, json.dumps(c.plataformas)))\n\n\ndef guardar_vehiculo(correo, v: Vehiculo):\n    with conexion() as con:\n        con.execute(\"INSERT OR REPLACE INTO vehiculo VALUES (?,?,?,?,?,?,?,?,?,?)\",\n                    (correo, v.placa, v.tipo, v.marca, v.referencia, v.modelo, v.cilindrada_cc,\n                     v.combustible, v.rendimiento_km_galon, v.odometro_km))\n\n\ndef guardar_configuracion(correo, cfg: Configuracion):\n    with conexion() as con:\n        con.execute(\"\"\"INSERT OR REPLACE INTO configuracion (correo, umbral_medio, umbral_muy_bueno,\n                       porcentaje_ahorro, umbral_hora_medio, umbral_hora_muy_bueno, modo, rendimiento_fuente)\n                       VALUES (?,?,?,?,?,?,?,?)\"\"\",\n                    (correo, cfg.umbral_medio, cfg.umbral_muy_bueno, cfg.porcentaje_ahorro,\n                     cfg.umbral_hora_medio, cfg.umbral_hora_muy_bueno, cfg.modo, cfg.rendimiento_fuente))\n\n\ndef guardar_jornada(correo, j: Jornada):\n    with conexion() as con:\n        con.execute(\"INSERT OR REPLACE INTO jornada VALUES (?,?,?,?,?,?)\",\n                    (j.id, correo, j.inicio.isoformat(), j.odometro_inicial,\n                     j.fin.isoformat() if j.fin else None, j.odometro_final))\n\n\ndef guardar_pausas(j: Jornada):\n    \"\"\"Reescribe las pausas del turno (son pocas: se guardan todas cada vez).\"\"\"\n    with conexion() as con:\n        con.execute(\"DELETE FROM pausa WHERE jornada_id = ?\", (j.id,))\n        con.executemany(\"INSERT INTO pausa (jornada_id, inicio, fin) VALUES (?,?,?)\",\n                        [(j.id, a.isoformat(), b.isoformat() if b else None) for a, b in j.pausas])\n\n\ndef eliminar_jornadas(correo, jornadas):\n    with conexion() as con:\n        for j in jornadas:\n            con.execute(\"DELETE FROM viaje WHERE jornada_id = ?\", (j.id,))\n            con.execute(\"DELETE FROM pausa WHERE jornada_id = ?\", (j.id,))\n            con.execute(\"DELETE FROM jornada WHERE id = ? AND correo = ?\", (j.id, correo))\n\n\ndef eliminar_consolidados(correo):\n    with conexion() as con:\n        con.execute(\"DELETE FROM consolidado WHERE correo = ?\", (correo,))\n\n\ndef guardar_viaje(jornada_id, v: Viaje):\n    with conexion() as con:\n        con.execute(\"INSERT INTO viaje VALUES (?,?,?,?,?,?,?,?,?)\",\n                    (v.id, jornada_id, v.inicio.isoformat(), v.fin.isoformat(), v.plataforma,\n                     v.valor, v.km_pasajero, v.metodo_pago, v.propina))\n\n\ndef actualizar_viaje(v: Viaje):\n    with conexion() as con:\n        con.execute(\"\"\"UPDATE viaje SET inicio=?, fin=?, plataforma=?, valor=?, km_pasajero=?,\n                       metodo_pago=?, propina=? WHERE id=?\"\"\",\n                    (v.inicio.isoformat(), v.fin.isoformat(), v.plataforma, v.valor, v.km_pasajero,\n                     v.metodo_pago, v.propina, v.id))\n\n\ndef eliminar_viaje(viaje_id):\n    with conexion() as con:\n        con.execute(\"DELETE FROM viaje WHERE id = ?\", (viaje_id,))\n\n\ndef guardar_tanqueo(correo, t: Tanqueo):\n    with conexion() as con:\n        con.execute(\"INSERT INTO tanqueo (correo, fecha, galones, precio_galon, odometro_km) VALUES (?,?,?,?,?)\",\n                    (correo, t.fecha.isoformat(), t.galones, t.precio_galon, t.odometro_km))\n\n\ndef guardar_mantenimiento(correo, m: ItemMantenimiento):\n    datos = (m.nombre, m.categoria, m.costo, m.intervalo_km, m.intervalo_meses, m.ultimo_km, m.ultima_fecha.isoformat())\n    with conexion() as con:\n        if getattr(m, \"_id\", None):\n            con.execute(\"\"\"UPDATE mantenimiento SET nombre=?, categoria=?, costo=?, intervalo_km=?,\n                           intervalo_meses=?, ultimo_km=?, ultima_fecha=? WHERE id=? AND correo=?\"\"\",\n                        datos + (m._id, correo))\n        else:\n            cur = con.execute(\"\"\"INSERT INTO mantenimiento (correo, nombre, categoria, costo, intervalo_km,\n                                 intervalo_meses, ultimo_km, ultima_fecha) VALUES (?,?,?,?,?,?,?,?)\"\"\",\n                              (correo,) + datos)\n            m._id = cur.lastrowid\n\n\ndef guardar_documento(correo, d: DocumentoVehiculo):\n    with conexion() as con:\n        cur = con.execute(\"INSERT INTO documento (correo, tipo, entidad, valor, expedicion, vencimiento) VALUES (?,?,?,?,?,?)\",\n                          (correo, d.tipo, d.entidad, d.valor, d.expedicion.isoformat(), d.vencimiento.isoformat()))\n        d._id = cur.lastrowid\n\n\ndef actualizar_documento(correo, d: DocumentoVehiculo):\n    with conexion() as con:\n        con.execute(\"UPDATE documento SET tipo=?, entidad=?, valor=?, expedicion=?, vencimiento=? WHERE id=? AND correo=?\",\n                    (d.tipo, d.entidad, d.valor, d.expedicion.isoformat(), d.vencimiento.isoformat(), d._id, correo))\n\n\ndef eliminar_documento(correo, d: DocumentoVehiculo):\n    with conexion() as con:\n        con.execute(\"DELETE FROM documento WHERE id = ? AND correo = ?\", (d._id, correo))\n\n\ndef guardar_gasto(correo, g: GastoExtra):\n    with conexion() as con:\n        cur = con.execute(\"INSERT INTO gasto (correo, fecha, concepto, valor) VALUES (?,?,?,?)\",\n                          (correo, g.fecha.isoformat(), g.concepto, g.valor))\n        g._id = cur.lastrowid\n\n\n# ---------------- Billetera ----------------\ndef guardar_movimiento(correo, m: MovimientoBilletera):\n    with conexion() as con:\n        cur = con.execute(\"\"\"INSERT INTO movimiento (correo, fecha, tipo, cuenta, valor, concepto, cuenta_destino)\n                             VALUES (?,?,?,?,?,?,?)\"\"\",\n                          (correo, m.fecha.isoformat(), m.tipo, m.cuenta, m.valor, m.concepto, m.cuenta_destino))\n        m._id = cur.lastrowid\n\n\ndef eliminar_movimiento(correo, m: MovimientoBilletera):\n    with conexion() as con:\n        con.execute(\"DELETE FROM movimiento WHERE id = ? AND correo = ?\", (m._id, correo))\n\n\n# ---------------- Sesión recordada en este celular ----------------\n# La base vive solo en este teléfono, así que recordar la sesión aquí equivale a \"mantener la sesión iniciada\".\ndef recordar_sesion(correo: str):\n    with conexion() as con:\n        con.execute(\"INSERT OR REPLACE INTO sesion_recordada VALUES ('este', ?, ?)\",\n                    (correo, datetime.now().isoformat(timespec=\"seconds\")))\n\n\ndef sesion_recordada():\n    with conexion() as con:\n        fila = con.execute(\"SELECT s.correo FROM sesion_recordada s JOIN usuario u ON u.correo = s.correo \"\n                           \"WHERE s.dispositivo = 'este'\").fetchone()\n    return fila[\"correo\"] if fila else None\n\n\ndef olvidar_sesion():\n    with conexion() as con:\n        con.execute(\"DELETE FROM sesion_recordada WHERE dispositivo = 'este'\")\n\n\n# ---------------- Fotos del conductor y del vehículo ----------------\ndef guardar_foto(correo: str, tipo: str, datos: bytes, mime: str = \"image/jpeg\"):\n    with conexion() as con:\n        con.execute(\"INSERT OR REPLACE INTO foto VALUES (?,?,?,?,?)\",\n                    (correo, tipo, mime, datos, datetime.now().isoformat(timespec=\"seconds\")))\n\n\ndef leer_foto(correo: str, tipo: str):\n    with conexion() as con:\n        fila = con.execute(\"SELECT datos FROM foto WHERE correo = ? AND tipo = ?\", (correo, tipo)).fetchone()\n    return bytes(fila[\"datos\"]) if fila else None\n\n\ndef eliminar_foto(correo: str, tipo: str):\n    with conexion() as con:\n        con.execute(\"DELETE FROM foto WHERE correo = ? AND tipo = ?\", (correo, tipo))\n\n\n# ---------------- Trazabilidad ----------------\ndef guardar_traza(correo: str, s: SistemaConductor):\n    \"\"\"Guarda en la base los registros de trazabilidad nuevos generados en esta acción.\"\"\"\n    inicio = getattr(s, \"_traza_guardada\", 0)\n    nuevos = s.traza._registros[inicio:]\n    if not nuevos:\n        return\n    with conexion() as con:\n        con.executemany(\n            \"INSERT INTO trazabilidad (correo, fecha_hora, modulo, operacion, formula, entradas, resultado) VALUES (?,?,?,?,?,?,?)\",\n            [(correo, r[\"fecha_hora\"], r[\"modulo\"], r[\"operacion\"], r[\"formula\"], r[\"entradas\"], str(r[\"resultado\"]))\n             for r in nuevos])\n    s._traza_guardada = len(s.traza._registros)\n\n\ndef leer_traza(correo: str) -> pd.DataFrame:\n    with conexion() as con:\n        return pd.read_sql_query(\n            \"SELECT id, fecha_hora, modulo, operacion, formula, entradas, resultado FROM trazabilidad \"\n            \"WHERE correo = ? ORDER BY id DESC\", con, params=(correo,))\n\n\n# ---------------- Consolidado semanal y mensual ----------------\ndef guardar_consolidado(correo: str, r: dict, actualizado: datetime):\n    \"\"\"Guarda (o actualiza) el consolidado de una semana o un mes.\"\"\"\n    datos = {k: (v.isoformat() if isinstance(v, (date, datetime)) else v) for k, v in r.items()}\n    with conexion() as con:\n        con.execute(\"INSERT OR REPLACE INTO consolidado VALUES (?,?,?,?,?,?,?)\",\n                    (correo, r[\"tipo\"], r[\"periodo\"], r[\"desde\"].isoformat(), r[\"hasta\"].isoformat(),\n                     json.dumps(datos, ensure_ascii=False), actualizado.isoformat(timespec=\"seconds\")))\n\n\ndef leer_consolidado(correo: str, tipo: str) -> pd.DataFrame:\n    with conexion() as con:\n        filas = con.execute(\"SELECT datos, actualizado FROM consolidado WHERE correo = ? AND tipo = ? ORDER BY desde\",\n                            (correo, tipo)).fetchall()\n    registros = []\n    for f in filas:\n        d = json.loads(f[\"datos\"])\n        d[\"actualizado\"] = f[\"actualizado\"]\n        registros.append(d)\n    return pd.DataFrame(registros)\n\n\n# ---------------- Copia de seguridad ----------------\nCABECERA_SQLITE = b\"SQLite format 3\\x00\"\n\n\ndef exportar_copia() -> bytes:\n    \"\"\"Copia completa y consistente de la base de datos (todos los datos de la app).\"\"\"\n    memoria = sqlite3.connect(\":memory:\")\n    with conexion() as con:\n        con.backup(memoria)\n    if hasattr(memoria, \"serialize\"):\n        datos = bytes(memoria.serialize())\n    else:  # alternativa si el Python del celular no trae serialize()\n        import tempfile\n        ruta = os.path.join(tempfile.gettempdir(), \"copia_conductor.db\")\n        if os.path.exists(ruta):\n            os.remove(ruta)\n        archivo = sqlite3.connect(ruta)\n        memoria.backup(archivo)\n        archivo.close()\n        with open(ruta, \"rb\") as f:\n            datos = f.read()\n        os.remove(ruta)\n    memoria.close()\n    return datos\n\n\ndef restaurar_copia(datos: bytes, correo_requerido: str = None) -> list:\n    \"\"\"Reemplaza la base de datos actual por la copia. Valida que sea una copia de esta app\n    (y, si se indica, que contenga la cuenta en uso). Devuelve los correos que trae la copia.\"\"\"\n    if not datos or not datos.startswith(CABECERA_SQLITE):\n        raise ValueError(\"El archivo no es una copia de seguridad de la app (debe ser el .db que descargaste).\")\n    import tempfile\n    ruta_tmp = os.path.join(tempfile.gettempdir(), \"restaurar_conductor.db\")\n    if hasattr(sqlite3.Connection, \"deserialize\"):\n        copia = sqlite3.connect(\":memory:\")\n    else:  # alternativa si el Python del celular no trae deserialize()\n        with open(ruta_tmp, \"wb\") as f:\n            f.write(datos)\n        copia = sqlite3.connect(ruta_tmp)\n    try:\n        if hasattr(copia, \"deserialize\"):\n            copia.deserialize(datos)\n        tablas = {f[0] for f in copia.execute(\"SELECT name FROM sqlite_master WHERE type = 'table'\")}\n        if not {\"usuario\", \"jornada\", \"viaje\", \"configuracion\"} <= tablas:\n            raise ValueError(\"El archivo es una base de datos, pero no de esta app.\")\n        correos = [f[0] for f in copia.execute(\"SELECT correo FROM usuario ORDER BY correo\")]\n        if correo_requerido and correo_requerido not in correos:\n            raise ValueError(f\"La copia no tiene la cuenta {correo_requerido}; restaurarla te dejaría sin acceso.\")\n        with conexion() as con:\n            copia.backup(con)\n    except sqlite3.DatabaseError as e:\n        raise ValueError(f\"No se pudo leer la copia: {e}\")\n    finally:\n        copia.close()\n        if os.path.exists(ruta_tmp):\n            os.remove(ruta_tmp)\n    inicializar()  # agrega columnas nuevas si la copia es de una versión anterior\n    _sincronizar_navegador()\n    return correos\n", "control_conductor.py": "# %% [markdown]\n# # 🚗 Control de costos y gastos — Conductor de plataformas\n# Cuaderno con **trazabilidad completa**: cada cálculo queda registrado con su fórmula,\n# sus datos de entrada y su resultado, para poder auditar de dónde sale cada peso.\n#\n# **Cómo usarlo:** ejecuta las celdas en orden (Entorno de ejecución → Ejecutar todas).\n# La celda *Caso de prueba* valida las fórmulas; después puedes registrar tus propias\n# jornadas y viajes con los formularios.\n\n# %% [markdown]\n# ## 1. Utilidades y trazabilidad\n\n# %%\nimport hashlib\nimport re\nimport hmac\nimport os\nfrom contextlib import contextmanager\nfrom dataclasses import dataclass, field\nfrom datetime import datetime, date, timedelta, timezone\nfrom typing import Optional\n\nimport pandas as pd\n\n\nZONA_COLOMBIA = timezone(timedelta(hours=-5), \"COT\")  # Colombia no tiene horario de verano\n\n\ndef ahora() -> datetime:\n    \"\"\"Fecha y hora actual de Colombia, aunque el servidor esté en otra zona.\"\"\"\n    return datetime.now(ZONA_COLOMBIA).replace(tzinfo=None)\n\n\ndef cop(valor: float, decimales: int = 0) -> str:\n    \"\"\"Formatea pesos colombianos: 1234567.5 -> $1.234.568 (o $1.234.567,50).\"\"\"\n    texto = f\"{abs(valor):,.{decimales}f}\"\n    texto = texto.replace(\",\", \"X\").replace(\".\", \",\").replace(\"X\", \".\")\n    return (\"-$\" if valor < 0 else \"$\") + texto\n\n\nclass Trazabilidad:\n    \"\"\"Bitácora de auditoría: guarda cada cálculo y cada evento del sistema.\"\"\"\n\n    def __init__(self):\n        self._registros = []\n        self.activa = True\n\n    def registrar(self, modulo, operacion, formula, entradas, resultado, usuario=None):\n        if not self.activa:  # consultas de pantalla: calcula sin dejar registro\n            return resultado\n        self._registros.append({\n            \"id\": len(self._registros) + 1,\n            \"fecha_hora\": ahora().strftime(\"%Y-%m-%d %H:%M:%S\"),\n            \"usuario\": usuario,\n            \"modulo\": modulo,\n            \"operacion\": operacion,\n            \"formula\": formula,\n            \"entradas\": \", \".join(f\"{k}={v}\" for k, v in entradas.items()),\n            \"resultado\": round(resultado, 2) if isinstance(resultado, float) else resultado,\n        })\n        return resultado\n\n    def evento(self, modulo, descripcion, usuario=None):\n        return self.registrar(modulo, descripcion, \"-\", {}, \"OK\", usuario)\n\n    def como_tabla(self, modulo: Optional[str] = None) -> pd.DataFrame:\n        df = pd.DataFrame(self._registros)\n        if modulo and not df.empty:\n            df = df[df[\"modulo\"] == modulo]\n        return df\n\n\nclass ErrorValidacion(Exception):\n    pass\n\n\ndef validar_no_negativo(**valores):\n    for nombre, valor in valores.items():\n        if valor is None or valor < 0:\n            raise ErrorValidacion(f\"El campo '{nombre}' no puede estar vacío ni ser negativo.\")\n\n\n# %% [markdown]\n# ## 2. Configuración y modelos de datos\n\n# %%\n@dataclass\nclass Configuracion:\n    umbral_medio: float = 2000          # $/km desde el cual el ingreso es MEDIO\n    umbral_muy_bueno: float = 2500      # $/km desde el cual es MUY BUENO\n    porcentaje_ahorro: float = 0.20\n    dias_alerta_documentos: int = 30\n    porcentaje_alerta_mantenimiento: float = 0.10\n    dias_alerta_mantenimiento: int = 15\n    umbral_hora_medio: float = 28000      # $/hora desde el cual el ingreso es MEDIO\n    umbral_hora_muy_bueno: float = 33000  # $/hora desde el cual es MUY BUENO\n    modo: str = \"auto\"                    # pantalla: auto (según la hora), dia o noche\n    rendimiento_fuente: str = \"declarado\"  # km/galón para estimar combustible: declarado, real o auto\n\n\nSEMAFORO = {\"BAJO\": \"🔴\", \"MEDIO\": \"🟡\", \"MUY BUENO\": \"🟢\"}\n\n\ndef clasificar_ingreso_km(valor_km: float, cfg: Configuracion) -> str:\n    if valor_km >= cfg.umbral_muy_bueno:\n        return \"MUY BUENO\"\n    if valor_km >= cfg.umbral_medio:\n        return \"MEDIO\"\n    return \"BAJO\"\n\n\ndef clasificar_ingreso_hora(valor_hora: float, cfg: Configuracion) -> str:\n    if valor_hora >= cfg.umbral_hora_muy_bueno:\n        return \"MUY BUENO\"\n    if valor_hora >= cfg.umbral_hora_medio:\n        return \"MEDIO\"\n    return \"BAJO\"\n\n\nMETODOS_PAGO = [\"Efectivo\", \"App\", \"Nequi\", \"Daviplata\"]\nICONO_PAGO = {\"Efectivo\": \"💵\", \"App\": \"📱\", \"Nequi\": \"🟣\", \"Daviplata\": \"🔴\"}\n\n\ndef normalizar_pago(metodo: str) -> str:\n    \"\"\"Convierte los valores viejos (\"app\", \"efectivo\") al nombre de la cuenta en la billetera.\"\"\"\n    for m in METODOS_PAGO:\n        if str(metodo).strip().lower() == m.lower():\n            return m\n    raise ErrorValidacion(f\"Medio de pago no válido: {metodo}. Usa {', '.join(METODOS_PAGO)}.\")\n\n\ndef normalizar_identificador(texto: str) -> str:\n    \"\"\"El usuario puede ser un correo o un celular colombiano (el número de WhatsApp).\"\"\"\n    texto = (texto or \"\").strip().lower()\n    if \"@\" in texto:\n        if not re.fullmatch(r\"[^@\\s]+@[^@\\s]+\\.[^@\\s]+\", texto):\n            raise ErrorValidacion(\"Correo inválido.\")\n        return texto\n    digitos = re.sub(r\"\\D\", \"\", texto)\n    if len(digitos) == 12 and digitos.startswith(\"57\"):\n        digitos = digitos[2:]\n    if len(digitos) == 10 and digitos.startswith(\"3\"):\n        return digitos\n    raise ErrorValidacion(\"Escribe un correo válido o un celular de 10 dígitos (por ejemplo 3001234567).\")\n\n\n@dataclass\nclass Usuario:\n    correo: str\n    hash_clave: str\n    sal: str\n    creado: datetime = field(default_factory=ahora)\n\n\n@dataclass\nclass Conductor:\n    nombres: str\n    apellidos: str\n    tipo_documento: str\n    numero_documento: str\n    celular: str\n    ciudad: str\n    plataformas: dict  # {\"Uber\": 0.25, \"DiDi\": 0.20}  -> % de comisión\n\n\n@dataclass\nclass Vehiculo:\n    placa: str\n    tipo: str               # carro / moto\n    marca: str\n    referencia: str\n    modelo: int             # año\n    cilindrada_cc: int\n    combustible: str\n    rendimiento_km_galon: float\n    odometro_km: float\n\n\n@dataclass\nclass Viaje:\n    id: int\n    inicio: datetime\n    fin: datetime\n    plataforma: str\n    valor: float\n    km_pasajero: float\n    metodo_pago: str = \"App\"\n    propina: float = 0.0\n\n\n@dataclass\nclass Jornada:\n    id: int\n    inicio: datetime\n    odometro_inicial: float\n    fin: Optional[datetime] = None\n    odometro_final: Optional[float] = None\n    viajes: list = field(default_factory=list)\n    pausas: list = field(default_factory=list)   # [inicio, fin] — fin None mientras la pausa sigue\n\n    @property\n    def pausa_abierta(self):\n        return next((p for p in self.pausas if p[1] is None), None)\n\n    @property\n    def fecha(self) -> date:\n        return self.inicio.date()\n\n    @property\n    def cerrada(self) -> bool:\n        return self.fin is not None\n\n\n@dataclass\nclass Tanqueo:\n    fecha: date\n    galones: float\n    precio_galon: float\n    odometro_km: float\n\n    @property\n    def total(self) -> float:\n        return self.galones * self.precio_galon\n\n\n@dataclass\nclass ItemMantenimiento:\n    nombre: str\n    categoria: str          # aceite / llantas / general\n    costo: float\n    intervalo_km: float\n    intervalo_meses: int\n    ultimo_km: float\n    ultima_fecha: date\n\n\n@dataclass\nclass DocumentoVehiculo:\n    tipo: str               # SOAT / Técnico-mecánica\n    entidad: str\n    valor: float\n    expedicion: date\n    vencimiento: date\n\n\n@dataclass\nclass GastoExtra:\n    fecha: date\n    concepto: str\n    valor: float\n\n\n@dataclass\nclass MovimientoBilletera:\n    fecha: datetime\n    tipo: str               # Saldo inicial / Entrada / Salida / Traslado\n    cuenta: str\n    valor: float\n    concepto: str = \"\"\n    cuenta_destino: Optional[str] = None\n\n\nTIPOS_MOVIMIENTO = [\"Saldo inicial\", \"Entrada\", \"Salida\", \"Traslado\"]\n\n\n@dataclass\nclass Perfil:\n    \"\"\"Todos los datos de un usuario (cada cuenta solo ve los suyos).\"\"\"\n    conductor: Optional[Conductor] = None\n    vehiculo: Optional[Vehiculo] = None\n    jornadas: list = field(default_factory=list)\n    tanqueos: list = field(default_factory=list)\n    mantenimientos: list = field(default_factory=list)\n    documentos: list = field(default_factory=list)\n    gastos: list = field(default_factory=list)\n    movimientos: list = field(default_factory=list)\n\n\n# %% [markdown]\n# ## 3. Sistema: cuentas, registros, cálculos, alertas y reportes\n\n# %%\nclass SistemaConductor:\n    def __init__(self, config: Optional[Configuracion] = None):\n        self.cfg = config or Configuracion()\n        self.traza = Trazabilidad()\n        self._usuarios = {}\n        self._perfiles = {}\n        self.sesion: Optional[str] = None\n        self._seq_jornada = 0\n        self._seq_viaje = 0\n\n    # ---------------- Actor 1: Cuenta ----------------\n    @staticmethod\n    def _hash(clave: str, sal: str) -> str:\n        sal_bytes = bytes.fromhex(sal)\n        if hasattr(hashlib, \"pbkdf2_hmac\"):\n            return hashlib.pbkdf2_hmac(\"sha256\", clave.encode(), sal_bytes, 100_000).hex()\n        # Respaldo para entornos sin pbkdf2_hmac (algunos compiladores en línea)\n        resultado = sal_bytes + clave.encode()\n        for _ in range(10_000):\n            resultado = hashlib.sha256(resultado).digest()\n        return resultado.hex()\n\n    def crear_cuenta(self, correo: str, clave: str):\n        \"\"\"`correo` puede ser un correo o el número de celular / WhatsApp.\"\"\"\n        correo = normalizar_identificador(correo)\n        if len(clave) < 8:\n            raise ErrorValidacion(\"La contraseña debe tener mínimo 8 caracteres.\")\n        if correo in self._usuarios:\n            raise ErrorValidacion(\"Ya existe una cuenta con ese correo o celular.\")\n        sal = os.urandom(16).hex()\n        self._usuarios[correo] = Usuario(correo, self._hash(clave, sal), sal)\n        self._perfiles[correo] = Perfil()\n        self.traza.evento(\"Cuenta\", f\"Cuenta creada: {correo}\", correo)\n        return correo\n\n    def iniciar_sesion(self, correo: str, clave: str):\n        try:\n            correo = normalizar_identificador(correo)\n        except ErrorValidacion:\n            correo = (correo or \"\").strip().lower()\n        usuario = self._usuarios.get(correo)\n        if not usuario or not hmac.compare_digest(usuario.hash_clave, self._hash(clave, usuario.sal)):\n            self.traza.evento(\"Cuenta\", f\"Intento fallido de inicio de sesión: {correo}\")\n            raise ErrorValidacion(\"Usuario o contraseña incorrectos.\")\n        self.sesion = correo\n        self.traza.evento(\"Cuenta\", \"Inicio de sesión\", correo)\n\n    def cerrar_sesion(self):\n        self.traza.evento(\"Cuenta\", \"Cierre de sesión\", self.sesion)\n        self.sesion = None\n\n    @property\n    def perfil(self) -> Perfil:\n        if not self.sesion:\n            raise ErrorValidacion(\"Debe iniciar sesión primero.\")\n        return self._perfiles[self.sesion]\n\n    @contextmanager\n    def sin_traza(self):\n        \"\"\"Calcula sin registrar en la bitácora (para mostrar pantallas sin llenar la trazabilidad).\"\"\"\n        previo, self.traza.activa = self.traza.activa, False\n        try:\n            yield\n        finally:\n            self.traza.activa = previo\n\n    def _r(self, modulo, operacion, formula, entradas, resultado):\n        return self.traza.registrar(modulo, operacion, formula, entradas, resultado, self.sesion)\n\n    # ---------------- Actores 2 y 3: Conductor y vehículo ----------------\n    def registrar_conductor(self, **datos) -> Conductor:\n        for plataforma, pct in datos.get(\"plataformas\", {}).items():\n            if not 0 <= pct < 1:\n                raise ErrorValidacion(f\"Comisión de {plataforma} debe estar entre 0 y 1 (ej. 0.25).\")\n        self.perfil.conductor = Conductor(**datos)\n        self.traza.evento(\"Conductor\", f\"Conductor registrado: {datos['nombres']} {datos['apellidos']}\", self.sesion)\n        return self.perfil.conductor\n\n    def registrar_vehiculo(self, **datos) -> Vehiculo:\n        validar_no_negativo(cilindrada_cc=datos[\"cilindrada_cc\"], odometro_km=datos[\"odometro_km\"])\n        if datos[\"rendimiento_km_galon\"] <= 0:\n            raise ErrorValidacion(\"El rendimiento debe ser mayor que cero.\")\n        abierta = next((j for j in self.perfil.jornadas if not j.cerrada), None)\n        if abierta and datos[\"odometro_km\"] < abierta.odometro_inicial:\n            raise ErrorValidacion(f\"Hay un turno abierto que empezó con el odómetro en {abierta.odometro_inicial:,.0f} km; \"\n                                  \"el kilometraje del vehículo no puede ser menor.\")\n        self.perfil.vehiculo = Vehiculo(**datos)\n        self.traza.evento(\"Vehículo\", f\"Vehículo registrado: {datos['placa']} {datos['marca']} \"\n                                      f\"{datos['referencia']} {datos['modelo']} {datos['cilindrada_cc']}cc\", self.sesion)\n        return self.perfil.vehiculo\n\n    # ---------------- Actor 4: Jornadas y viajes ----------------\n    def _jornada(self, jornada_id: int) -> Jornada:\n        for j in self.perfil.jornadas:\n            if j.id == jornada_id:\n                return j\n        raise ErrorValidacion(f\"No existe la jornada {jornada_id}.\")\n\n    def abrir_jornada(self, inicio: datetime, odometro_inicial: float) -> Jornada:\n        validar_no_negativo(odometro_inicial=odometro_inicial)\n        if any(not j.cerrada for j in self.perfil.jornadas):\n            raise ErrorValidacion(\"Ya hay una jornada abierta; ciérrela antes de abrir otra.\")\n        for j in self.perfil.jornadas:\n            if j.inicio <= inicio < j.fin:\n                raise ErrorValidacion(f\"La hora de inicio se cruza con el turno del {j.inicio:%d/%m} de \"\n                                      f\"{j.inicio:%H:%M} a {j.fin:%H:%M}. Elige una hora posterior.\")\n        veh = self.perfil.vehiculo\n        # Solo la jornada más reciente manda sobre el kilometraje (registrar un día atrasado no lo cambia)\n        es_la_mas_reciente = all(inicio > j.inicio for j in self.perfil.jornadas)\n        if not es_la_mas_reciente:\n            veh = None\n        if veh and odometro_inicial < veh.odometro_km:\n            raise ErrorValidacion(f\"El odómetro inicial ({odometro_inicial:,.0f} km) no puede ser menor que el kilometraje \"\n                                  f\"del vehículo ({veh.odometro_km:,.0f} km). Si ese dato está mal, corrígelo en \"\n                                  \"Mi perfil → Vehículo.\")\n        self._seq_jornada += 1\n        j = Jornada(self._seq_jornada, inicio, odometro_inicial)\n        self.perfil.jornadas.append(j)\n        if veh and odometro_inicial != veh.odometro_km:\n            self.traza.evento(\"Vehículo\", f\"Kilometraje del vehículo actualizado al abrir jornada: \"\n                                          f\"{veh.odometro_km:,.0f} → {odometro_inicial:,.0f} km\", self.sesion)\n            veh.odometro_km = odometro_inicial\n        self.traza.evento(\"Jornada\", f\"Jornada {j.id} abierta {inicio:%Y-%m-%d %H:%M}, odómetro {odometro_inicial}\", self.sesion)\n        return j\n\n    def registrar_viaje(self, jornada_id, inicio, fin, plataforma, valor, km_pasajero,\n                        metodo_pago=\"App\", propina=0.0) -> Viaje:\n        metodo_pago = normalizar_pago(metodo_pago)\n        j = self._jornada(jornada_id)\n        if j.cerrada:\n            raise ErrorValidacion(\"La jornada ya está cerrada.\")\n        validar_no_negativo(valor=valor, km_pasajero=km_pasajero, propina=propina)\n        if fin <= inicio:\n            raise ErrorValidacion(\"La hora de fin del viaje debe ser posterior a la de inicio.\")\n        if j.pausa_abierta:\n            raise ErrorValidacion(\"El turno está en pausa. Reanúdalo para registrar viajes.\")\n        for a, b in j.pausas:\n            if inicio < b and fin > a:\n                raise ErrorValidacion(f\"El viaje se cruza con la pausa de {a:%H:%M} a {b:%H:%M}.\")\n        if plataforma not in self.perfil.conductor.plataformas:\n            raise ErrorValidacion(f\"La plataforma '{plataforma}' no está registrada para el conductor.\")\n        self._seq_viaje += 1\n        v = Viaje(self._seq_viaje, inicio, fin, plataforma, valor, km_pasajero, metodo_pago, propina)\n        j.viajes.append(v)\n        if km_pasajero > 0:\n            valor_km = self._r(\"Viajes\", f\"Ingreso por km viaje {v.id}\", \"valor / km_pasajero\",\n                               {\"valor\": valor, \"km_pasajero\": km_pasajero}, valor / km_pasajero)\n            self._r(\"Viajes\", f\"Clasificación viaje {v.id}\", \"umbral según $/km\",\n                    {\"valor_km\": round(valor_km, 2)}, clasificar_ingreso_km(valor_km, self.cfg))\n        return v\n\n    def _ubicar_viaje(self, viaje_id: int):\n        for j in self.perfil.jornadas:\n            for v in j.viajes:\n                if v.id == viaje_id:\n                    return j, v\n        raise ErrorValidacion(f\"No existe el viaje {viaje_id}.\")\n\n    def editar_viaje(self, viaje_id, inicio, fin, plataforma, valor, km_pasajero,\n                     metodo_pago=\"App\", propina=0.0) -> Viaje:\n        \"\"\"Corrige un viaje ya guardado y deja en la traza el valor anterior y el nuevo.\"\"\"\n        metodo_pago = normalizar_pago(metodo_pago)\n        j, v = self._ubicar_viaje(viaje_id)\n        validar_no_negativo(valor=valor, km_pasajero=km_pasajero, propina=propina)\n        if valor <= 0 or km_pasajero <= 0:\n            raise ErrorValidacion(\"El valor cobrado y los km con pasajero deben ser mayores que cero.\")\n        if fin <= inicio:\n            raise ErrorValidacion(\"La hora de fin del viaje debe ser posterior a la de inicio.\")\n        for a, b in j.pausas:\n            if inicio < (b or ahora()) and fin > a:\n                raise ErrorValidacion(f\"El viaje se cruza con la pausa que empezó a las {a:%H:%M}.\")\n        if plataforma not in self.perfil.conductor.plataformas:\n            raise ErrorValidacion(f\"La plataforma '{plataforma}' no está registrada para el conductor.\")\n        if j.cerrada:\n            km_otros = sum(x.km_pasajero for x in j.viajes if x.id != viaje_id)\n            if km_otros + km_pasajero > j.odometro_final - j.odometro_inicial:\n                raise ErrorValidacion(\"Con ese cambio, los km con pasajero superarían los km totales de la jornada.\")\n\n        nuevos = {\"inicio\": inicio, \"fin\": fin, \"plataforma\": plataforma, \"valor\": valor,\n                  \"km_pasajero\": km_pasajero, \"metodo_pago\": metodo_pago, \"propina\": propina}\n        cambios = {}\n        for campo, nuevo in nuevos.items():\n            anterior = getattr(v, campo)\n            if anterior != nuevo:\n                fmt = (lambda x: f\"{x:%H:%M}\") if isinstance(nuevo, datetime) else str\n                cambios[campo] = f\"{fmt(anterior)} → {fmt(nuevo)}\"\n                setattr(v, campo, nuevo)\n        if not cambios:\n            raise ErrorValidacion(\"No hiciste ningún cambio en el viaje.\")\n        j.viajes.sort(key=lambda x: x.inicio)\n        self._r(\"Viajes\", f\"Edición viaje {v.id}\", \"valor anterior → valor nuevo\", cambios, \"EDITADO\")\n        valor_km = self._r(\"Viajes\", f\"Ingreso por km viaje {v.id} (corregido)\", \"valor / km_pasajero\",\n                           {\"valor\": valor, \"km_pasajero\": km_pasajero}, valor / km_pasajero)\n        self._r(\"Viajes\", f\"Clasificación viaje {v.id} (corregida)\", \"umbral según $/km\",\n                {\"valor_km\": round(valor_km, 2)}, clasificar_ingreso_km(valor_km, self.cfg))\n        return v\n\n    def eliminar_viaje(self, viaje_id: int) -> Viaje:\n        j, v = self._ubicar_viaje(viaje_id)\n        j.viajes.remove(v)\n        self.traza.evento(\"Viajes\", f\"Viaje {v.id} eliminado de la jornada {j.id}: {v.plataforma}, \"\n                                    f\"{cop(v.valor)}, {v.km_pasajero} km, {v.inicio:%H:%M}-{v.fin:%H:%M}\", self.sesion)\n        return v\n\n    def cerrar_jornada(self, jornada_id: int, fin: datetime, odometro_final: float):\n        j = self._jornada(jornada_id)\n        if fin <= j.inicio:\n            raise ErrorValidacion(\"La hora de cierre debe ser posterior a la de inicio.\")\n        if odometro_final < j.odometro_inicial:\n            raise ErrorValidacion(\"El odómetro final no puede ser menor que el inicial.\")\n        km_pasajero = sum(v.km_pasajero for v in j.viajes)\n        if km_pasajero > odometro_final - j.odometro_inicial:\n            raise ErrorValidacion(\"Los km con pasajero superan los km totales del día.\")\n        pausa = j.pausa_abierta\n        if pausa:\n            if fin < pausa[0]:\n                raise ErrorValidacion(f\"La hora de cierre es anterior al inicio de la pausa ({pausa[0]:%H:%M}).\")\n            pausa[1] = fin\n            self.traza.evento(\"Jornada\", f\"Pausa del turno {j.id} terminada al cerrar ({pausa[0]:%H:%M}-{fin:%H:%M})\",\n                              self.sesion)\n        j.fin, j.odometro_final = fin, odometro_final\n        if self.perfil.vehiculo and odometro_final > self.perfil.vehiculo.odometro_km:\n            self.traza.evento(\"Vehículo\", f\"Kilometraje del vehículo actualizado al cerrar jornada: \"\n                                          f\"{self.perfil.vehiculo.odometro_km:,.0f} → {odometro_final:,.0f} km\", self.sesion)\n            self.perfil.vehiculo.odometro_km = odometro_final\n        self.traza.evento(\"Jornada\", f\"Jornada {j.id} cerrada {fin:%H:%M}, odómetro {odometro_final}\", self.sesion)\n\n    # ---------------- Pausas dentro del turno ----------------\n    def pausar_turno(self, jornada_id: int, inicio: datetime) -> list:\n        j = self._jornada(jornada_id)\n        if j.cerrada:\n            raise ErrorValidacion(\"El turno ya está cerrado.\")\n        if j.pausa_abierta:\n            raise ErrorValidacion(f\"El turno ya está en pausa desde las {j.pausa_abierta[0]:%H:%M}.\")\n        if inicio < j.inicio:\n            raise ErrorValidacion(f\"La pausa no puede empezar antes del inicio del turno ({j.inicio:%H:%M}).\")\n        ultimo = max((v.fin for v in j.viajes), default=j.inicio)\n        if inicio < ultimo:\n            raise ErrorValidacion(f\"La pausa no puede empezar antes de que termine el último viaje ({ultimo:%H:%M}).\")\n        if any(p[1] and p[0] < inicio < p[1] for p in j.pausas):\n            raise ErrorValidacion(\"Esa hora cae dentro de otra pausa.\")\n        pausa = [inicio, None]\n        j.pausas.append(pausa)\n        self.traza.evento(\"Jornada\", f\"Turno {j.id} en pausa desde {inicio:%H:%M}\", self.sesion)\n        return pausa\n\n    def reanudar_turno(self, jornada_id: int, fin: datetime) -> list:\n        j = self._jornada(jornada_id)\n        pausa = j.pausa_abierta\n        if not pausa:\n            raise ErrorValidacion(\"El turno no está en pausa.\")\n        if fin <= pausa[0]:\n            raise ErrorValidacion(f\"La hora de regreso debe ser posterior al inicio de la pausa ({pausa[0]:%H:%M}).\")\n        pausa[1] = fin\n        minutos = (fin - pausa[0]).total_seconds() / 60\n        self._r(\"Jornada\", f\"Pausa del turno {j.id}\", \"fin de la pausa − inicio de la pausa (no cuenta como trabajo)\",\n                {\"inicio\": f\"{pausa[0]:%H:%M}\", \"fin\": f\"{fin:%H:%M}\"}, f\"{minutos:.0f} min\")\n        return pausa\n\n    def horas_pausa(self, j: Jornada, desde: datetime, hasta: datetime) -> float:\n        \"\"\"Horas de pausa del turno que caen entre `desde` y `hasta` (una pausa abierta llega hasta el corte).\"\"\"\n        corte = self.corte_jornada(j)\n        total = 0.0\n        for a, b in j.pausas:\n            b = b or corte\n            total += max(0.0, (min(b, hasta) - max(a, desde)).total_seconds())\n        return total / 3600\n\n    # ---------------- Eliminar un día trabajado ----------------\n    def eliminar_dia(self, fecha: date) -> list:\n        \"\"\"Borra los turnos que empezaron ese día, con sus viajes y pausas. Devuelve los turnos borrados.\"\"\"\n        borrar = [j for j in self.perfil.jornadas if j.inicio.date() == fecha]\n        if not borrar:\n            raise ErrorValidacion(f\"No hay turnos que empiecen el {fecha:%d/%m/%Y}.\")\n        if any(not j.cerrada for j in borrar):\n            raise ErrorValidacion(\"Ese día tiene un turno abierto. Ciérralo antes de eliminar el día.\")\n        for j in borrar:\n            self.perfil.jornadas.remove(j)\n            self.traza.evento(\"Jornada\", f\"Día {fecha:%d/%m/%Y} eliminado: turno {j.id} {j.inicio:%H:%M}-{j.fin:%H:%M}, \"\n                                         f\"{len(j.viajes)} viaje(s) por {cop(sum(v.valor for v in j.viajes))}, \"\n                                         f\"{(j.odometro_final - j.odometro_inicial):,.0f} km\", self.sesion)\n        return borrar\n\n    # ---------------- Actores 5 a 9 ----------------\n    def registrar_tanqueo(self, fecha, galones, precio_galon, odometro_km) -> Tanqueo:\n        validar_no_negativo(galones=galones, precio_galon=precio_galon, odometro_km=odometro_km)\n        t = Tanqueo(fecha, galones, precio_galon, odometro_km)\n        self.perfil.tanqueos.append(t)\n        veh = self.perfil.vehiculo\n        if veh and odometro_km > veh.odometro_km:\n            self.traza.evento(\"Vehículo\", f\"Kilometraje del vehículo actualizado con el tanqueo: \"\n                                          f\"{veh.odometro_km:,.0f} → {odometro_km:,.0f} km\", self.sesion)\n            veh.odometro_km = odometro_km\n        self._r(\"Combustible\", \"Tanqueo\", \"galones × precio_galon\",\n                {\"galones\": galones, \"precio_galon\": precio_galon}, t.total)\n        return t\n\n    def registrar_mantenimiento(self, nombre, categoria, costo, intervalo_km, intervalo_meses,\n                                ultimo_km, ultima_fecha) -> ItemMantenimiento:\n        if categoria not in (\"aceite\", \"llantas\", \"general\"):\n            raise ErrorValidacion(\"Categoría debe ser: aceite, llantas o general.\")\n        validar_no_negativo(costo=costo, ultimo_km=ultimo_km)\n        if intervalo_km <= 0:\n            raise ErrorValidacion(\"El intervalo en km debe ser mayor que cero.\")\n        item = ItemMantenimiento(nombre, categoria, costo, intervalo_km, intervalo_meses, ultimo_km, ultima_fecha)\n        self.perfil.mantenimientos.append(item)\n        self._r(\"Mantenimiento\", f\"Costo por km — {nombre}\", \"costo / intervalo_km\",\n                {\"costo\": costo, \"intervalo_km\": intervalo_km}, costo / intervalo_km)\n        return item\n\n    def registrar_documento(self, tipo, entidad, valor, expedicion, vencimiento) -> DocumentoVehiculo:\n        validar_no_negativo(valor=valor)\n        if vencimiento <= expedicion:\n            raise ErrorValidacion(\"La fecha de vencimiento debe ser posterior a la de expedición.\")\n        d = DocumentoVehiculo(tipo, entidad, valor, expedicion, vencimiento)\n        self.perfil.documentos.append(d)\n        self._r(\"Documentos\", f\"Provisión diaria — {tipo}\", \"valor / 365\", {\"valor\": valor}, valor / 365)\n        return d\n\n    def editar_documento(self, d: DocumentoVehiculo, tipo, entidad, valor, expedicion, vencimiento):\n        validar_no_negativo(valor=valor)\n        if vencimiento <= expedicion:\n            raise ErrorValidacion(\"La fecha de vencimiento debe ser posterior a la de expedición.\")\n        nuevos = {\"tipo\": tipo, \"entidad\": entidad, \"valor\": valor, \"expedicion\": expedicion, \"vencimiento\": vencimiento}\n        cambios = {}\n        for campo, nuevo in nuevos.items():\n            anterior = getattr(d, campo)\n            if anterior != nuevo:\n                cambios[campo] = f\"{anterior} → {nuevo}\"\n                setattr(d, campo, nuevo)\n        if not cambios:\n            raise ErrorValidacion(\"No hiciste ningún cambio en el documento.\")\n        self._r(\"Documentos\", f\"Edición {d.tipo}\", \"valor anterior → valor nuevo\", cambios, \"EDITADO\")\n        self._r(\"Documentos\", f\"Provisión diaria — {d.tipo} (corregida)\", \"valor / 365\", {\"valor\": d.valor}, d.valor / 365)\n        return d\n\n    def eliminar_documento(self, d: DocumentoVehiculo):\n        self.perfil.documentos.remove(d)\n        self.traza.evento(\"Documentos\", f\"{d.tipo} eliminado: {d.entidad}, {cop(d.valor)}, \"\n                                        f\"{d.expedicion:%d/%m/%Y} a {d.vencimiento:%d/%m/%Y}\", self.sesion)\n\n    def registrar_gasto(self, fecha, concepto, valor) -> GastoExtra:\n        validar_no_negativo(valor=valor)\n        g = GastoExtra(fecha, concepto, valor)\n        self.perfil.gastos.append(g)\n        self.traza.evento(\"Gastos\", f\"Gasto {concepto}: {cop(valor)}\", self.sesion)\n        return g\n\n    def precio_galon_dia(self, fecha: date) -> float:\n        \"\"\"Precio del último tanqueo hecho hasta ese día (o el más antiguo si todos son posteriores).\"\"\"\n        if not self.perfil.tanqueos:\n            raise ErrorValidacion(\"Registre al menos un tanqueo para conocer el precio del galón.\")\n        previos = [t for t in self.perfil.tanqueos if t.fecha <= fecha]\n        candidatos = previos or self.perfil.tanqueos\n        elegir = max if previos else min\n        return elegir(candidatos, key=lambda t: (t.fecha, t.odometro_km)).precio_galon\n\n    def precio_galon_vigente(self) -> float:\n        if not self.perfil.tanqueos:\n            raise ErrorValidacion(\"Registre al menos un tanqueo para conocer el precio del galón.\")\n        return max(self.perfil.tanqueos, key=lambda t: (t.fecha, t.odometro_km)).precio_galon\n\n    def _rendimiento_real_valor(self) -> Optional[float]:\n        \"\"\"Método de tanque lleno: km entre tanqueos / galones del segundo tanqueo (sin dejar traza).\"\"\"\n        t = sorted(self.perfil.tanqueos, key=lambda x: x.odometro_km)\n        valores = [(b.odometro_km - a.odometro_km) / b.galones for a, b in zip(t, t[1:])\n                   if b.galones > 0 and b.odometro_km > a.odometro_km]\n        return sum(valores) / len(valores) if valores else None\n\n    def rendimiento_usado(self) -> tuple:\n        \"\"\"Km por galón con que se estima el combustible: (valor, de dónde sale).\n        Automático = el real de tus tanqueos si ya hay datos confiables; si no, el declarado del vehículo.\"\"\"\n        declarado = self.perfil.vehiculo.rendimiento_km_galon\n        real = self._rendimiento_real_valor()\n        confiable = real is not None and 5 <= real <= 200\n        if self.cfg.rendimiento_fuente == \"declarado\" or not confiable:\n            return declarado, \"declarado del vehículo\"\n        return real, \"real de tus tanqueos\"\n\n    def estimar_combustible(self, km: float, fecha: Optional[date] = None, registrar: bool = False) -> dict:\n        \"\"\"Gasto aproximado de combustible para unos km: galones = km ÷ km/galón; costo = galones × precio.\"\"\"\n        validar_no_negativo(km=km)\n        rend, fuente = self.rendimiento_usado()\n        precio = self.precio_galon_dia(fecha) if fecha else self.precio_galon_vigente()\n        galones = km / rend\n        costo = galones * precio\n        if registrar:\n            self._r(\"Combustible\", \"Gasto estimado de combustible\", \"km ÷ km_por_galón × precio_galón\",\n                    {\"km\": round(km, 1), \"km_por_galon\": round(rend, 2), \"fuente\": fuente, \"precio_galon\": precio},\n                    round(costo, 2))\n        return {\"km\": km, \"rendimiento\": rend, \"fuente\": fuente, \"precio_galon\": precio,\n                \"costo_km\": precio / rend, \"galones\": galones, \"costo\": costo}\n\n    def rendimiento_real(self) -> Optional[float]:\n        \"\"\"Método de tanque lleno: km entre tanqueos / galones del segundo tanqueo.\"\"\"\n        t = sorted(self.perfil.tanqueos, key=lambda x: x.odometro_km)\n        promedio = self._rendimiento_real_valor()\n        if promedio is None:\n            return None\n        return self._r(\"Combustible\", \"Rendimiento real\", \"promedio((odo2 − odo1) / galones2)\",\n                       {\"tanqueos\": len(t), \"declarado\": self.perfil.vehiculo.rendimiento_km_galon}, promedio)\n\n    def _documentos_vigentes(self):\n        ultimos = {}\n        for d in self.perfil.documentos:\n            if d.tipo not in ultimos or d.vencimiento > ultimos[d.tipo].vencimiento:\n                ultimos[d.tipo] = d\n        return list(ultimos.values())\n\n    # ---------------- Actores 10 y 11: cálculo diario ----------------\n    def calcular_jornada(self, jornada_id: int) -> dict:\n        j = self._jornada(jornada_id)\n        if not j.cerrada:\n            raise ErrorValidacion(\"Cierre la jornada antes de calcularla.\")\n        p, cfg, M = self.perfil, self.cfg, f\"Cálculo jornada {j.id}\"\n        r = lambda op, formula, ent, res: self._r(M, op, formula, ent, res)\n\n        km_tot = r(\"Km totales\", \"odómetro final − odómetro inicial\",\n                   {\"odo_final\": j.odometro_final, \"odo_inicial\": j.odometro_inicial},\n                   float(j.odometro_final - j.odometro_inicial))\n        pausa_h = self.horas_pausa(j, j.inicio, j.fin)\n        horas = r(\"Horas trabajadas\", \"hora fin − hora inicio − pausas\",\n                  {\"inicio\": f\"{j.inicio:%H:%M}\", \"fin\": f\"{j.fin:%H:%M}\", \"pausas_h\": round(pausa_h, 2)},\n                  (j.fin - j.inicio).total_seconds() / 3600 - pausa_h)\n        n = r(\"Número de viajes\", \"conteo(viajes)\", {}, len(j.viajes))\n        km_pas = r(\"Km con pasajero\", \"Σ km_pasajero\", {\"viajes\": n}, float(sum(v.km_pasajero for v in j.viajes)))\n        km_vacio = r(\"Km en vacío\", \"km_totales − km_pasajero\", {\"km_totales\": km_tot, \"km_pasajero\": km_pas},\n                     km_tot - km_pas)\n        bruto = r(\"Ingreso bruto\", \"Σ valor viajes\", {\"viajes\": n}, float(sum(v.valor for v in j.viajes)))\n        propinas = r(\"Propinas\", \"Σ propinas\", {}, float(sum(v.propina for v in j.viajes)))\n        comision = r(\"Comisión plataformas\", \"Σ (valor × % comisión plataforma)\",\n                     {\"comisiones\": p.conductor.plataformas},\n                     float(sum(v.valor * p.conductor.plataformas[v.plataforma] for v in j.viajes)))\n\n        p
